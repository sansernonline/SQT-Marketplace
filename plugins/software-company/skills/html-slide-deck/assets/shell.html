<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ===== tokens — change the 4 accent values per brand, nothing else ===== */
:root{--accent:#e10613;--accent2:#ff2536;--accent-deep:#2a0a0d;--accent-tint:#1d0d10;
  --bg:#09090a;--panel:#16161a;--line:#2a2a30;--text:#f5f5f4;--soft:#d4d4d8;--muted:#a3a3a8;--dim:#8a8a92;
  --ok:#22c55e;--warn:#f59e0b;--blue:#60a5fa;
  --head:'Chakra Petch',Tahoma,sans-serif;--body:'IBM Plex Sans Thai',Tahoma,sans-serif;--mono:'JetBrains Mono',Consolas,monospace}
*{margin:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--text)}
/* ===== 1920×1080 stage, scaled to the window ===== */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s;background:var(--bg);padding:112px 128px 150px;display:flex;flex-direction:column;gap:36px}
.slide.on{opacity:1;visibility:visible}
.slide aside{display:none}
.slide.hero{justify-content:center;gap:28px;padding:128px;background:radial-gradient(ellipse at 80% 40%,var(--accent-deep),var(--bg) 60%)}
.slide.close{justify-content:center;align-items:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,var(--accent-deep),var(--bg) 60%)}
.divider{justify-content:center;background:radial-gradient(ellipse at 20% 50%,var(--accent-deep),var(--bg) 60%)}
.divider .num{font-family:var(--head);font-size:200px;font-weight:700;color:var(--accent2);line-height:1}
/* ===== type ===== */
.kicker{font-family:var(--head);font-size:24px;font-weight:700;color:var(--accent2)}
h1{font-family:var(--head);font-size:132px;font-weight:700;line-height:1.05}
h2{font-family:var(--head);font-size:56px;font-weight:700;line-height:1.2}
h3{font-size:32px;font-weight:700;line-height:1.4}
p,li{line-height:1.5}
.lead{font-size:44px}.sub{font-size:28px;color:var(--soft)}.note{font-size:24px;color:var(--muted)}
.rule{width:120px;height:8px;background:var(--accent)}
.big{font-family:var(--head);font-size:96px;font-weight:700;line-height:1;color:var(--accent2)}
.mono{font-family:var(--mono)}
.foot{position:absolute;left:128px;bottom:56px;font-size:22px;color:var(--dim)}
.pg{position:absolute;right:128px;bottom:56px;font-size:22px;color:var(--muted)}
/* ===== layout pieces ===== */
.row{display:flex;gap:32px}.col{display:flex;flex-direction:column;gap:16px}.grow{flex:1;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.tag{display:inline-block;font:600 18px var(--mono);padding:4px 10px;border-radius:8px;background:#26262b;color:var(--soft)}
.tag.accent{background:var(--accent-deep);color:var(--accent2)}.tag.ok{background:#0f2e1b;color:#4ade80}.tag.blue{background:#0f2340;color:#93c5fd}
.tbl{width:100%;border-collapse:collapse;font-size:24px}
.tbl th{font:600 18px var(--mono);color:var(--dim);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid #1f1f24;color:var(--soft);vertical-align:top}
.tbl td.m{font:20px var(--mono);color:var(--text)}
.pills{display:flex;flex-wrap:wrap;gap:10px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:22px}
.pill b{font-family:var(--mono);color:var(--accent2);margin-right:8px}
.list{display:flex;flex-direction:column;gap:8px;overflow:auto}
.list>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:22px;display:flex;gap:12px;align-items:baseline}
.list>div b{font:600 19px var(--mono);color:var(--accent2);flex:none}
pre.code{font:22px/1.55 var(--mono);color:#cbd5e1;background:#000;border:1px solid #222;border-radius:14px;padding:28px 32px;white-space:pre-wrap;overflow:hidden}
pre.code em{font-style:normal;color:var(--accent2)}pre.code i{font-style:normal;color:var(--dim)}
/* agenda */
.toc{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:16px 40px}
.toc a{display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 24px;color:var(--text);text-decoration:none;cursor:pointer}
.toc a:hover{border-color:var(--accent2)}
.toc .n{font:800 44px var(--head);color:var(--accent2);width:50px;flex:none}
.toc b{font-size:30px}.toc span{font-size:22px;color:var(--muted);display:block}
.toc .p{margin-left:auto;font:18px var(--mono);color:var(--dim)}
/* click an item → its <template> fills the detail panel */
[data-pick]{cursor:pointer;transition:border-color .15s,background .15s}
[data-pick]:hover{border-color:#55555d}
[data-pick].sel{border-color:var(--accent2);background:var(--accent-tint)}
[data-pick] template{display:none}
.detail{background:#0f0f12;border:1px solid var(--line);border-radius:16px;padding:28px 32px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.detail .path{font:600 24px var(--mono);color:var(--accent2);word-break:break-all}
.detail p{font-size:26px;color:var(--soft)}
.detail pre{font:19px/1.5 var(--mono);color:#cbd5e1;background:#000;border:1px solid #222;border-radius:10px;padding:16px 18px;white-space:pre-wrap;word-break:break-word;max-height:330px;overflow:auto}
/* system map: absolute boxes + svg arrows (draw once, coordinates in px of the map) */
.map{position:relative;flex:none}
.map svg{position:absolute;inset:0}
.map svg>path{stroke:#8a8a92;stroke-width:2;fill:none;marker-end:url(#ah)}
.map svg text{font:15px var(--mono);fill:var(--muted)}
.box{position:absolute;width:250px;height:90px;background:#232327;border:2px solid #4a4a52;border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.box b{font-size:22px}.box span{font-size:17px;color:var(--muted)}
.box.user{border-color:#1e3a5f;background:#0f1623}.box.ext{border-style:dashed;border-color:var(--accent-deep)}
.group{position:absolute;border:2px solid var(--accent2);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;background:var(--accent-tint)}
.group .gtitle{font:700 20px var(--head);color:var(--accent2)}
.layer{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.layer b{font-size:21px}.layer span{font:17px var(--mono);color:var(--muted)}
.layer.core{border-color:var(--accent);background:var(--accent-deep)}
/* phone chat replay: <div class="chatlog" data-chat> with <p data-u> / <p data-a> lines */
.phone{width:400px;flex:none;border:10px solid #26262b;border-radius:44px;background:#0d0d10;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.phone .bar{background:#141418;padding:16px 18px;font-size:18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #222}
.phone .bar i{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block}
.chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chatlog>p{display:none}
.b{max-width:85%;padding:12px 15px;border-radius:16px;font-size:19px;line-height:1.5;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:#1f1f24;color:var(--text);border-bottom-left-radius:4px}
.typing{align-self:flex-start;background:#1f1f24;border-radius:16px;padding:12px 16px;display:flex;gap:6px}
.typing span{width:9px;height:9px;border-radius:50%;background:#777;animation:bl 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* bar chart: <div class="bars"><div data-v="2.7" data-l="Q01"></div>…</div> */
.bars{display:flex;gap:8px;align-items:flex-end;height:250px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.bars .v{font:16px var(--mono);color:var(--soft)}.bars .l{font:16px var(--mono);color:var(--dim)}
.growbar{width:100%;height:0;background:var(--accent2);border-radius:6px 6px 0 0;transition:height .9s cubic-bezier(.2,.7,.2,1)}
.shot{max-width:100%;max-height:420px;border-radius:10px;border:1px solid #333;cursor:zoom-in}
/* ===== motion: children rise in, numbers count up, [data-loop] lights one child at a time ===== */
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}
.slide.on>*{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.slide.on>*:nth-child(2){animation-delay:.08s}.slide.on>*:nth-child(3){animation-delay:.16s}.slide.on>*:nth-child(4){animation-delay:.24s}
.slide.on>.foot,.slide.on>.pg{animation:none}
.slide.on [data-k]{animation:up .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--k) * 70ms + 220ms)}
.slide.on.divider .num{animation:slideIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent2) 28%,transparent)}}
.slide.on .box[data-k],.slide.on .layer[data-k]{animation-name:pop}
.slide.on .map svg>path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease-out both;animation-delay:calc(var(--k,0) * 120ms + .5s)}
.lit{border-color:var(--accent2)!important;background:var(--accent-tint)!important;animation:glow 1.4s ease-in-out infinite}
/* map tour: a step lights its boxes (data-key) and arrows (id), a dot runs along each arrow */
.map svg>path.hot{stroke:var(--accent2);stroke-width:3;marker-end:url(#ahh)}
.map .tour{border-color:var(--accent2)!important;background:var(--accent-tint)!important}
.tourbar{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tourbar button{font:600 17px var(--body);padding:0 12px;height:44px;white-space:nowrap;flex:none;background:#26262b;color:#fff;border:1px solid #3a3a40;border-radius:9px;cursor:pointer}
.tourbar button:hover{background:#33333a}.tourbar .pp{background:var(--accent);border-color:var(--accent)}
.tourbar .tstep{font:600 17px var(--mono);color:var(--dim);margin:0 6px;min-width:52px}
.tourbar .tcap{font-size:20px;color:var(--soft);line-height:1.35}
ol.tour-steps{display:none}
@media (prefers-reduced-motion:reduce){.slide.on>*,.slide.on [data-k],.slide.on .map svg>path,.lit{animation:none!important;stroke-dashoffset:0}}
/* ===== chrome: progress bar, side arrows, menu, notes, clock ===== */
#bar{position:fixed;left:0;right:0;bottom:0;height:20px;display:flex;gap:1px;z-index:6}
#bar i{flex:1;height:100%;position:relative;cursor:pointer}
#bar i::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:#2a2a30;transition:background .3s,height .15s}
#bar i.done::after,#bar i.now::after{background:var(--accent2)}
#bar i:hover::after{height:10px;background:#fff}
#bartip{position:fixed;bottom:26px;z-index:7;background:#16161a;color:#fff;border:1px solid #3a3a40;border-radius:8px;padding:6px 12px;font:15px var(--body);white-space:nowrap;pointer-events:none;display:none;transform:translateX(-50%)}
#bartip b{font:600 13px var(--mono);color:var(--accent2);margin-right:8px}#bartip span{color:var(--dim);margin-left:8px;font-size:13px}
#ui{position:fixed;right:16px;bottom:14px;display:flex;gap:8px;align-items:center;z-index:5;font:14px Tahoma,sans-serif;color:var(--muted);opacity:.35;transition:opacity .2s}
#ui:hover{opacity:1}
#ui button{background:#16161a;color:var(--text);border:1px solid #3a3a40;border-radius:8px;padding:6px 12px;font:14px Tahoma,sans-serif;cursor:pointer}
#clock{font:600 14px var(--mono);color:var(--muted);min-width:110px;text-align:right}
#clock.over{color:var(--accent2)}
#notes{position:fixed;left:16px;right:16px;bottom:24px;max-height:32vh;overflow:auto;background:rgba(18,18,20,.96);color:#e5e5e5;border:1px solid #3a3a40;border-radius:12px;padding:16px 20px;font:18px/1.6 var(--body);display:none;z-index:6}
#notes.on{display:block}#notes b{color:var(--accent2)}
#notes .nclose{position:sticky;top:0;float:right;margin:-6px -8px 4px 12px;font:700 18px var(--body);background:#26262b;color:#fff;border:1px solid #3a3a40;border-radius:8px;width:36px;height:36px;cursor:pointer}
#menu{position:fixed;inset:0;background:rgba(6,6,8,.96);z-index:15;display:none;overflow:auto;padding:32px 4vw 40px}
#menu.on{display:block}
#menu .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
#menu .mhead b{font:700 30px var(--head);color:#fff}#menu .mhead span{font-size:15px;color:var(--dim);margin-left:14px;font-weight:400}
#menu .mclose{font:600 17px var(--body);background:#26262b;color:#fff;border:1px solid #3a3a40;border-radius:10px;padding:9px 18px;cursor:pointer}
#menuList{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
#menu .part{background:#121215;border:1px solid #26262b;border-radius:14px;padding:16px 18px}
#menu .part h5{font:700 21px var(--head);color:var(--accent2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #2a2a30}
#menu ul{list-style:none;padding:0;margin:0}
#menu li{display:flex;gap:10px;align-items:baseline;padding:4px 8px;margin:1px -9px;border:1px solid transparent;border-radius:8px;cursor:pointer;font-size:16px;color:var(--soft)}
#menu li i{font:700 15px var(--mono);color:var(--accent2);font-style:normal;width:22px;flex:none}
#menu li:hover{background:#1f1f24;color:#fff}
#menu li.cur{background:var(--accent-deep);color:#fff;font-weight:700;border-color:var(--accent2)}
.edge{position:fixed;top:0;bottom:0;width:64px;z-index:4;cursor:pointer;display:flex;align-items:center;justify-content:center;font:400 64px var(--head);color:transparent;transition:color .2s;user-select:none}
.edge.l{left:0}.edge.r{right:0}.edge:hover{color:#fff}.edge.off{display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#zoom.on{display:flex}#zoom img{max-width:94vw;max-height:94vh}
/*EXTRA_CSS*/
</style></head><body>
<div id="stage">
<!--SLIDES-->
</div>
<div id="menu"><div class="mhead"><b>สารบัญ<span>คลิกหน้าที่ต้องการ · กด M หรือ Esc เพื่อปิด</span></b><button class="mclose" type="button">✕ ปิด</button></div><div id="menuList"></div></div>
<div class="edge l" title="ก่อนหน้า (←)">‹</div><div class="edge r" title="ถัดไป (→)">›</div><div id="bar"></div><div id="bartip"></div>
<div id="notes"><button class="nclose" type="button" title="ปิดบันทึก (N)">✕</button><div id="notesBody"></div></div><div id="zoom"><img alt=""></div>
<div id="ui"><span id="clock" title="เวลาที่ใช้ / เวลาที่ควรถึงหน้านี้ (กด T เริ่ม/หยุด)">0:00</span><button id="prev" title="ก่อนหน้า (←)">‹</button><span id="count"></span><button id="next" title="ถัดไป (→)">›</button><button id="mb" title="สารบัญทุกหน้า (M)">สารบัญ</button><button id="nb" title="บันทึกผู้พูด (N)">โน้ต</button><button id="fs" title="เต็มจอ (F)">เต็มจอ</button></div>
<script>
const DATA=/*DATA*/null;
const S=[...document.querySelectorAll('.slide')],stage=document.getElementById('stage'),notes=document.getElementById('notes');
let i=Math.min(Math.max(parseInt(location.hash.slice(1))||1,1),S.length)-1;
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('bar').innerHTML=S.map((s,j)=>`<i data-n="${j}"></i>`).join('');
S.forEach((s,j)=>{const p=s.querySelector('.pg');if(p)p.textContent=String(j+1).padStart(2,'0')});
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k}) translate(-50%,-50%)`;}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,j)=>s.classList.toggle('on',j===i));
  $('count').textContent=`${i+1} / ${S.length}`;document.querySelectorAll('#bar i').forEach((b,j)=>b.className=j<i?'done':j===i?'now':'');
  const a=S[i].querySelector('aside');$('notesBody').innerHTML=a?a.innerHTML:'(ไม่มีบันทึก)';history.replaceState(null,'','#'+(i+1));tick();S.forEach(s=>s._player&&s._player.reset());
  document.querySelector('.edge.l').classList.toggle('off',i===0);document.querySelector('.edge.r').classList.toggle('off',i===S.length-1);onSlide(S[i]);}
/* presenter clock: data-at="m:ss" on a slide = when you should reach it; turns accent when 30 s late */
let t0=null,acc=0;
const secs=()=>acc+(t0?(Date.now()-t0)/1000:0),fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function tick(){const c=$('clock'),at=S[i].dataset.at||'';c.textContent=fmt(secs())+(at?' / '+at:'');const [m,s]=(at||'99:0').split(':').map(Number);c.classList.toggle('over',secs()>m*60+s+30);}
setInterval(tick,1000);
function timer(){if(t0){acc=secs();t0=null}else t0=Date.now();tick()}
function fs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
/* keys: ← → change page only · Space plays/pauses this page's player · ↓ ↑ next/previous player step */
function key(k){if(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return false;
  const pl=S[i]._player;
  if(['ArrowRight','PageDown'].includes(k))show(i+1);else if(['ArrowLeft','PageUp','Backspace'].includes(k))show(i-1);
  else if(k===' '){if(pl)pl.play()}else if(k==='ArrowDown'){if(pl)pl.next()}else if(k==='ArrowUp'){if(pl)pl.back()}
  else if(k==='Home')show(0);else if(k==='End')show(S.length-1);else if(k==='f'||k==='F')fs();else if(k==='n'||k==='N')notes.classList.toggle('on');
  else if(k==='t'||k==='T')timer();else if(k==='m'||k==='M')menu();else if(k==='Escape'){$('zoom').classList.remove('on');menu(false);}
  else return false;return true}
addEventListener('keydown',e=>{if(key(e.key)&&[' ','ArrowUp','ArrowDown'].includes(e.key))e.preventDefault()});addEventListener('resize',fit);
addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1));if(n)show(n-1);});
let x0=null;addEventListener('touchstart',e=>x0=e.touches[0].clientX);addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>80)show(d<0?i+1:i-1);x0=null;});
$('prev').onclick=()=>show(i-1);$('next').onclick=()=>show(i+1);$('fs').onclick=fs;
$('nb').onclick=()=>notes.classList.toggle('on');notes.querySelector('.nclose').onclick=()=>notes.classList.remove('on');
document.querySelector('.edge.l').onclick=()=>show(i-1);document.querySelector('.edge.r').onclick=()=>show(i+1);
/* menu (M): data-part starts a group, data-menu names the page */
const idx=id=>S.findIndex(s=>s.id===id),menuEl=$('menu');
$('menuList').innerHTML=S.reduce((h,s,j)=>{const name=s.dataset.menu||(s.querySelector('h2,h1')||{}).textContent||'';
  return h+(s.dataset.part?(j?'</ul></div>':'')+`<div class="part"><h5>${esc(s.dataset.part)}</h5><ul>`:'')+`<li data-n="${j}"><i>${String(j+1).padStart(2,'0')}</i>${esc(name)}</li>`},'')+'</ul></div>';
function menu(open){menuEl.classList.toggle('on',open===undefined?!menuEl.classList.contains('on'):open);menuEl.querySelectorAll('li').forEach(l=>l.classList.toggle('cur',+l.dataset.n===i));}
$('menuList').addEventListener('click',e=>{const l=e.target.closest('li');if(l){show(+l.dataset.n);menu(false);}});
menuEl.querySelector('.mclose').onclick=()=>menu(false);menuEl.addEventListener('click',e=>{if(e.target===menuEl)menu(false);});$('mb').onclick=()=>menu();
/* data-goto="slide-id" jumps; an agenda link's .p shows the target page number */

/* progress bar: hover shows the page name and its part, click jumps */
{const bar=$('bar'),tip=$('bartip');const partOf=j=>{for(let k=j;k>=0;k--)if(S[k].dataset.part)return S[k].dataset.part;return ''};
 bar.addEventListener('mousemove',e=>{const b=e.target.closest('i');if(!b){tip.style.display='none';return}const j=+b.dataset.n;

/* bar charts: values → bars scaled to the tallest */
document.querySelectorAll('.bars').forEach(c=>{const kids=[...c.children],mx=Math.max(...kids.map(k=>+k.dataset.v));

/* map tour: <ol class="tour-steps"><li data-on="key key" data-path="id id">caption</li></ol> + <div class="tourbar"> in the same slide */
S.forEach(s=>{const map=s.querySelector('.map'),list=s.querySelector('ol.tour-steps'),bar=s.querySelector('.tourbar');if(!map||!list||!bar)return;
  const T=[...list.children].map(li=>({on:(li.dataset.on||'').split(' ').filter(Boolean),path:(li.dataset.path||'').split(' ').filter(Boolean),text:li.innerHTML}));
  const svg=map.querySelector('svg'),NS='http://www.w3.org/2000/svg',accent=getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim();
  bar.innerHTML='<button data-t="reset">⏮ เริ่มใหม่</button><button data-t="back" title="↑">◀ ย้อน</button><button data-t="play" class="pp" title="Space">▶ เล่น</button><button data-t="next" title="↓">ถัดไป ⏭</button><span class="tstep"></span><span class="tcap"></span>';
  const cap=bar.querySelector('.tcap'),num=bar.querySelector('.tstep'),pp=bar.querySelector('.pp');let k=-1,timer=null;
  const draw=()=>{svg.querySelectorAll('.dot').forEach(d=>d.remove());svg.querySelectorAll('path.hot').forEach(p=>p.classList.remove('hot'));map.querySelectorAll('.tour').forEach(n=>n.classList.remove('tour'));
    num.textContent=`${k+1}/${T.length}`;if(k<0){cap.textContent='กด Space หรือ ▶ เพื่อเล่น · ↓ ↑ ทีละขั้น';return}const st=T[k];cap.innerHTML=st.text;
    st.on.forEach(x=>map.querySelectorAll(`[data-key="${x}"]`).forEach(n=>n.classList.add('tour')));
    st.path.forEach((id,n)=>{const p=svg.querySelector('#'+id);if(!p)return;p.classList.add('hot');svg.appendChild(p);
      const dot=document.createElementNS(NS,'circle');dot.setAttribute('r','8');dot.setAttribute('fill',accent);dot.setAttribute('class','dot');
      const mo=document.createElementNS(NS,'animateMotion');mo.setAttribute('dur','1.3s');mo.setAttribute('repeatCount','indefinite');mo.setAttribute('begin',`${n*.65}s`);
      const mp=document.createElementNS(NS,'mpath');mp.setAttribute('href','#'+id);mo.appendChild(mp);dot.appendChild(mo);svg.appendChild(dot);});
    svg.setCurrentTime&&svg.setCurrentTime(0);};
  const stop=()=>{clearInterval(timer);timer=null;pp.textContent='▶ เล่น'};
  const go=n=>{k=Math.max(-1,Math.min(T.length-1,n));draw();if(k===T.length-1)stop()};
  const play=()=>{if(timer)return stop();go(k>=T.length-1?0:k+1);pp.textContent='⏸ หยุด';timer=setInterval(()=>{if(!s.classList.contains('on'))return stop();go(k+1)},3200)};
  s._player={play,next:()=>{stop();go(k+1)},back:()=>{stop();go(k-1)},reset:()=>{stop();go(-1)}};
  bar.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;({reset:()=>{stop();go(0)},back:s._player.back,next:s._player.next,play})[t.dataset.t]();});
  go(-1);});
/* per-slide effects: count-up, grow bars, loop highlight, chat replay */
let loop=null,run=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function replay(log,me){const lines=[...log.querySelectorAll(':scope>p')];log.querySelectorAll('.b,.typing').forEach(x=>x.remove());
  for(const l of lines){if(me!==run)return;const d=document.createElement('div');
    if(l.hasAttribute('data-u')){d.className='b u';d.textContent=l.textContent;log.appendChild(d);await wait(500);continue}
    const ty=document.createElement('div');ty.className='typing';ty.innerHTML='<span></span><span></span><span></span>';log.appendChild(ty);await wait(900);ty.remove();if(me!==run)return;
    d.className='b a';log.appendChild(d);const t=l.textContent;for(let k=0;k<=t.length;k+=3){if(me!==run)return;d.textContent=t.slice(0,k);log.scrollTop=log.scrollHeight;await wait(12);}d.textContent=t;}}
function onSlide(s){clearInterval(loop);const me=++run;
  s.querySelectorAll('[data-count]').forEach(el=>{const [a,b]=el.dataset.count.split('/'),t1=performance.now();
    const step=t=>{const p=Math.min(1,(t-t1)/900),v=Math.round(+a*(1-Math.pow(1-p,3)));el.textContent=b?`${v}/${b}`:v;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step);});
  s.querySelectorAll('.growbar').forEach(b=>{b.style.height='0px';requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.height=b.dataset.h+'px'));});
  const steps=[...s.querySelectorAll('[data-loop]>*')];if(steps.length){let k=0;const go=()=>{steps.forEach((x,j)=>x.classList.toggle('lit',j===k));k=(k+1)%steps.length};go();loop=setInterval(go,1400);}
  s.querySelectorAll('[data-chat]').forEach(log=>replay(log,me));}
