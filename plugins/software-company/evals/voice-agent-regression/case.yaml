# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการเดิม (รอบแดง 2026-10-27 · agent ไม่มี skill ทำโจทย์เดียวกัน): แตกงบ latency · streaming · หยุด TTS เมื่อพูดแทรก · PDPA ถูก
# แต่ไม่กันการพูดแทรกหลอก (คำรับสั้น ๆ "ค่ะ" "อืม" ทำให้ AI หยุดพูด) · ไม่ทวนวันเวลาให้ลูกค้ายืนยันก่อนจอง · ไม่พูดถึงการเข้าใจเวลาแบบไทย ("บ่ายสอง" · พ.ศ.)
schema_version: "1.1"
name: voice-agent-regression
description: voice agent ไทยต้องกันการพูดแทรกหลอกจากคำรับสั้น ๆ และทวนวันเวลาแบบไทยให้ลูกค้ายืนยันก่อนจอง (อาการรอบแดง 2026-10-27)
tags: [regression, voice-agent]
runs: 3
expected_outcome: แยกคำรับสั้น ๆ ออกจากการพูดแทรกจริง · ทวนวันเวลาก่อนเรียก tool จอง · แปลงเวลาแบบไทยและปี พ.ศ.
execution:
  prompt: |
    ช่วยออกแบบระบบนี้ให้หน่อย ตอบเป็นแผนสถาปัตยกรรมและขั้นตอนทำ ไม่เกิน 60 บรรทัด ไม่ต้องเขียนโค้ด ไม่ต้องถามกลับ:
    "อยากได้ระบบรับโทรศัพท์อัตโนมัติสำหรับคลินิกทันตกรรม ลูกค้าโทรเข้าเบอร์จริงแล้วคุยภาษาไทยกับ AI เพื่อนัดหมอ
    AI ต้องเช็กตารางหมอก่อนนัด ลูกค้าพูดแทรกได้ ตอบไม่ช้ากว่า 800 ms นัดเสร็จแล้วส่งข้อมูลไป CRM และแจ้งเตือนทาง LINE"
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: false-barge-in-handled
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อคำตอบแยกการพูดแทรกจริงออกจากเสียงรับคำสั้น ๆ (เช่น "ค่ะ" "ครับ" "อืม") หรือเสียงรบกวน
      เช่น ต้องพูดยาวเกินเกณฑ์หรือมีคำมากพอก่อนหยุด TTS หรือใช้ผล STT ยืนยันก่อน อย่างใดอย่างหนึ่งก็พอ
  - name: read-back-before-booking
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อคำตอบให้ AI ทวนวัน เวลา และหมอให้ลูกค้ายืนยันก่อนเรียก tool จองนัด
      และบอกว่ายืนยันนัดกับลูกค้าได้หลัง tool ตอบสำเร็จเท่านั้น
  - name: thai-time-expressions
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน ให้ผ่านเมื่อครบ 2 ข้อ:
      1. คำตอบแปลงคำบอกเวลาหรือวันแบบไทยเป็นค่าที่เครื่องอ่านได้ก่อนส่งเข้า tool อย่างน้อย 1 ตัวอย่าง
         (เช่น "บ่ายสอง" เป็น 14:00 · "สองทุ่ม" เป็น 20:00 · ปี พ.ศ. เป็น ค.ศ. · วันเวลาเป็นรูปแบบ ISO 8601 อย่างใดอย่างหนึ่งก็พอ)
      2. ให้ AI อ่านทวนวันเวลาเป็นภาษาไทยให้ลูกค้ายืนยันก่อนเรียก tool จอง
      คำตอบที่แค่เอ่ยคำว่า "บ่าย" หรือ "พ.ศ." โดยไม่แสดงการแปลงเป็นค่าที่เครื่องอ่าน ไม่ผ่าน
