# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: voice-agent-trigger
description: เจ้าของคลินิกขอระบบ AI รับโทรศัพท์ภาษาไทยที่ลูกค้าพูดแทรกได้ ไม่เอ่ยชื่อ skill ต้องทำให้ voice-agent ถูกเปิด และคำตอบมีงบความหน่วงแยกช่วง
tags: [trigger, voice-agent]
runs: 3
expected_outcome: เปิด Skill voice-agent แล้ววางท่อ SIP → VAD → STT → LLM → TTS แบบ streaming พร้อมตารางงบความหน่วงแยกช่วง และบอกว่าต้องแจ้งลูกค้าก่อนบันทึกเสียง
execution:
  prompt: |
    คลินิกทำฟันของเราอยากให้ AI รับโทรศัพท์คนไข้แทนพนักงาน คุยภาษาไทย จองคิวหมอให้ได้เลย
    คนไข้ต้องพูดแทรกได้เหมือนคุยกับคนจริง และต้องตอบไว ๆ ไม่ให้เงียบนาน
    ช่วยวางภาพรวมระบบ และแนะนำว่าตัวแปลงเสียงเป็นข้อความกับตัวอ่านออกเสียงภาษาไทยควรใช้อะไร ยังไม่ต้องเขียนโค้ด
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?voice-agent"'
    min: 1
    arm: with-only
  - name: per-stage-latency-budget
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน ให้ผ่านเมื่อคำตอบแตกเวลาตอบสนองของ agent ออกเป็นช่วงที่มีตัวเลขมิลลิวินาทีกำกับแต่ละช่วง
      อย่างน้อย 3 ช่วง (เช่น เครือข่าย · รอความเงียบหรือ VAD · STT · LLM token แรก · TTS ไบต์แรก อย่างใดอย่างหนึ่งก็พอ)
      คำตอบที่บอกแค่ว่า "ให้เร็ว" หรือบอกตัวเลขรวมตัวเดียวโดยไม่แตกช่วง ไม่ผ่าน
