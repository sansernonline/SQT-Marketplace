# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการเดิม (รอบแดง 2026-10-27 · agent ไม่มี skill ทำโจทย์เดียวกัน): single quote กับค่าลับและ --password-stdin ถูก
# แต่ input อนุมัติ production ไม่จำกัด submitter และไม่มี timeout · tag image ด้วย BUILD_NUMBER ไม่ใช่ commit SHA และไม่ deploy ด้วย digest · ไม่สแกนช่องโหว่ image · แนะนำต่อ Docker socket
schema_version: "1.1"
name: jenkins-pipeline-regression
description: การอนุมัติ production ต้องจำกัดผู้อนุมัติและมี timeout และ image ที่ขึ้น production ต้องเป็นตัวเดียวกับที่ผ่าน staging (อาการรอบแดง 2026-10-27)
tags: [regression, jenkins-pipeline]
runs: 3
expected_outcome: input มี submitter และ timeout · tag ด้วย commit SHA หรือ deploy ด้วย digest · มีขั้นสแกน image · ไม่แนะนำให้ mount docker.sock
execution:
  prompt: |
    อยากได้ Jenkinsfile ที่ build Docker image ของ service แล้ว push ขึ้น registry (user/password เก็บใน Jenkins credentials id 'registry-cred')
    รัน test แล้ว deploy ขึ้น staging ด้วย Helm ถ้าผ่านค่อย deploy production ใช้ kubeconfig จาก credentials id 'kubeconfig-prod'
    ตอบในแชต ไม่ต้องสร้างไฟล์ ไม่ต้องถามกลับ
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: approver-restricted
    type: regex
    pattern: "submitter"
    match: contains
    target: last_message
  - name: not-build-number-tag
    type: regex
    pattern: "IMAGE_TAG\\s*=\\s*[\"']?\\$\\{?(env\\.)?BUILD_NUMBER"
    match: not_contains
    target: last_message
  - name: same-image-and-safe-build
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อครบทั้ง 3 ข้อ
      1. image ที่ deploy production เป็นตัวเดียวกับที่ผ่าน staging (tag ด้วย commit SHA หรือส่ง digest ต่อ ไม่ build ใหม่)
      2. มีขั้นสแกนช่องโหว่ image ก่อน deploy
      3. ไม่แนะนำให้ mount /var/run/docker.sock เข้า container ของ Jenkins หรือถ้าพูดถึงต้องเป็นคำเตือนว่าไม่ควรทำ
