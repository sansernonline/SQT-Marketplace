# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคส "ไม่ควรเปิด" (P7): ถามเรื่องของ skill คู่ใกล้เคียง · kafka-streaming ต้องไม่ถูกเปิด (tool_used min 0 max 0 ตาม skill-authoring/references/eval-format.md)
# runs 5: เคสนี้ใช้ตัดสินการแก้ description ของ skill · n=3 กว้างเกินไป (ยังไม่ได้วัดช่วงจริง)
schema_version: "1.1"
name: kafka-streaming-trigger-negative
description: ผู้ใช้เลือก RabbitMQ แล้วถามเรื่อง queue กับ exchange ต้องไม่เปิด kafka-streaming (ของ rabbitmq-messaging)
tags: [trigger, negative, kafka-streaming]
runs: 5
expected_outcome: ไม่เปิด Skill kafka-streaming · คำตอบพูดถึง queue หรือ exchange ของ RabbitMQ
execution:
  prompt: |
    เว็บแอปสั่งซื้อของเราจะส่งอีเมลยืนยันออเดอร์ผ่านคิว ทีมเลือก RabbitMQ แล้ว ช่วยวางแนวทางให้หน่อยว่า
    queue กับ exchange ควรตั้งอย่างไร ให้อีเมลไม่หายเมื่อ worker ตาย ยังไม่ต้องเขียนโค้ด
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: kafka-streaming-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kafka-streaming"'
    min: 0
    max: 0
    arm: with-only
  - name: rabbitmq-vocabulary
    type: regex
    pattern: "queue|exchange|ack"
    flags: i
    match: contains
    target: last_message
