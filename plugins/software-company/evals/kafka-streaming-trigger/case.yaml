# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: kafka-streaming-trigger
description: ผู้ใช้ถามวิธีส่ง event สายโทรกับนัดหมายระหว่าง service ผ่าน Kafka ไม่เอ่ยชื่อ skill ต้องทำให้ kafka-streaming ถูกเปิด และคำตอบพูดถึงการทำซ้ำได้ของ consumer
tags: [trigger, kafka-streaming]
runs: 3
expected_outcome: เปิด Skill kafka-streaming แล้วเสนอ topic พร้อม key และบอกว่า consumer ต้องกัน event ซ้ำ
execution:
  prompt: |
    ระบบ voice agent ของคลินิกทันตกรรมเราต้องส่ง event สายโทรกับการจองนัดไปให้ service ที่สรุปลง CRM
    และ service ที่แจ้งเตือนผ่าน LINE ทีมคิดจะใช้ Kafka ช่วยวางแนวทางให้หน่อย ว่า topic กับ consumer ควรเป็นอย่างไร
    ยังไม่ต้องเขียนโค้ด
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?kafka-streaming"'
    min: 1
    arm: with-only
  - name: duplicate-handling-named
    type: regex
    pattern: "event_id|idempoten|ทำซ้ำได้|กันซ้ำ|dedup"
    flags: i
    match: contains
    target: last_message
