# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคส "ไม่ควรเปิด": ขอ deploy แอป Express + Postgres ขึ้น Render ไม่เอ่ย Backblaze · backblaze-b2 ต้องไม่ถูกเปิด (tool_used min 0 max 0 ตาม skill-authoring/references/eval-format.md)
# runs 5: เคสนี้ใช้ตัดสินการแก้ description ของ skill · n=3 กว้างเกินไป (ยังไม่ได้วัดช่วงจริง)
schema_version: "1.1"
name: backblaze-b2-deploy-trigger-negative
description: ผู้ใช้ขอ deploy แอป Express + Postgres ขึ้น Render ไม่เกี่ยวกับ Backblaze ต้องไม่เปิด backblaze-b2
tags: [trigger, negative, backblaze-b2]
runs: 5
expected_outcome: ไม่เปิด Skill backblaze-b2 · คำตอบพูดถึง Render หรือ render.yaml
execution:
  prompt: |
    ช่วยวางขั้นตอน deploy แอป Express ที่ต่อ Postgres ขึ้น Render หน่อย
    ต้องตั้งค่าอะไรบ้าง ยังไม่ต้องสร้างไฟล์
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: backblaze-b2-deploy-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?backblaze-b2"'
    min: 0
    max: 0
    arm: with-only
  - name: render-named
    type: regex
    pattern: 'Render|render\.yaml'
    flags: i
    match: contains
    target: last_message
