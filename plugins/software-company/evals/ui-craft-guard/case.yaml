# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่กัน: ui-craft ข้อ 3 (ปุ่มที่ซ้ำทุกแถวห้ามเป็นปุ่มทึบสีแบรนด์ · ปุ่มลบเป็นปุ่มรองสีแดง) · ยังไม่เคยเห็นพลาดจริงในรอบที่บันทึกไว้ จึงเป็น guard ไม่ใช่ regression
# รอบลองหน้าจริง 2026-11-06 (_to_delete/design-trial/findings.md ข้อ 10) พบจุดอ่อนของ ui-craft เรื่องเรียกลูกทีมไม่ได้ ซึ่งวัดด้วยเคสข้อความล้วนแบบนี้ไม่ได้
schema_version: "1.1"
name: ui-craft-guard
description: กันตารางรายการที่มีปุ่ม เปิด แก้ไข ลบ ซ้ำทุกแถว ไม่ให้เป็นปุ่มทึบสีแบรนด์ทุกแถว และปุ่มลบไม่เป็นปุ่มทึบสีแดง (ยังไม่เคยเห็นพลาดจริง)
tags: [guard, ui-craft]
runs: 10
expected_outcome: ปุ่มต่อแถวเป็นปุ่มรอง ปุ่มเปล่า หรือเมนูจุดสามจุด · ปุ่มลบเป็นปุ่มรองสีแดงหรือซ่อนในเมนู ไม่ทึบแดง · ปุ่มทึบหลักมีปุ่มเดียวต่อหน้า
execution:
  prompt: |
    ตารางรายชื่อพนักงานในระบบ HR ของบริษัทผม แต่ละแถวต้องมีให้กด เปิดดู · แก้ไข · ลบ
    มีพนักงานหน้าละ 20 แถว ช่วยบอกว่าปุ่มพวกนี้ควรหน้าตาแบบไหน สีอะไร และปุ่ม "เพิ่มพนักงาน" ด้านบนควรเป็นอย่างไร
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: row-buttons-not-solid
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อปุ่มที่ซ้ำทุกแถว (เปิดดู แก้ไข ลบ) ไม่ใช่ปุ่มทึบสีแบรนด์ แต่เป็นปุ่มเส้นขอบ ปุ่มข้อความล้วน ไอคอน หรือเมนูรวม · ถ้าให้ทุกแถวมีปุ่มทึบสีแบรนด์ให้ตก
  - name: delete-not-solid-red
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อปุ่มลบไม่ใช่ปุ่มทึบสีแดง (เป็นปุ่มรองสีแดง ข้อความแดง หรือซ่อนในเมนูแล้วมีขั้นยืนยัน) · ถ้าให้ปุ่มลบทึบสีแดงให้ตก
  - name: add-is-the-one-primary
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อปุ่ม "เพิ่มพนักงาน" เป็นปุ่มหลักทึบปุ่มเดียวของหน้า
