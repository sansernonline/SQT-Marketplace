# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# runs 5: เคสนี้ใช้ตัดสินการแก้ description ของ skill · n=3 กว้างเกินไป (ยังไม่ได้วัดช่วงจริง)
schema_version: "1.1"
name: backblaze-deploy-trigger
description: ผู้ใช้มีเว็บโชว์ผลงานที่ build เป็น HTML/CSS/JS ล้วน (Vite) อยากเอาไปไว้ที่ Backblaze B2 ให้เปิดผ่านโดเมนบน Cloudflare ไม่เอ่ยชื่อ skill ต้องทำให้ backblaze-deploy ถูกเปิด และแผนอ้างถึง b2 sync, Transform Rule หรือ CNAME
tags: [trigger, backblaze-deploy]
runs: 5
expected_outcome: เปิด Skill backblaze-deploy แล้ววางขั้นตอนปล่อยและอัปเดตโดยพูดถึง b2 sync, Transform Rule หรือ CNAME
execution:
  prompt: |
    ผมมีเว็บโชว์ผลงาน build ด้วย Vite ได้เป็น HTML CSS JS ล้วน ๆ
    อยากเอาไปไว้ที่ Backblaze B2 แล้วให้เปิดผ่านโดเมน portfolio.example.com ที่อยู่ใน Cloudflare
    ขอขั้นตอนปล่อยครั้งแรกและวิธีอัปเดตครั้งต่อไป ยังไม่ต้องเขียนไฟล์
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?backblaze-deploy"'
    min: 1
    arm: with-only
  - name: deploy-steps-named
    type: regex
    pattern: 'b2 sync|Transform Rule|CNAME'
    flags: i
    match: contains
    target: last_message
