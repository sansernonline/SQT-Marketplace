# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: mobile-app-design-behaviour
description: แอปมือถือที่ยังไม่มีแบรนด์ ต้องค้นต้นแบบแอปก่อน แล้วเขียนสี ฟอนต์ และรูปทรงของงานลง theme.css พร้อมที่มา ไม่ส่งหน้าตาค่าสำรอง (Speak Go) ออกไปเป็นของงาน
tags: [behaviour, mobile-app-design]
runs: 5
expected_outcome: ค้นต้นแบบแอปจองคิวหรือร้านตัดผม · มี mockup/theme.css พร้อมคอมเมนต์ที่มา · ฟอนต์ไม่ได้ยกชุดค่าสำรองมาทั้งชุดโดยไม่มีเหตุผล · สีหลักไม่ใช่ค่าสำรองโดยไม่บอกเหตุ
execution:
  prompt: |
    ทำ mockup แอปมือถือจองคิวร้านตัดผมชายในย่านอารีย์ 3 หน้า: เลือกช่าง · เลือกเวลา · ยืนยันคิว
    ร้านยังไม่มีแบรนด์ เก็บไฟล์ไว้ในโฟลเดอร์ mockup/ ทำต่อได้เลยไม่ต้องถามกลับ
  max_turns: 40
  timeout_seconds: 1200
graders:
  - name: searched-references
    type: tool_used
    tool: WebSearch
    min: 1
    arm: with-only
  - name: theme-file
    type: file_exists
    path: mockup/theme.css
    exists: true
  - name: not-fallback-look
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าสีหลักและฟอนต์ของงานมาจากไหน (ต้นแบบแอปที่ค้น ชื่อแอปหรือลิงก์ หรือเหตุผลจากเนื้องานร้านตัดผม)
      2. ไม่ได้ใช้ชุดฟอนต์ IBM Plex Sans Thai + Space Grotesk + Source Serif 4 ทั้งชุดและสีเขียวน้ำทะเลของค่าสำรองโดยไม่บอกเหตุผล · ถ้าใช้ ต้องบอกว่าค้นไม่ได้และติด (รอยืนยัน)
      3. แอปจองคิวไม่มีเนื้อหาให้อ่านยาว ถ้าลดจำนวนตระกูลฟอนต์ลง ถือว่าถูก
