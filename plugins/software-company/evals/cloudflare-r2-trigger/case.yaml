# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# runs 5: เคสนี้ใช้ตัดสินการแก้ description ของ skill · n=3 กว้างเกินไป (ยังไม่ได้วัดช่วงจริง)
schema_version: "1.1"
name: cloudflare-r2-trigger
description: ผู้ใช้มีเว็บ Next.js ให้ลูกค้าอัปโหลดรูปสินค้า อยากย้ายที่เก็บรูปจาก S3 มา Cloudflare R2 เพราะค่า egress ไม่เอ่ยชื่อ skill ต้องทำให้ cloudflare-r2 ถูกเปิด และแผนอ้างถึง presigned URL, endpoint หรือค่า R2_
tags: [trigger, cloudflare-r2]
runs: 5
expected_outcome: เปิด Skill cloudflare-r2 แล้ววางแผนย้ายโดยพูดถึง presigned URL หรือ endpoint ของ R2
execution:
  prompt: |
    เรามีเว็บ Next.js ที่ให้ลูกค้าอัปโหลดรูปสินค้า ตอนนี้เก็บรูปไว้ใน S3 แต่ค่า egress แพง
    อยากย้ายที่เก็บรูปมา Cloudflare R2 ช่วยวางแผนหน่อยว่าต้องตั้งอะไรบ้าง ยังไม่ต้องเขียนไฟล์
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?cloudflare-r2"'
    min: 1
    arm: with-only
  - name: r2-setup-named
    type: regex
    pattern: 'presign|presigned|R2_|endpoint'
    flags: i
    match: contains
    target: last_message
