# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคส "ไม่ควรเปิด" 2026-10-28 (ยังไม่ได้รัน) · ภาษีเป็นของ trading-finance ไม่ใช่ทะเบียนเอกสาร
schema_version: "1.1"
name: important-docs-trigger-negative
description: ถามเรื่องลดหย่อนภาษีเงินได้ ต้องไม่เปิด important-docs
tags: [trigger, negative, regression-suite, important-docs]
runs: 5
expected_outcome: ไม่เปิด Skill important-docs · ยังตอบเรื่องลดหย่อนภาษีหรือบอกว่าเป็นเรื่องของ plugin การเงิน
execution:
  prompt: |
    ปีนี้เงินเดือนรวม 600,000 บาท ซื้อกองทุน RMF ได้ลดหย่อนภาษีเท่าไร
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: important-docs-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?important-docs"'
    min: 0
    max: 0
    arm: with-only
  - name: answer-on-topic
    type: regex
    pattern: 'RMF|ลดหย่อน'
    match: contains
    target: last_message
