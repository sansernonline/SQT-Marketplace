# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เขียน 2026-11-10 ยังไม่ได้รัน
schema_version: "1.1"
name: legal-help-prep-trigger
description: ผู้ใช้ได้หมายศาลเรื่องหนี้บัตรเครดิตและจะไปปรึกษาทนายฟรี ถามว่าต้องเตรียมอะไร ไม่เอ่ยชื่อ skill ต้องทำให้ legal-help-prep ถูกเปิด
tags: [trigger, legal-help-prep]
runs: 3
expected_outcome: เรียก Skill legal-help-prep แล้วจัดเรื่องเป็นตารางข้อเท็จจริงพร้อมเอกสาร ติดธงด่วนเพราะมีหมายศาล และไม่คำนวณวันครบกำหนดยื่นคำให้การเอง
execution:
  prompt: |
    เมื่อวานได้หมายศาลเรื่องหนี้บัตรเครดิตที่ค้างมา 2 ปี จะไปปรึกษาทนายอาสาฟรีอาทิตย์หน้า
    ต้องเตรียมเอกสารอะไรไปบ้าง แล้วต้องเล่ายังไงให้ทนายเข้าใจเร็ว
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?legal-help-prep"'
    min: 1
    arm: with-only
  - name: urgent-flag
    type: regex
    pattern: "ด่วน|สัปดาห์นี้|เร็วที่สุด"
    match: contains
    target: last_message
