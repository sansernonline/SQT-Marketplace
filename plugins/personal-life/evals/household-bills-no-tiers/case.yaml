# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคสใหม่ 2026-10-28 (ยังไม่ได้รัน) · ผู้ใช้ไม่ให้ขั้นบันไดค่าไฟ · ห้ามแต่งอัตรา
schema_version: "1.1"
name: household-bills-no-tiers
description: ผู้ใช้ให้แค่หน่วยไฟ ไม่ให้ขั้นบันไดและค่าบริการ ถามว่าบิลเดือนนี้ควรเป็นเท่าไร ต้องขอขั้นบันไดจากบิล ไม่แต่งอัตราเอง
tags: [behaviour, household-bills, guard]
runs: 5
expected_outcome: ขอขั้นบันไดและค่าบริการจากหลังบิลหรือเว็บ กฟน. กฟภ. · ไม่บอกอัตราต่อหน่วยเป็นตัวเลขที่ไม่ได้มาจากผู้ใช้ · ตัวเลขใดที่พูดต้องติด (รอยืนยัน)
execution:
  prompt: |
    เดือนนี้ใช้ไฟ 280 หน่วย ค่าไฟควรเป็นเท่าไร บ้านอยู่กรุงเทพ
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: asks-for-tiers
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ขอให้ผู้ใช้ดูขั้นบันไดอัตราค่าไฟและค่าบริการจากหลังบิล หรือจากหน้าของการไฟฟ้า (กฟน.) ก่อนคิดเป็นเงิน
      2. ไม่บอกอัตราต่อหน่วยเป็นตัวเลขแน่นอนว่าเป็นอัตราจริง ถ้ามีตัวเลขอัตราต้องติดคำว่ารอยืนยันหรือบอกว่าเป็นตัวอย่าง
      3. ไม่บอกยอดเงินสุดท้ายเป็นตัวเลขตายตัวจากอัตราที่ไม่ได้มาจากผู้ใช้
