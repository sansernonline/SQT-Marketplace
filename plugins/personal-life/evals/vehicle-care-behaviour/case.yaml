# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: vehicle-care-behaviour
description: รถเก๋งจดทะเบียน 3 มี.ค. 2561 ภาษีหมด 2 มี.ค. 2570 กับมอเตอร์ไซค์อายุ 4 ปี ต้องคำนวณอายุเต็มปี บอกว่าคันไหนต้องตรวจ ตรอ. เรียงลำดับ พ.ร.บ. ก่อนภาษี และให้วันเตือน
tags: [behaviour, vehicle-care]
runs: 3
expected_outcome: รถเก๋งอายุครบ 8 ปีเต็ม ณ วันภาษีหมด จึงต้องตรวจ ตรอ. · มอเตอร์ไซค์อายุ 4 ปีเต็มยังไม่ต้องตรวจ · ลำดับ ตรวจ ตรอ. แล้วต่อ พ.ร.บ. แล้วจ่ายภาษี · ต่อภาษีล่วงหน้าได้ 90 วัน คือตั้งแต่ราว 2 ธ.ค. 2569 · ตัวเลขที่ยังไม่ยืนยันติดป้าย
execution:
  prompt: |
    บ้านเรามีรถ 2 คัน
    - รถเก๋ง จดทะเบียนครั้งแรก 3 มี.ค. 2561 ป้ายภาษีหมด 2 มี.ค. 2570
    - มอเตอร์ไซค์ 125 cc จดทะเบียนครั้งแรก 10 มิ.ย. 2565 ป้ายภาษีหมด 9 มิ.ย. 2570
    ปีนี้ต้องทำอะไรบ้าง เมื่อไร คันไหนต้องเข้า ตรอ. ไหม ขอเป็นตารางวันที่ต้องจำ
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: names-inspection
    type: regex
    pattern: "ตรอ"
    match: contains
    target: last_message
  - name: window-90-days
    type: regex
    pattern: "90\\s*วัน"
    match: contains
    target: last_message
  - name: dates-and-chain
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. รถเก๋งต้องตรวจสภาพที่ ตรอ. ก่อนต่อภาษี (อายุเกิน 7 ปี นับจากวันจดทะเบียนครั้งแรกถึงวันภาษีหมด)
      2. มอเตอร์ไซค์ยังไม่ต้องตรวจ ตรอ. (อายุไม่ถึงเกณฑ์ 5 ปี)
      3. บอกลำดับ ตรวจ ตรอ. (ถ้าต้อง) → ต่อ พ.ร.บ. → จ่ายภาษี ไม่ใช่จ่ายภาษีก่อน พ.ร.บ.
      4. มีวันที่จริงในตาราง: ยื่นต่อภาษีรถเก๋งได้ตั้งแต่ราว 2 ธ.ค. 2569 (90 วันก่อนหมด) และวันเตือนของมอเตอร์ไซค์ในปี 2570
      5. ไม่สร้างตัวเลขค่าธรรมเนียมที่ไม่มีแหล่ง ถ้าบอกค่าตรวจหรือเบี้ย ต้องมีแหล่งหรือป้ายว่ายังไม่ยืนยัน
