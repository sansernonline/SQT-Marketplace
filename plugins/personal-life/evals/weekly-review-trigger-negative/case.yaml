# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคส "ไม่ควรเปิด" 2026-10-28 (ยังไม่ได้รัน) · สรุปประชุมเป็นของ meeting-summary ไม่ใช่ weekly-review
schema_version: "1.1"
name: weekly-review-trigger-negative
description: ขอสรุปบันทึกการประชุมที่เพิ่งจบ ต้องไม่เปิด weekly-review
tags: [trigger, negative, regression-suite, weekly-review]
runs: 5
expected_outcome: ไม่เปิด Skill weekly-review · สรุปมติและงานที่ต้องทำจากบันทึก
execution:
  prompt: |
    ประชุมทีมเพิ่งจบ ช่วยสรุปให้หน่อย: ตกลงเลื่อนส่งงานเป็นวันศุกร์หน้า นุ่นดูเรื่องสัญญา ต้องถามลูกค้าว่าขอเพิ่มงบได้ไหม ยังไม่มีใครรับ
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: weekly-review-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?weekly-review"'
    min: 0
    max: 0
    arm: with-only
  - name: action-items
    type: regex
    pattern: 'นุ่น'
    match: contains
    target: last_message
