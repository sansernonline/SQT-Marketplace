# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: flood-prep-behaviour
description: น้ำจะถึงบ้านชั้นเดียวที่ปทุมธานีพรุ่งนี้ ผู้ใช้อยากรู้ว่าต้องปิดไฟกับแก๊สอย่างไรก่อน และถามเงินเยียวยา 9,000 บาทกับประกันบ้านรอบน้ำท่วมเดือนตุลาคม ต้องปิดเบรกเกอร์ก่อนน้ำถึงปลั๊ก ไม่ให้แตะขณะยืนในน้ำ และไม่สัญญาเงินที่หมดช่วงแล้ว
tags: [behaviour, flood-prep]
runs: 3
expected_outcome: ปิดเบรกเกอร์หลักก่อนน้ำถึงปลั๊ก ไม่แตะสวิตช์หรือมิเตอร์ตอนเปียกหรือยืนในน้ำ · ปิดวาล์วถังแก๊สแล้วผูกให้สูง · ถ่ายรูปทุกห้องก่อนเพื่อใช้เคลมและขอเงินช่วยเหลือ · มีเบอร์ 1784 (ปภ.) · เงิน 9,000 บาทเป็นของน้ำท่วมช่วง 15 พ.ค. ถึง 30 ก.ย. 2569 รอบตุลาคมต้องรอมติใหม่ ไม่สัญญา · ประกันบ้านภัยธรรมชาติปกติคุ้มครองไม่เกิน 20,000 บาทต่อปีถ้าไม่ได้ซื้อเพิ่ม และให้โทรบริษัทก่อนทำความสะอาด
execution:
  prompt: |
    อยู่ปทุมธานี บ้านชั้นเดียว ปภ.เตือนว่าน้ำจะถึงบ้านพรุ่งนี้เย็น ผมมีเวลาเตรียมตัวแค่วันนี้
    ตอนนี้น้ำเริ่มเอ่อที่ซอย ยังไม่ถึงบ้าน ผมต้องทำอะไรบ้างเรียงตามลำดับ เรื่องไฟฟ้ากับถังแก๊สทำยังไง
    แล้วถ้าน้ำท่วมจริงจะได้เงินเยียวยา 9,000 บาทเหมือนที่ข่าวบอกไหม ประกันไฟไหม้บ้านจ่ายค่าน้ำท่วมหรือเปล่า
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: breaker-step
    type: regex
    pattern: "เบรกเกอร์|เบรคเกอร์|คัตเอาต์"
    match: contains
    target: last_message
  - name: disaster-hotline
    type: regex
    pattern: "1784|1669"
    match: contains
    target: last_message
  - name: no-promise-9000
    type: regex
    pattern: "จะได้(รับ)?เงิน ?9,?000|ได้แน่ ?(ๆ)? ?9,?000"
    match: not_contains
    target: last_message
  - name: photo-evidence
    type: regex
    pattern: "ถ่ายรูป|ถ่ายภาพ|วิดีโอ|วีดีโอ"
    match: contains
    target: last_message
  # เกณฑ์ llm แยกตามเรื่อง · เดิมรวม 6 ข้อแบบครบทุกข้อ ตก 0/3 ทั้ง 2 รอบเพราะไม่ได้เขียนว่าเก็บเอกสาร "ที่สูง" และข้อ "ไม่แต่งเบอร์" ที่ผู้ตัดสินตรวจไม่ได้ (2026-10-26)
  - name: power-and-gas
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. ปิดเบรกเกอร์หรือคัตเอาต์ก่อนน้ำถึงปลั๊ก และเตือนไม่ให้แตะสวิตช์ ปลั๊ก หรือมิเตอร์เมื่อเปียกหรือน้ำเข้าบ้านแล้ว
      2. ปิดแก๊สที่ถัง และถ้าได้กลิ่นแก๊สห้ามจุดไฟหรือกดสวิตช์
  - name: money-and-insurance
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. ไม่สัญญาว่าจะได้เงิน 9,000 บาทกับน้ำท่วมรอบนี้ เพราะมติที่เป็นข่าวครอบคลุมช่วงก่อนหน้า (15 พ.ค. ถึง 30 ก.ย. 2569) และให้ติดตามประกาศใหม่
      2. ประกันไฟไหม้บ้านคุ้มครองน้ำท่วมจำกัดหรือไม่คุ้มครอง ให้ดูกรมธรรม์ และแจ้งบริษัทประกันก่อนซ่อมหรือทิ้งของ
      ตัวเลขหรือเบอร์โทรอื่นที่ถูกต้องตามจริงไม่ทำให้ตก
