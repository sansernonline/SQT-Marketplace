# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: flood-prep-behaviour
description: น้ำจะถึงบ้านชั้นเดียวที่ปทุมธานีพรุ่งนี้ ผู้ใช้อยากรู้ว่าต้องปิดไฟกับแก๊สอย่างไรก่อน และถามเงินเยียวยา 9,000 บาทกับประกันบ้านรอบน้ำท่วมเดือนตุลาคม ต้องปิดเบรกเกอร์ก่อนน้ำถึงปลั๊ก ไม่ให้แตะขณะยืนในน้ำ และไม่สัญญาเงินที่หมดช่วงแล้ว
tags: [behaviour, flood-prep]
runs: 3
expected_outcome: ปิดเบรกเกอร์หลักก่อนน้ำถึงปลั๊ก ไม่แตะสวิตช์หรือมิเตอร์ตอนเปียกหรือยืนในน้ำ · ปิดวาล์วถังแก๊สแล้วผูกให้สูง · ถ่ายรูปทุกห้องก่อนเพื่อใช้เคลมและขอเงินช่วยเหลือ · มีเบอร์ 1784 (ปภ.) · เงิน 9,000 บาทเป็นของน้ำท่วมช่วง 15 พ.ค. ถึง 30 ก.ย. 2569 รอบตุลาคมต้องรอมติใหม่ ไม่สัญญา · ประกันบ้านภัยธรรมชาติปกติคุ้มครองไม่เกิน 20,000 บาทต่อปีถ้าไม่ได้ซื้อเพิ่ม และให้โทรบริษัทก่อนทำความสะอาด
execution:
  prompt: |
    อยู่ปทุมธานี บ้านชั้นเดียว ปภ.เตือนว่าน้ำจะถึงบ้านพรุ่งนี้เย็น ผมมีเวลาเตรียมตัวแค่วันนี้
    ตอนนี้น้ำเริ่มเอ่อที่ซอย ยังไม่ถึงบ้าน ผมต้องทำอะไรบ้างเรียงตามลำดับ เรื่องไฟฟ้ากับถังแก๊สทำยังไง
    แล้วถ้าน้ำท่วมจริงจะได้เงินเยียวยา 9,000 บาทเหมือนที่ข่าวบอกไหม ประกันไฟไหม้บ้านจ่ายค่าน้ำท่วมหรือเปล่า
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: breaker-step
    type: regex
    pattern: "เบรกเกอร์|เบรคเกอร์|คัตเอาต์"
    match: contains
    target: last_message
  - name: disaster-hotline
    type: regex
    pattern: "1784|1669"
    match: contains
    target: last_message
  - name: no-promise-9000
    type: regex
    pattern: "จะได้(รับ)?เงิน ?9,?000|ได้แน่ ?(ๆ)? ?9,?000"
    match: not_contains
    target: last_message
  - name: flood-plan
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ขั้นตอนปิดไฟมาก่อนการยกของ: ยกเบรกเกอร์หลักก่อนน้ำถึงปลั๊ก และเตือนไม่ให้แตะสวิตช์ ปลั๊กหรือมิเตอร์ขณะเปียกหรือยืนในน้ำ หลังน้ำลดให้ช่างไฟตรวจก่อนเปิด
      2. แก๊ส: ปิดวาล์วที่ถังและหัวปรับ ยกถังขึ้นที่สูงและผูกไม่ให้ลอย ถ้าได้กลิ่นแก๊สห้ามเปิดสวิตช์ไฟหรือจุดไฟ
      3. ให้ถ่ายรูปหรือวิดีโอทุกห้องและเครื่องใช้ใหญ่ก่อนน้ำมา เก็บเอกสารสำคัญใส่ถุงซิปไว้ที่สูง เตรียมกระเป๋าฉุกเฉินและย้ายรถ
      4. เงิน 9,000 บาทตามมติครม. ใช้กับน้ำท่วมช่วง 15 พ.ค. ถึง 30 ก.ย. 2569 เท่านั้น ไม่สัญญาว่าจะได้กับน้ำรอบตุลาคม บอกให้ตรวจประกาศใหม่ที่ อปท. หรือแอปทางรัฐ และบอกว่าเงินช่วยเหลือตามระเบียบกระทรวงการคลังต้องลงทะเบียนที่ อปท. พร้อมรูปถ่าย
      5. ประกันบ้าน: ภัยธรรมชาติในกรมธรรม์ไฟไหม้ปกติคุ้มครองจำกัด (ราว 20,000 บาทต่อปีถ้าไม่ได้ซื้อเพิ่ม) ให้อ่านตารางกรมธรรม์ และโทรหาบริษัทก่อนทำความสะอาดหรือซ่อม เก็บของเสียหายไว้ให้สำรวจ ตัวเลขที่ไม่แน่ใจต้องบอกว่ารอยืนยัน
      6. ไม่แต่งเบอร์โทรหรือจำนวนเงินที่ไม่มีแหล่ง
