# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เขียน 2026-10-28 ยังไม่ได้รัน
schema_version: "1.1"
name: moving-house-trigger
description: ผู้ใช้จะย้ายจากคอนโดเช่าไปบ้านใหม่ต่างจังหวัด ถามว่าต้องทำเรื่องอะไรบ้าง ไม่เอ่ยชื่อ skill ต้องทำให้ moving-house ถูกเปิด
tags: [trigger, moving-house]
runs: 3
expected_outcome: เรียก Skill moving-house แล้วตอบเป็นแผนที่มีย้ายทะเบียนบ้านภายใน 15 วันนับจากวันย้ายเข้า ปิดหรือโอนค่าไฟค่าน้ำ ขอเงินประกันคืน และรายการหน่วยงานที่ต้องแจ้งที่อยู่ใหม่
execution:
  prompt: |
    สิ้นเดือนหน้าจะย้ายออกจากคอนโดเช่าที่ลาดพร้าวไปอยู่บ้านที่ซื้อใหม่ที่ปทุมธานี
    ต้องทำเรื่องอะไรบ้าง ทะเบียนบ้าน ค่าไฟ ค่าน้ำ ธนาคาร ต้องจัดการยังไง เรียงให้หน่อย
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?moving-house"'
    min: 1
    arm: with-only
  - name: registration-deadline
    type: regex
    pattern: "15 ?วัน"
    match: contains
    target: last_message
