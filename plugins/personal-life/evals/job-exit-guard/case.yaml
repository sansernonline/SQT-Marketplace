# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# ทางที่กัน: ฝั่งนายจ้างที่จะเลิกจ้างลูกน้องเป็นงานของ labour-law-basics ไม่ใช่ job-exit (ตาราง "Use when / not when")
# รอบแดงยังไม่ได้รัน (ยังไม่ได้ตรวจ) · เขียนเป็น -guard เพราะยังไม่เคยเห็น agent พลาดจริง
schema_version: "1.1"
name: job-exit-guard
description: เจ้าของร้านถามวิธีเลิกจ้างพนักงานให้ถูกกฎหมาย ต้องไม่เปิด job-exit (ฝั่งลูกจ้าง) และไม่แนะนำให้ "อย่าเซ็น"
tags: [guard, job-exit]
runs: 3
expected_outcome: ไม่เปิด job-exit · ตอบฝั่งนายจ้าง (บอกกล่าวล่วงหน้า ค่าชดเชยตามอายุงาน จ่ายเงินที่ค้าง)
execution:
  prompt: |
    ผมเปิดร้านกาแฟ มีพนักงาน 5 คน จะเลิกจ้างพนักงานคนหนึ่งที่ทำงานมา 2 ปี
    ต้องทำยังไงให้ถูกกฎหมาย ต้องจ่ายอะไรบ้าง
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?job-exit"'
    min: 0
    max: 0
    arm: with-only
  - name: employer-side
    type: regex
    pattern: "บอกกล่าว|ค่าชดเชย"
    match: contains
    target: last_message
