# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: household-bills-behaviour
description: ค่าไฟเดือนพฤษภาคมขึ้นจาก 1,300 เป็น 2,050 บาท ต้องเทียบหน่วยไม่ใช่บาท ดูจำนวนวันในรอบบิล จดจริงหรือประมาณการ และให้ทดสอบไฟรั่วด้วยมิเตอร์
tags: [behaviour, household-bills]
runs: 3
expected_outcome: คำนวณหน่วยเทียบค่าเฉลี่ย 3 เดือน (ไม่ใช่บาท) · ถามหรือตรวจจำนวนวันในรอบบิลและการจดมิเตอร์จริงหรือประมาณการ · ทดสอบไฟรั่วโดยปิดเครื่องใช้ไฟฟ้าแล้วดูมิเตอร์ · ฤดูร้อน · ไม่แต่งอัตราค่าไฟหรือค่า Ft เอง
execution:
  prompt: |
    ค่าไฟบ้านขึ้นเยอะมาก ไม่รู้ว่าไฟรั่วหรือเปล่า
    ก.พ. 305 หน่วย 1,280 บาท · มี.ค. 318 หน่วย 1,330 บาท · เม.ย. 330 หน่วย 1,390 บาท · พ.ค. 470 หน่วย 2,050 บาท
    บ้านอยู่กรุงเทพ แอร์ 2 เครื่อง ล้างล่าสุดเมื่อปีที่แล้ว ควรทำอะไรก่อน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: compares-units
    type: regex
    pattern: "หน่วย"
    match: contains
    target: last_message
  - name: leak-test
    type: regex
    pattern: "มิเตอร์"
    match: contains
    target: last_message
  - name: spike-steps
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. เทียบหน่วยกับค่าเฉลี่ย 3 เดือนก่อน (ราว 318 หน่วย ขึ้นราว 48%) ไม่ได้เทียบแค่ยอดบาท
      2. ให้ดูจำนวนวันในรอบบิล และดูว่าบิลจดเลขจริงหรือประมาณการ
      3. มีวิธีทดสอบไฟรั่ว: ปิดเครื่องใช้ไฟฟ้าทั้งหมดแล้วดูว่ามิเตอร์ยังหมุนหรือไม่ ถ้ายังหมุนให้เรียกช่างไฟที่มีใบอนุญาต หรือติดต่อการไฟฟ้า
      4. พูดถึงฤดูร้อนและการล้างแอร์เป็นสาเหตุที่เป็นไปได้
      5. ไม่แต่งอัตราค่าไฟต่อหน่วยหรือค่า Ft ขึ้นเองโดยไม่มีแหล่ง
