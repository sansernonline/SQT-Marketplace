# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เขียน 2026-11-10 ยังไม่ได้รัน
schema_version: "1.1"
name: new-job-first-90-days-trigger
description: ผู้ใช้เซ็นสัญญางานใหม่แล้ว เริ่มงานต้นเดือนหน้า ขอแผนช่วงแรกและวิธีผ่านทดลองงาน ไม่เอ่ยชื่อ skill ต้องทำให้ new-job-first-90-days ถูกเปิด
tags: [trigger, new-job-first-90-days]
runs: 3
expected_outcome: เรียก Skill new-job-first-90-days แล้วมีคำถามถามหัวหน้าในสัปดาห์แรกว่าความสำเร็จใน 90 วันหน้าตาอย่างไร และเป้า 30/60/90 วัน
execution:
  prompt: |
    เพิ่งเซ็นสัญญางานใหม่ตำแหน่ง data analyst เริ่ม 1 ธ.ค. ทดลองงาน 119 วัน
    ก่อนเริ่มงานต้องเตรียมอะไร แล้วช่วงแรกควรทำอะไรให้ผ่านโปร วางแผนให้หน่อย
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?new-job-first-90-days"'
    min: 1
    arm: with-only
  - name: has-90-day-stages
    type: regex
    pattern: "30.{0,40}60.{0,40}90"
    match: contains
    target: last_message
