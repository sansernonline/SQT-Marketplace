# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: brand-kit-trigger
description: เจ้าของร้านบ่นว่าโพสต์ดูไม่เป็นชุด ไม่เอ่ยชื่อ skill ต้องทำให้ brand-kit ถูกเปิด และคำตอบมีบทบาทของสี
tags: [trigger, brand-kit]
runs: 3
expected_outcome: เรียก Skill brand-kit แล้วเสนอ kit ที่มีบทบาทสี (พื้น · หลัก · เน้น · ตัวอักษร) และฟอนต์ไทยคู่ละติน
execution:
  prompt: |
    ร้านต้นไม้ของฉันโพสต์เฟซบุ๊กมา 2 ปี แต่ละโพสต์สีกับฟอนต์ไม่เหมือนกันเลย ดูไม่เป็นร้านเดียวกัน
    ช่วยจัดระเบียบให้หน่อย มีโลโก้สีเขียวอยู่แล้วอันเดียว
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?brand-kit"'
    min: 1
    arm: with-only
  - name: colour-roles
    type: regex
    pattern: "accent|สีเน้น|primary|สีหลัก"
    flags: i
    match: contains
    target: last_message
