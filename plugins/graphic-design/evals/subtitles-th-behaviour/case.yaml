# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: subtitles-th-behaviour
description: แก้ซับไทยที่ยาวเกิน เร็วเกิน มีจุดปิดประโยคและ 3 บรรทัด ต้องได้ซับที่ตามกฎความยาว ความเร็ว และเครื่องหมาย
tags: [behaviour, subtitles-th]
runs: 3
expected_outcome: ทุกบรรทัดไม่เกิน 35 ตัว (ไม่นับวรรณยุกต์และสระบนล่าง) · ไม่เกิน 2 บรรทัดต่อซับ · แบ่งซับให้อ่านไม่เกิน 17 ตัวต่อวินาที · ไม่มีจุดปิดประโยคหรือเครื่องหมายคำถาม
execution:
  prompt: |
    แก้ซับนี้ให้ถูกกฎซับไทย ส่งกลับมาเป็น SRT ทั้งไฟล์

    1
    00:00:01,000 --> 00:00:03,000
    วันนี้เราจะมาเรียนรู้วิธีใช้สูตร VLOOKUP เพื่อดึงข้อมูลจากอีกตารางหนึ่งมาใส่ให้อัตโนมัติ.
    พร้อมตัวอย่างจริงจากงานบัญชี
    และเทคนิคที่หลายคนไม่รู้

    2
    00:00:03,000 --> 00:00:04,000
    พร้อมแล้วใช่ไหม?
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: srt-shape
    type: regex
    pattern: "\\d{2}:\\d{2}:\\d{2},\\d{3} --> \\d{2}:\\d{2}:\\d{2},\\d{3}"
    match: contains
    target: last_message
  - name: rules-kept
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ผลเป็น SRT ที่มีเลขลำดับต่อกันและบรรทัดเวลาแบบ 00:00:00,000 --> 00:00:00,000
      2. ทุกบรรทัดยาวไม่เกินราว 35 ตัวอักษร (ไม่นับวรรณยุกต์และสระบนล่าง) และแต่ละซับไม่เกิน 2 บรรทัด
      3. ข้อความเดิมถูกแบ่งเป็นหลายซับหรือขยายเวลา จนอ่านไม่เกินราว 17 ตัวต่อวินาที ไม่ได้ตัดเนื้อหาสำคัญทิ้ง
      4. ตัดบรรทัดระหว่างคำ ไม่ตัดกลางคำ
      5. ข้อความในซับไม่ปิดประโยคด้วยจุด และไม่มีเครื่องหมายคำถาม
