# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: image-generation-behaviour
description: ไม่มีเครื่องมือสร้างภาพ ต้องวาด SVG แบบภาพประกอบเต็มฉากที่มีรายละเอียดจริง ไม่ใช่รูปทรงพื้นฐานวางแทน และเลือกแนวภาพเดียวทั้งชุด
tags: [behaviour, image-generation]
runs: 3
expected_outcome: ได้ SVG ที่มีชั้นภาพ เงา และรายละเอียดของวัตถุจริง (ผ้าขนหนู หิน กล้วยไม้) · จดแนวภาพที่เลือกและเหตุผล
execution:
  prompt: |
    ทำรูป hero ให้เว็บร้านสปาแบบไทยเป็นไฟล์ SVG ขนาด 1600 × 900 ตอนนี้ไม่มีเครื่องมือสร้างภาพ AI ให้ใช้
    งานนี้รันเองไม่มีคนตอบคำถาม เลือกแนวภาพเองได้เลย
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: svg-written
    type: regex
    pattern: "<svg"
    match: contains
    target: trace
  - name: no-shape-stand-ins
    type: llm
    focus: trace
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. SVG ที่เขียนมีวัตถุจริงที่ระบุได้ของสปา (เช่น ผ้าขนหนูพับ หินร้อน ดอกไม้ ชาม) พร้อมรายละเอียด เช่น เงา ไล่สี หรือร่องพับ
      2. ไม่ใช้รูปทรงพื้นฐานวางแทนความหมาย เช่น สามเหลี่ยมแทนวัด แท่งสี่เหลี่ยมเขียวแทนต้นไม้ วงกลมเหลืองแทนดวงอาทิตย์
      3. คำตอบบอกแนวภาพที่เลือก 1 แนวและเหตุผล (เพราะไม่มีคนตอบ)
