# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: video-editing-tts-behaviour
description: เตรียมสคริปต์ที่มีคำอังกฤษ ตัวเลข และจุดเปลี่ยนสไลด์ให้เครื่องอ่านด้วยเสียงที่เลียนจากผู้ใช้ ต้องได้บรรทัดละ 1 ซับ ไฟล์คำอ่าน และขั้นทำร่างก่อน
tags: [behaviour, video-editing]
runs: 3
expected_outcome: แบ่งบรรทัดละ 1 ซับ ไม่เกิน 35 ตัวต่อบรรทัด ใช้ | แบ่ง 2 บรรทัด · คง [สไลด์ n] · ไฟล์คำอ่าน TSV ให้ Docker และ Kubernetes เป็นคำอ่านไทยโดยซับยังแสดงคำเดิม · ทำร่างด้วยเสียง Windows ก่อน · เสียงต้นแบบต้องเป็นเสียงผู้ใช้และมีข้อความตรงกับคลิป
execution:
  prompt: |
    เตรียมสคริปต์นี้ให้เครื่องอ่านเป็นเสียงไทย จะใช้ F5-TTS-THAI ที่เลียนเสียงผมเอง ส่งไฟล์ที่ต้องใช้และคำสั่งมาให้

    [สไลด์ 1]
    สวัสดีครับ วันนี้เราจะเรียนเรื่อง Docker กับ Kubernetes ใน 20 นาที
    [สไลด์ 2]
    Docker คือกล่องที่ใส่โปรแกรมพร้อมทุกอย่างที่มันต้องใช้ ย้ายไปเครื่องไหนก็รันได้เหมือนเดิม
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: lexicon-file
    type: regex
    pattern: "Docker\\t|Docker\\s+(ด็อก|ดอก)|\\.tsv"
    match: contains
    target: last_message
  - name: prepared-right
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. สคริปต์ที่เตรียมให้แบ่งเป็นบรรทัดละ 1 ซับ บรรทัดหนึ่งยาวไม่เกินราว 35 ตัวอักษร และใช้ | (หรือวิธีที่บอกชัด) แบ่งซับที่ยาวเป็น 2 บรรทัด
      2. ยังคง [สไลด์ 1] และ [สไลด์ 2] ไว้ก่อนบรรทัดที่สไลด์เปลี่ยน
      3. มีไฟล์คำอ่านแบบ คำ<TAB>คำอ่าน ให้ Docker และ Kubernetes เป็นคำอ่านภาษาไทย และบอกว่าซับยังแสดงคำเดิม
      4. ให้ทำร่างด้วยเสียงที่มากับ Windows หรือรอบสั้นก่อนสร้างเสียงตัวจริง หรือให้คำสั่ง tts_cues.py ที่ใช้ได้
      5. บอกว่าเสียงต้นแบบต้องเป็นเสียงของผู้ใช้เองหรือมีหนังสือยินยอม และข้อความต้นแบบต้องตรงกับที่พูดในคลิป
