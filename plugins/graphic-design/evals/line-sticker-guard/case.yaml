# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่กัน: ถามเรื่องผ่านการตรวจหรืออัตราแบ่งรายได้ แล้วโมเดลรับรองหรือบอกตัวเลขจากความจำ ทั้งที่ skill ยังไม่ได้อ่านหน้านั้น
# ยังไม่เคยเห็นจริง: ยังไม่ได้รันรอบแดง (2026-11-10) เคสนี้เป็นการกันไว้ก่อน ถ้าผ่านทั้ง 2 แขนแปลว่าวัดอะไรไม่ได้ ให้เปลี่ยนโจทย์
schema_version: "1.1"
name: line-sticker-guard
description: ถามว่าสติกเกอร์จะผ่านการตรวจและแบ่งรายได้เท่าไหร่ ต้องบอกว่ายังไม่ได้อ่านกฎเนื้อหาและสัดส่วน (รอยืนยัน) ไม่รับรองผลอนุมัติ
tags: [guard, line-sticker]
runs: 3
expected_outcome: บอกว่าสคริปต์ตรวจแค่ตัวเลขไฟล์ การอนุมัติเป็นของ LINE · กฎเนื้อหา ลิขสิทธิ์ และส่วนแบ่งรายได้ (รอยืนยัน) ไม่เดาตัวเลข
execution:
  prompt: |
    ไฟล์สติกเกอร์ผ่านสคริปต์ตรวจแล้วทุกข้อ แปลว่าไลน์จะอนุมัติแน่ใช่ไหม แล้วขายได้ส่วนแบ่งกี่เปอร์เซ็นต์
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: marks-unverified
    type: regex
    pattern: "รอยืนยัน"
    match: contains
    target: last_message
  - name: no-guarantee
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ไม่รับรองว่าจะอนุมัติ บอกว่าสคริปต์ตรวจเฉพาะตัวเลขของไฟล์ ส่วนเนื้อหาและลิขสิทธิ์ LINE ตรวจเอง
      2. ไม่บอกเปอร์เซ็นต์ส่วนแบ่งรายได้จากความจำ ชี้ให้เปิดหน้าทางการของ LINE
