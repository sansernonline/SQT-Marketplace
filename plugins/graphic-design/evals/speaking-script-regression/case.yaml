# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการเดิม (2026-10-23): เมื่อขอสคริปต์พูดหน้ากล้อง agent เขียนออกมาเป็นบทความ — ย่อหน้ายาว เปิดด้วย "สวัสดีครับ วันนี้เราจะมา..."
# ใช้คำเชื่อมภาษาเขียน (เนื่องจาก ดังนั้น) อ่านออกเสียงแล้วสะดุด — speaking-script กฎ "write for the ear" เพิ่มเพื่อปิดจุดนี้
schema_version: "1.1"
name: speaking-script-regression
description: ขอบทพูดสั้นโดยสั่งให้ส่งเฉพาะบทพูด ต้องไม่หลุดเป็นบทความหรือรายการคุณสมบัติ และต้องอ่านออกเสียงได้ลื่น
tags: [regression, speaking-script]
runs: 3
expected_outcome: บทพูดเปิดด้วย hook ไม่ใช่คำทักทาย · กล่าวถึงเบสกับแบตในภาษาพูด · ไม่มีคำภาษาเขียน · ไม่มีหัวข้อหรือ bullet แบบเอกสาร
execution:
  prompt: |
    เขียนสคริปต์พูด 30 วินาที เปิดคลิปรีวิวหูฟังไร้สายรุ่นใหม่ ราคา 1,990 บาท
    เน้นว่าเบสแน่นและแบตอยู่ได้ทั้งวัน ส่งกลับมาเฉพาะบทพูด ไม่ต้องอธิบายขั้นตอน
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: no-written-thai
    type: regex
    pattern: "เนื่องจาก|ดังนั้น|อย่างไรก็ตาม|ทั้งนี้|คุณสมบัติ"
    match: not_contains
    target: last_message
  - name: key-facts-present
    type: regex
    pattern: "เบส"
    match: contains
    target: last_message
  - name: not-an-article
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ประโยคแรกไม่ใช่คำทักทายหรือ "วันนี้เราจะมารีวิว" แต่เป็น hook ที่ทำให้อยากฟังต่อ
      2. ไม่มีหัวข้อ ไม่มี bullet ไม่มีการจัดหน้าแบบเอกสาร — เป็นบทพูดล้วนที่เอาไปอ่านหน้ากล้องได้ทันที
      3. อ่านออกเสียงตามปกติแล้วอยู่ในราว 30 วินาที (ไม่ยาวเป็นบทความ 3 ย่อหน้า)
      4. ราคา 1,990 บาท เบส และแบต ถูกกล่าวถึงในภาษาที่คนพูดจริง ไม่ใช่ภาษาโบรชัวร์
