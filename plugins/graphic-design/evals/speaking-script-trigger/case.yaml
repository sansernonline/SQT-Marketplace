# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: speaking-script-trigger
description: โจทย์สคริปต์พูดหน้ากล้องภาษาไทย ไม่เอ่ยชื่อ skill ต้องทำให้ speaking-script ถูกเปิด และคำตอบเป็นบทพูดภาษาพูด
tags: [trigger, speaking-script]
runs: 3
expected_outcome: เรียก Skill speaking-script ก่อนเขียน แล้วส่งบทพูดที่มีคำลงท้ายภาษาพูด (ครับ/ค่ะ) และไม่มีคำเชื่อมภาษาเขียน
execution:
  prompt: |
    ช่วยเขียนสคริปต์ให้ฉันพูดหน้ากล้องคลิป TikTok รีวิวร้านกาแฟเปิดใหม่แถวบ้าน ยาวราว 45 วินาที
    อยากได้ฟีล influencer พูดกับเพื่อน จุดขายคือกาแฟดริปช้า กับมุมนั่งริมต้นไม้ใหญ่
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?speaking-script"'
    min: 1
    arm: with-only
  - name: spoken-particle-present
    type: regex
    pattern: "ครับ|ค่ะ"
    match: contains
    target: last_message
  - name: no-written-thai
    type: regex
    pattern: "เนื่องจาก|ดังนั้น|อย่างไรก็ตาม|ทั้งนี้|คุณสมบัติ"
    match: not_contains
    target: last_message
