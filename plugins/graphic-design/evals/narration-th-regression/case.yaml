# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23) · ยังไม่ได้รันจริง (เสียเงิน)
# อาการที่กัน (งานจริง 2026-11-26 · พรีเซนต์ขาย EIT): ใช้กฎ tutorial เปลี่ยนทุกช่องว่างเป็น , จนเสียงหยุดถี่ ("เหมือนยังเว้นวรรคไม่ค่อยดีเลย")
# · แท็บเล็ตถูกเครื่องแยกเป็น 2 คำ ("tablet ยังเว้นวรรคน่ะ") · POS อ่านว่าพีโอส ("มันอ่านว่า พี โอ เอส")
schema_version: "1.1"
name: narration-th-regression
description: บทพรีเซนต์สไลด์ละประโยคยาวที่มี Tablet และ POS ต้องไม่ใช้กฎ tutorial ตรวจคำที่เครื่องแยกก่อน และสะกดตัวย่อแบบมีขีด
tags: [regression, narration-th]
runs: 3
expected_outcome: ใช้ --keep-spaces กับ , เฉพาะจุดที่ควรหยุด ไม่เปลี่ยนทุกช่องว่างเป็น , · สั่ง split_words.py check (หรือดูเวลาของคำ) หาคำที่เครื่องแยก · POS เขียนคำอ่านว่า พี-โอ-เอส
execution:
  prompt: |
    ทำเสียงบรรยายไทยด้วย edge-tts ให้วิดีโอพรีเซนต์ขาย สไลด์ละบรรทัด ส่งคำสั่งกับไฟล์ที่ต้องใช้มาในแชต ไม่ต้องสร้างเสียงจริง

    รองรับอุปกรณ์หน้าร้านครบชุด ทั้งเครื่อง POS เครื่องพิมพ์ใบเสร็จ ลิ้นชักเก็บเงิน และ Tablet รับออเดอร์
    ทีมรับออเดอร์ผ่าน Tablet ส่งเข้าเครื่อง POS และลูกค้าขอใบกำกับภาษีเองได้ผ่าน QR
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: split-check
    type: regex
    pattern: "split_words\\.py|WordBoundary|แยก(เป็น)? ?(2|สอง) ?คำ"
    flags: i
    match: contains
    target: last_message
  - name: presentation-rules
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ไม่สั่งให้เปลี่ยนทุกช่องว่างระหว่างคำไทยเป็นจุลภาค · ใช้ --keep-spaces (หรือบอกว่าช่องว่างเป็นจังหวะสั้น) และใส่ , เฉพาะจุดที่ควรหยุด เช่นระหว่างรายการ
      2. บอกให้ตรวจคำที่เครื่องอ่านแยกเป็น 2 คำในประโยค (เช่น Tablet) ก่อนสร้างทั้งชุด ด้วย split_words.py check หรือดูเวลาของคำ
      3. คำอ่านของ POS เป็นการสะกดทีละตัวแบบมีขีดคั่น เช่น พี-โอ-เอส ไม่ใช่ พอส หรือ พีโอเอส
