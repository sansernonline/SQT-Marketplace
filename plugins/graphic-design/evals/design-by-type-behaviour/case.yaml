# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: design-by-type-behaviour
description: ขอแบนเนอร์ร้านเมล็ดกาแฟ ต้องจดยอดนิยมของต้นแบบพร้อมวันที่ และเขียนสูตรผสม 2–3 ชิ้นต่อแนว (เตรียมไว้ 2026-11-19 ยังไม่ได้รัน)
tags: [behaviour, design-by-type]
runs: 3
expected_outcome: แต่ละแนวอ้างต้นแบบจริง 2–3 ชิ้นพร้อมตัวเลขความนิยมและวันที่ดู แล้วบอกว่าเอาอะไรจากชิ้นไหน (โครง · ของเด่น · สีและแสง) และอะไรที่เปลี่ยนให้เป็นของร้านนี้
execution:
  prompt: |
    ทำแบนเนอร์ Facebook 1200x628 ให้ร้านเมล็ดกาแฟคั่วจากเชียงราย ขายออนไลน์ อยากได้ 3 แบบให้เลือก
    ยังไม่มีโลโก้ ส่งแผนแต่ละแบบมาก่อนก็ได้ ว่าผสมจากงานไหน
  max_turns: 10
  timeout_seconds: 420
graders:
  - name: popularity-numbers
    type: regex
    pattern: '\d[\d.,]*\s*[km]?\s*(views?|likes?|appreciations?|saves?)\b|(ยอดดู|ยอดวิว|ถูกใจ|ยอดไลก์)\s*\d|\d[\d.,]*\s*(วิว|ไลก์|ครั้ง)|ไม่แสดงยอด|เริ่มลง(โฆษณา)?|start date'
    flags: i
    match: contains
    target: last_message
  - name: blend-recipe
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อมีครบ 3 เรื่อง:
      1. มี 3 แนวที่ต่างกันจริงในโครงหรือของเด่น ไม่ใช่ต่างแค่สี
      2. แต่ละแนวอ้างงานจริง 2–3 ชิ้นพร้อมลิงก์และตัวเลขความนิยม (หรือบอกว่าเว็บไหนดูตัวเลขไม่ได้)
      3. แต่ละแนวบอกว่าเอาอะไรจากชิ้นไหน และเปลี่ยนอะไรให้เป็นของร้านนี้ ไม่ลอกสีแบรนด์ของต้นแบบไปตรงๆ
