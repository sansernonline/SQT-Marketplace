# เตรียมไว้ ยังไม่ได้รัน (2026-11-10)
schema_version: "1.1"
name: line-sticker-trigger
description: อยากทำสติกเกอร์ LINE ขายเอง ไม่เอ่ยชื่อ skill ต้องเปิด line-sticker และให้ขนาด 370 x 320
tags: [trigger, line-sticker]
runs: 3
expected_outcome: เรียก Skill line-sticker แล้วให้ขนาดภาพสูงสุด 370 × 320 และจำนวนต่อชุดที่ใช้ได้
execution:
  prompt: |
    วาดตัวการ์ตูนหมาไว้แล้ว อยากทำเป็นสติกเกอร์ไลน์ขายใน Creators Market
    ต้องทำกี่ภาพ ขนาดเท่าไหร่ ไฟล์แบบไหน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?line-sticker"'
    min: 1
    arm: with-only
  - name: max-size
    type: regex
    pattern: "370\\s*[×xX]\\s*320"
    match: contains
    target: last_message
