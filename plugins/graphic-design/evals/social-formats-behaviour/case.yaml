# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: social-formats-behaviour
description: platform-sizes.md ไม่เก็บตัวเลขแล้ว ต้องดูสดจากหน้าทางการ (feed 4:5 · story 9:16) แล้วอ้างแหล่ง และตัวเลขที่ยังรอยืนยันต้องบอกผู้ใช้
tags: [behaviour, social-formats]
runs: 3
expected_outcome: ดูสดหรืออ้างหน้าทางการของ Meta สำหรับขนาด feed และพื้นที่ปลอดภัยของสตอรี่ · ขนาดภาพโพสต์ X บอกว่ายังไม่ยืนยัน · ไม่ใช้ CMYK กับงานจอ
execution:
  prompt: |
    ทำตารางขนาดภาพให้ทีมหน่อย ใช้กับแคมเปญลดราคาปลายปี: Instagram feed, Instagram story, รูปในโพสต์ X
    บอกด้วยว่าแต่ละอันต้องเว้นขอบตรงไหน และตัวเลขไหนมั่นใจได้แค่ไหน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: cites-or-looks-up-source
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ขนาดของ Instagram feed และ story มาจากการค้นดูสดหรือมีลิงก์หน้าทางการของ Meta (facebook.com/business/ads-guide) กำกับ ไม่ได้พูดเหมือนจำค่าได้เอง
      2. ถ้าเปิดหน้าทางการไม่ได้ ตัวเลขต้องถูกติดป้ายว่ายังไม่ยืนยัน (รอยืนยัน)
  - name: flags-unconfirmed
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. มีตารางขนาดของ 3 ตำแหน่งที่โจทย์ขอ
      2. บอกพื้นที่ปลอดภัยของ story (บน ล่าง ข้าง) พร้อมแหล่งที่มา หรือบอกว่าต้องดูจากหน้าทางการ
      3. ขนาดรูปในโพสต์ X ถูกบอกว่ายังไม่ยืนยันหรือให้ตรวจที่หน้าแพลตฟอร์มก่อน ไม่ได้พูดเหมือนเป็นค่าทางการแน่นอน
