# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เตรียมไว้ ยังไม่ได้รัน (2026-10-28)
schema_version: "1.1"
name: brief-to-image-behaviour
description: เลือกภาพจากหลายแบบ ต้องตัดภาพที่ผิดทางกายภาพทิ้ง ไม่ใช้เป็นคะแนนซ้ำ และเรื่องรสนิยมให้ผู้ใช้เลือก
tags: [behaviour, brief-to-image]
runs: 3
expected_outcome: ตัดภาพที่ฟิสิกส์ผิดด้วยกฎเหล็ก · ให้คะแนนเกณฑ์อื่น · ผลสูสีให้ผู้ใช้เลือก · บอกว่าน้ำหนักเป็นค่าตั้งต้นยังไม่ได้วัด
execution:
  prompt: |
    ได้ภาพมัทฉะมา 3 แบบ แบบ A สวยสุดแต่แก้วลอยเหนือโต๊ะ แบบ B ตรงโจทย์ครบ แบบ C ตรงโจทย์แต่เว้นที่หัวข้อน้อย ช่วยเลือกให้หน่อย
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: hard-rule-and-user-choice
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ตัดแบบ A ทิ้งเพราะแก้วลอย (ผิดทางกายภาพ) ก่อนเทียบเรื่องอื่น ไม่ใช่แค่หักคะแนน
      2. เทียบ B กับ C ด้วยเกณฑ์ที่ระบุชัด (เช่น ตรงโจทย์ · เว้นที่หัวข้อ)
      3. ถ้าผลสูสี บอกว่าผู้ใช้เป็นคนเลือกขั้นสุดท้าย ไม่ฟันธงเรื่องรสนิยมด้วยตัวเลข
