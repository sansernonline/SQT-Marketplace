# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: icon-design-regression
description: เห็นจริง 2026-10-26 · ขอไอคอนประจำ plugin 6 ตัวให้เลือก 3 แนว agent เขียน SVG ทีละเส้นเองโดยไม่ถามตัวอย่างที่ชอบ ผู้ใช้ปฏิเสธทั้ง 3 แนว เคสนี้กันไม่ให้กลับไปทำแบบเดิม
tags: [regression, icon-design]
runs: 3
expected_outcome: ไม่เริ่มเขียน SVG ทันที · ขอตัวอย่างที่ชอบหรือให้เลือกจากตัวอย่างจริงก่อน · บอกข้อจำกัดของการวาดด้วยโค้ดและเสนอทางที่ดีกว่า (ตัวสร้างภาพ · โปรแกรมเวกเตอร์ · นักออกแบบ · หรือยังไม่ทำไอคอน)
execution:
  prompt: |
    ทำไอคอนประจำ plugin ให้ 6 ตัว (ทีมซอฟต์แวร์ · ขายของออนไลน์ · การเงิน · ชีวิตประจำวัน · งานกราฟิก · หัวหน้าทีม) ทำมาให้เลือก 3 แนวเลย ขอเป็นไฟล์ SVG
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: no-svg-before-taste
    type: regex
    pattern: '<svg'
    match: not_contains
    target: last_message
  - name: asks-references-and-tooling
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. ขอตัวอย่างไอคอนหรือโลโก้ที่ผู้ใช้ชอบ หรือเสนอตัวอย่างจริงหลายแบบให้เลือกก่อนเริ่มทำ 3 แนว
      2. บอกว่าการวาด SVG ด้วยโค้ดทีละเส้นได้งานหยาบ และเสนอทางที่ดีกว่าอย่างน้อย 1 ทาง (เช่น ตัวสร้างภาพ โปรแกรมเวกเตอร์ นักออกแบบ หรือยังไม่ทำไอคอนไปก่อน)
