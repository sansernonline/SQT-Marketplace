# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เคส "ไม่ควรเปิด": กันการแก้ description แล้ว skill เปิดบ่อยเกิน · ผ่านเมื่อ skill ไม่ถูกเปิดทุกรอบ · เตรียมไว้ ยังไม่ได้รัน (2026-10-28)
schema_version: "1.1"
name: marketplace-product-images-trigger-negative
description: ขอโพสต์ Instagram ไม่ใช่รูปสินค้าบนมาร์เก็ตเพลส ต้องไม่เปิด marketplace-product-images
tags: [trigger, negative, marketplace-product-images]
runs: 5
expected_outcome: ไม่เปิด Skill marketplace-product-images · พูดถึงโพสต์ Instagram
execution:
  prompt: |
    ร้านเรามีเสื้อโปโลคอลเลกชันใหม่ ช่วยคิดแนวโพสต์ Instagram 1 โพสต์ให้คนอยากกดดู ยังไม่ได้ลงขายใน Shopee
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: marketplace-product-images-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?marketplace-product-images"'
    min: 0
    max: 0
    arm: with-only
  - name: on-topic
    type: regex
    pattern: "Instagram|IG|โพสต์"
    flags: i
    match: contains
    target: last_message
