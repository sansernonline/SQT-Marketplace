# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่กัน: ครีมหรือเครื่องสำอาง skill ไม่ได้อ่านประกาศหมวดนี้ แต่โมเดลเอากฎอาหารไปตัดสินเหมือนอ่านแล้ว
# ยังไม่เคยเห็นจริง: ยังไม่ได้รันรอบแดง (2026-11-10) เคสนี้เป็นการกันไว้ก่อน ถ้าผ่านทั้ง 2 แขนแปลว่าวัดอะไรไม่ได้ ให้เปลี่ยนโจทย์
schema_version: "1.1"
name: copy-claims-check-guard
description: ครีมบำรุงผิว (เครื่องสำอาง) ต้องบอกว่าประกาศหมวดนี้ยังไม่ได้อ่าน (รอยืนยัน) ไม่เอากฎอาหารไปตัดสินแทน
tags: [guard, copy-claims-check]
runs: 3
expected_outcome: บอกว่ากฎที่อ่านแล้วเป็นของอาหาร เครื่องสำอางต้องตรวจประกาศของหมวดนั้นก่อน (รอยืนยัน) ไม่รับรองว่าผ่านหรือไม่ผ่านตามกฎอาหาร
execution:
  prompt: |
    ตรวจข้อความโฆษณาครีมทาหน้าหน่อย ว่าผิดกฎโฆษณาไหม: "ครีมหน้าใสที่สุด ลดฝ้ากระใน 14 วัน"
  max_turns: 5
  timeout_seconds: 150
graders:
  - name: marks-unverified
    type: regex
    pattern: "รอยืนยัน"
    match: contains
    target: last_message
  - name: no-borrowed-verdict
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกตรง ๆ ว่ากฎที่ skill อ่านจริงเป็นของอาหาร และของเครื่องสำอางต้องเปิดประกาศหมวดนั้นของ อย. ก่อน
      2. ไม่ตัดสินว่าข้อความ "ผิดตามประกาศ อย." เครื่องสำอาง โดยอ้างเลขข้อของประกาศอาหาร
      3. ยังชี้ได้ว่าคำว่า "ที่สุด" และการอ้างผลภายในกี่วันเป็นข้อที่ควรมีหลักฐานหรือให้ผู้รับผิดชอบด้านกฎหมายดู
      4. มีบอกว่าไม่ใช่คำปรึกษากฎหมาย
