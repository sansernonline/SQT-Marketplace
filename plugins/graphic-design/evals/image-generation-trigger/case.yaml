# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: image-generation-trigger
description: โจทย์หน้าเว็บที่ต้องมีรูปจริง ไม่เอ่ยชื่อ skill ต้องทำให้ image-generation ถูกเปิด และถามหรือเลือกแนวภาพ
tags: [trigger, image-generation]
runs: 3
expected_outcome: เรียก Skill image-generation แล้วถามหรือเลือกแนวภาพ (photo · flat · 3d · watercolor · line · isometric) ก่อนทำรูป
execution:
  prompt: |
    หน้า landing ของคลินิกทันตกรรมเราตอนนี้มีแต่กล่องสีเทาวางแทนรูป
    ช่วยหารูปหรือทำรูปใส่ให้หน่อย ต้องมีรูป hero 1 รูป กับรูปบริการ 3 รูป (ขูดหินปูน จัดฟัน ฟอกสีฟัน)
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?image-generation"'
    min: 1
    arm: with-only
  - name: style-named
    type: regex
    pattern: "photo|flat|3d|watercolor|isometric|ภาพถ่าย|แนวภาพ"
    flags: i
    match: contains
    target: last_message
