# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เตรียมไว้ ยังไม่ได้รัน (2026-11-10)
schema_version: "1.1"
name: copy-claims-check-behaviour
description: ตรวจข้อความอาหารเสริมต้องให้ตารางผลตรวจ อ้างเลขข้อ/ที่มาของ อย. และบอกว่าไม่ใช่คำปรึกษากฎหมาย
tags: [behaviour, copy-claims-check]
runs: 3
expected_outcome: ตารางผลตรวจ (ข้อความ · ที่ไหน · ระดับ · แก้อย่างไร) · อ้างประกาศ อย. หลักเกณฑ์การโฆษณาอาหาร พ.ศ. 2564 · บอกว่าไม่ใช่คำปรึกษากฎหมาย
execution:
  prompt: |
    ใช้ copy-claims-check ตรวจข้อความโฆษณาอาหารเสริมนี้ก่อนโพสต์:
    "กาแฟเบิร์นไขมัน สุดยอดอาหารเสริม ผอมเร็ว ไม่มีผลข้างเคียง" พร้อมภาพก่อนและหลังลดน้ำหนัก
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: cites-fda
    type: regex
    pattern: "พ\\.ศ\\. 2564|หลักเกณฑ์การโฆษณาอาหาร"
    match: contains
    target: last_message
  - name: not-legal-advice
    type: regex
    pattern: "ไม่ใช่คำปรึกษากฎหมาย"
    match: contains
    target: last_message
  - name: table-and-rewrite
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. มีตารางหรือรายการผลตรวจแยกต่อข้อความ ระบุว่าอยู่ที่ไหนและแก้อย่างไร
      2. จับได้อย่างน้อย "สุดยอด" "ไม่มีผลข้างเคียง" และการลดน้ำหนัก/ภาพก่อนและหลัง
      3. ข้อเสนอแก้คือตัดออก ใช้ข้อเท็จจริงที่พิสูจน์ได้ หรือขออนุญาตก่อน ไม่ใช่เปลี่ยนคำให้อ้อมแต่ความหมายเดิม
      4. ไม่บอกว่า "ผ่านกฎหมายแล้ว" หรือรับรองว่าโพสต์ถูกกฎหมาย
