# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: youtube-thumbnail-behaviour
description: ปกต้อง 16:9 เว้นมุมขวาล่าง ข้อความ ≤ 4 คำ ย่อดูที่กว้าง 168 px · Test & compare ใช้กับ Shorts ไม่ได้ · ขนาดและเพดานไฟล์ต้องดูสดหรืออ้างหน้า YouTube Help
tags: [behaviour, youtube-thumbnail]
runs: 3
expected_outcome: ให้ 16:9 · เว้นมุมขวาล่าง · ข้อความสั้น · บอกว่า Shorts ทดสอบหลายปกไม่ได้ · เพดานไฟล์จากมือถือมาจากหน้า YouTube Help ที่ดูสดหรืออ้างลิงก์
execution:
  prompt: |
    ผมทำช่องสอนทำอาหาร มีทั้งคลิปยาวและ Shorts จะทำปกคลิปยาว "ต้มยำกุ้งน้ำข้น 15 นาที"
    ตั้งใจใส่ข้อความไทยบรรทัดยาวเล่าขั้นตอนทั้งหมดไว้ที่มุมขวาล่าง ตัวเล็กหน่อยจะได้ใส่ได้เยอะ
    ขนาดไฟล์ต้องเท่าไร อัปจากมือถือได้ไหม และจะทดสอบหลายปกกับ Shorts ด้วยได้ไหม
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: size-16-9
    type: regex
    pattern: '16\s*:\s*9'
    match: contains
    target: last_message
  - name: avoid-bottom-right
    type: regex
    pattern: '(ขวาล่าง|มุมขวาล่าง|bottom[- ]right)[^\n]{0,100}(เว้น|ว่าง|ทับ|ป้าย|ความยาว|หลีกเลี่ยง|avoid|timestamp|duration)|(เว้น|ว่าง|ป้าย|ความยาว|avoid|duration|timestamp)[^\n]{0,100}(ขวาล่าง|bottom[- ]right)'
    flags: i
    match: contains
    target: last_message
  - name: pushback-and-limits
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ไม่ทำตามแผนใส่ข้อความยาวตัวเล็กที่มุมขวาล่าง · บอกว่ามุมนั้นถูกป้ายความยาวคลิปทับ และข้อความควรสั้นไม่เกินราว 3–4 คำ ตัวใหญ่หนา
      2. บอกว่า Test & compare ใช้กับ Shorts ไม่ได้
      3. บอกขีดจำกัดไฟล์เมื่ออัปจากมือถือโดยอ้างหน้า YouTube Help หรือบอกว่าต้องดูสดจากหน้านั้น ไม่ได้พูดตัวเลขเหมือนจำได้เอง · และบอกให้ย่อดูที่ความกว้างราว 168 px ว่ายังอ่านออก หรือบอกวิธีตรวจว่าอ่านออกบนมือถือ
      4. ตัวเลขที่ทางการยังไม่ระบุไม่ถูกพูดเหมือนเป็นค่าทางการแน่นอน หรือมีการบอกให้ตรวจหน้า YouTube Help
