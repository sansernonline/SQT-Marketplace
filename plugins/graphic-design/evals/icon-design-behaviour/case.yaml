# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: icon-design-behaviour
description: ขอไอคอนแอปใหม่สำหรับ iOS Android และเว็บ ต้องขอตัวอย่างที่ผู้ใช้ชอบก่อน บอกขนาดและ safe zone ตามแพลตฟอร์ม และไม่ใส่เงาหรือข้อความในไอคอนแอป
tags: [behaviour, icon-design]
runs: 3
expected_outcome: ถามหาตัวอย่างไอคอนที่ชอบก่อนลงมือ · iOS 1024 ไม่ตัดมุมเอง · Android adaptive 108dp เนื้อหาใน 66dp · เว็บ favicon 32 กับ apple-touch-icon 180 · ไม่ใส่เงา bevel หรือข้อความในไอคอนแอป
execution:
  prompt: |
    ช่วยออกแบบไอคอนแอปให้แอปบันทึกรายรับรายจ่ายของร้านค้าเล็ก ๆ ชื่อ "จดง่าย" หน่อย
    ต้องใช้ทั้งบน iPhone, Android และเป็น favicon ของเว็บด้วย อยากให้มีชื่อแอปอยู่ในไอคอนแล้วมีเงานูน ๆ ดูหรู
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: ios-1024
    type: regex
    pattern: '1024'
    match: contains
    target: last_message
  - name: android-safe-zone
    type: regex
    pattern: '108|66 ?dp'
    match: contains
    target: last_message
  - name: references-first
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อคำตอบขอให้ผู้ใช้ส่งหรือเลือกตัวอย่างไอคอนหรือโลโก้ที่ชอบก่อนลงมือออกแบบ (ถามแบบตัวเลือกหรือขอรูปก็ได้) · ตกถ้าลงมือวาดหรือส่ง SVG ทันทีโดยไม่ถามรสนิยมเลย
  - name: no-text-no-bevel
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อคำตอบค้านหรือเตือนอย่างน้อย 1 ใน 2 เรื่องนี้พร้อมเหตุผล: ใส่ชื่อแอปในไอคอน (อ่านไม่ออกเมื่อเล็ก · Apple ให้เลี่ยงข้อความ) หรือใส่เงานูนเอง (Apple ห้ามใส่เงา bevel glow เพราะระบบจัดการเอง)
