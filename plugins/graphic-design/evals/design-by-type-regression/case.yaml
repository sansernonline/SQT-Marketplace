# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: design-by-type-regression
description: เห็นจริง 2026-11-18 · เจ้าของบอกว่า "ยังดูแข็งๆ เหมือน ai look แต่สี ok แล้ว" งานรอบต่อไปเปลี่ยนสีแทนที่จะแก้ความแข็ง เคสนี้กันไม่ให้กลับไปทำแบบเดิม (เตรียมไว้ 2026-11-19 ยังไม่ได้รัน)
tags: [regression, design-by-type]
runs: 3
expected_outcome: คงสีเดิมไว้ ไล่หาสาเหตุความแข็งตามคำถาม 6 ข้อ (ข้ามขอบ · ระยะเท่ากันหมด · ของไม่เท่ากันวาดเท่ากัน · ลายไม่มีความหมาย · แสงมาจากไหน · ตัวอักษรมีชีวิต) แล้วบอกวิธีแก้เป็นข้อๆ
execution:
  prompt: |
    ปกเอกสารที่ทำมายังดูแข็งๆ เหมือน ai look แต่สี ok แล้ว
    ตอนนี้ปกเป็นพื้นขาว ชื่อระบบอยู่กลางหน้า ใต้ชื่อมีการ์ด 4 ใบเท่ากันเรียงเป็นแถว ระยะห่างทุกส่วนเท่ากัน ฟอนต์ Inter ทั้งหน้า
    ช่วยบอกว่าต้องแก้อะไร
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: stiffness-diagnosis
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อมีครบ 4 เรื่อง:
      1. ไม่เสนอเปลี่ยนสีหลัก (เจ้าของบอกว่าสีโอเคแล้ว)
      2. ชี้สาเหตุความแข็งอย่างน้อย 3 ข้อจากรายละเอียดที่ให้มา เช่น การ์ด 4 ใบเท่ากัน ระยะห่างเท่ากันทุกส่วน ไม่มีอะไรข้ามขอบ ตัวอักษรเป็นฟอนต์พื้นฐานทั้งหน้า จัดกลางทั้งหมด
      3. แต่ละสาเหตุมีวิธีแก้ที่ทำได้จริง (เช่น ให้ชิ้นหลักใหญ่กว่า จัดกลุ่มระยะตามความหมาย ให้ชิ้นหนึ่งวางคร่อมขอบ ใช้ฟอนต์หัวเรื่องที่มีบุคลิก จัดชิดซ้าย)
      4. ชี้อย่างน้อย 1 สาเหตุที่ prompt ไม่ได้บอก เช่น ไม่มีทิศแสงหรือเงา หรือตัวอักษรหัวเรื่องหนาเท่าเนื้อความ
