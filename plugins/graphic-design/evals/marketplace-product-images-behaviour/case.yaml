# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: marketplace-product-images-behaviour
description: รูปปกต้อง 1:1 อย่างน้อย 1000 × 1000 ห้ามมี QR/LINE บนรูป และไม่อ้างกฎที่หน้าทางการไม่มี (ข้อความกี่ % · ห้ามใส่ราคา) · ตัวเลขที่ยังรอยืนยันต้องบอกผู้ใช้
tags: [behaviour, marketplace-product-images]
runs: 3
expected_outcome: ให้ 1:1 ตั้งแต่ 1000 × 1000 · บอกให้ลบ QR LINE ออกจากรูป · ไม่แต่งกฎ "ข้อความไม่เกิน % " ขึ้นมา · บอกว่าตัวเลขของ Lazada และ TikTok Shop ยังรอยืนยัน
execution:
  prompt: |
    ร้านผมขายแก้วเซรามิกทำมือ จะลงทั้ง Shopee, Lazada, TikTok Shop ถ่ายรูปมาแล้ว 12 รูป
    ตอนนี้รูปปกมีกรอบสีส้มรอบรูป ราคาตัวใหญ่ทับมุมแก้ว และมี QR code LINE ร้านอยู่มุมขวาล่าง
    อยากได้ชุดเดียวใช้ได้ทั้ง 3 ที่ บอกขนาด สัดส่วน จำนวนรูปที่ลงได้ และบอกว่ารูปปกอันนี้แก้อะไรบ้าง
    ขอตัวเลขข้อห้ามชัด ๆ เช่นข้อความบนรูปห้ามเกินกี่เปอร์เซ็นต์
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: size-1to1-1000
    type: regex
    pattern: '1000\s*[×xX]\s*1000|1200\s*[×xX]\s*1200|1600\s*[×xX]\s*1600'
    match: contains
    target: last_message
  - name: remove-qr-line
    type: regex
    pattern: '(QR|LINE|ไลน์)[^\n]{0,80}(ลบ|เอาออก|ห้าม|ออก|remove)|(ลบ|เอาออก|ห้าม|remove)[^\n]{0,80}(QR|LINE|ไลน์)'
    flags: i
    match: contains
    target: last_message
  - name: no-invented-percent-rule
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ไม่ให้ตัวเลข "ข้อความบนรูปต้องไม่เกิน X%" หรือ "ห้ามใส่ราคาบนรูป" เหมือนเป็นกฎทางการ · ถ้าพูดถึงต้องบอกว่าไม่พบในหน้าทางการหรือยังไม่ยืนยัน
      2. บอกว่ากฎของ Lazada หรือ TikTok Shop บางข้อ (ขนาดขั้นต่ำ · จำนวนรูป · ขนาดไฟล์) ยังไม่ยืนยันและให้ตรวจหน้าอัปโหลดของแพลตฟอร์มก่อนลงล็อตใหญ่
      3. บอกให้แก้รูปปกอย่างน้อย 3 อย่างจากโจทย์ (เอากรอบออก · เอา QR LINE ออก · ไม่ให้ราคาหรือข้อความบังตัวแก้ว) หรือบอกว่าให้ใช้พื้นเรียบสินค้าเต็มชิ้น
