# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: print-ready-files-behaviour
description: งานจาก Canva ส่งโรงพิมพ์ต้องมี bleed 3 มม. CMYK ตัวหนังสือเล็กดำ 100K และไวนิลใช้ความละเอียดต่ำกว่าใบปลิว · ต้องบอกให้ถามร้านและขอปรู๊ฟ ไม่เลือกโปรไฟล์สีเอง
tags: [behaviour, print-ready-files]
runs: 3
expected_outcome: ให้ bleed 3 มม. · 300 ppi สำหรับใบปลิว · ไวนิลไม่ต้อง 300 ppi · แนะนำถามร้านก่อน · บอกว่าสีนีออนจะหม่น · ขอปรู๊ฟ
execution:
  prompt: |
    ผมออกแบบใบปลิว A5 ร้านกาแฟใน Canva กับไวนิลหน้าร้าน 1 × 2 เมตร โลโก้เป็นเขียวนีออน
    ตัวหนังสือเล็กสีดำมีเบอร์โทรกับเวลาเปิด ฟอนต์ไทยที่ดาวน์โหลดมาจากเว็บ
    จะส่งโรงพิมพ์พรุ่งนี้ ต้องตั้งค่าอะไรบ้าง ไวนิลต้อง 300 dpi เหมือนใบปลิวใช่ไหม ต้องใช้โปรไฟล์สี CMYK ตัวไหน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: bleed-3mm
    type: regex
    pattern: '(bleed|ตัดตก)[^\n]{0,60}3\s*(มม|mm)|3\s*(มม|mm)[^\n]{0,60}(bleed|ตัดตก)'
    flags: i
    match: contains
    target: last_message
  - name: not-300-for-vinyl
    type: regex
    pattern: '(ไวนิล|vinyl|banner)[^\n]{0,120}(70|100|150)'
    flags: i
    match: contains
    target: last_message
  - name: shop-first-and-proof
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกให้ถามร้านก่อนว่าต้องการโหมดสี ระยะตัดตก ชนิดไฟล์ และโปรไฟล์สี ไม่ฟันธงโปรไฟล์ CMYK ตัวเดียวเหมือนร้านทุกร้านใช้ตัวนั้น (ถ้าเอ่ยชื่อโปรไฟล์ เช่น FOGRA39 ต้องบอกว่าร้านต้องยืนยัน)
      2. บอกว่าตัวหนังสือเล็กสีดำควรเป็นดำ 100K อย่างเดียว ไม่ใช้ดำผสม
      3. บอกว่าสีเขียวนีออนจะพิมพ์ได้หม่นลงเมื่อเป็น CMYK และแนะนำให้ขอปรู๊ฟก่อนพิมพ์
      4. บอกให้ตรวจสระวรรณยุกต์ไทยก่อนแปลงเป็นเส้น หรือฝังฟอนต์ และให้ดูใบอนุญาตฟอนต์ที่โหลดจากเว็บ
