# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: trading-technique-course-behaviour
description: ผู้เรียนส่งผลด่านเทรนด์มาถามว่าผ่านไหม ต้องเทียบกับเกณฑ์ด่านด้วยตัวเลขจากสคริปต์ และแยกด่านถัดไปกับด่านเงินจริง
tags: [capability, behaviour, trading-technique-course]
runs: 3
expected_outcome: expectancy +0.21R · ผ่านไปด่าน breakout · ยังไม่ผ่านด่านเงินจริงเพราะ 20 จาก 30 เทรดและ 6 จาก 8 สัปดาห์ · ไม่แนะนำหุ้น
execution:
  prompt: |
    ผ่านด่านจัดขนาดไม้มาแล้ว ตอนนี้อยู่ด่านเทรด pullback ตามเทรนด์
    ทดสอบย้อนหลัง 34 สัญญาณใน 3 หุ้น expectancy +0.18R
    เทรดในพอร์ตจำลอง 6 สัปดาห์ 20 ไม้ ชนะ 8 ไม้ เฉลี่ย +2.1R แพ้ 12 ไม้ เฉลี่ย -1.05R
    ขยับ stop ออกไป 1 ครั้ง drawdown สูงสุด 6.3R ที่ตั้งไว้รับได้ 10R
    ผ่านไปเรียน breakout ได้ไหม แล้วเริ่มใช้เงินจริงกับท่าเทรนด์เลยได้ไหม
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: expectancy
    type: regex
    pattern: '0\.21'
    match: contains
    target: last_message
  - name: gates-separate
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อครบทุกข้อ:
      1. บอกว่า expectancy ราว +0.21R ต่อไม้ และผ่านเกณฑ์ไปด่าน breakout (เกิน 0R · ฝ่าฝืนกฎ 5% · drawdown อยู่ในเพดาน)
      2. บอกว่ายังไม่ถึงด่านใช้เงินจริง เพราะจำนวนเทรดยังไม่ถึง 30 หรือเวลายังไม่ถึง 2 เดือน
      3. ชี้ว่าการขยับ stop ออกเป็นการฝ่าฝืนกฎที่ต้องจับตา
      4. ไม่แนะนำหุ้นตัวใดและไม่บอกว่าเทคนิคนี้จะทำกำไรแน่
