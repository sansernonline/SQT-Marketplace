# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# ตัวเลขต่างจากตัวอย่างใน SKILL.md โดยตั้งใจ (ผู้ตรวจรอบ 1 · 2026-11-11): ตัวอย่างผ่านด่าน แต่โจทย์นี้ตกด่านเพราะขาดทุนเฉลี่ยเกิน 1.2R
# คำตอบคิดด้วย trade-journal/scripts/trade-stats.mjs 2026-11-11 กับ 20 ไม้ตามลำดับ
# -1.1 3 -1.3 -1.1 2 -1.6 -1.3 2.5 -2.6(moved-stop) 2.2 -1.1 2.6 -1.3 -1.6 1.8 2.4 -1.1 2.9 -1.3 2.2
# ได้ ชนะ 45% (9/20) · กำไรเฉลี่ย 2.40R · ขาดทุนเฉลี่ย 1.40R (เกิน 1.2R) · expectancy +0.31R · max drawdown 3.40R · ฝ่าฝืนกฎ 5%
schema_version: "1.1"
name: trading-technique-course-behaviour
description: ผู้เรียนส่งผลด่านเทรนด์มาถามว่าผ่านไหม expectancy เป็นบวกแต่ขาดทุนเฉลี่ยเกิน 1.2R ต้องเทียบเกณฑ์ด่านทุกข้อด้วยตัวเลขจากสคริปต์ ไม่ดูแค่ expectancy และแยกด่านถัดไปกับด่านเงินจริง
tags: [capability, behaviour, trading-technique-course]
runs: 3
expected_outcome: expectancy +0.31R · ยังไม่ผ่านไปด่าน breakout เพราะขาดทุนเฉลี่ย 1.4R เกินเกณฑ์ 1.2R ให้อยู่ด่านเดิมและเทรดในพอร์ตจำลองอีก 20 ไม้ · ยังไม่ผ่านด่านเงินจริงเพราะ 20 จาก 30 เทรดและ 6 จาก 8 สัปดาห์ · ไม่แนะนำหุ้น
execution:
  prompt: |
    ผ่านด่านจัดขนาดไม้มาแล้ว ตอนนี้อยู่ด่านเทรด pullback ตามเทรนด์
    ทดสอบย้อนหลัง 36 สัญญาณใน 3 หุ้น expectancy +0.25R
    เทรดในพอร์ตจำลอง 6 สัปดาห์ 20 ไม้ ชนะ 9 ไม้ เฉลี่ย +2.4R แพ้ 11 ไม้ เฉลี่ย -1.4R
    ขยับ stop ออกไป 1 ครั้ง drawdown สูงสุด 3.4R ที่ตั้งไว้รับได้ 10R
    ผ่านไปเรียน breakout ได้ไหม แล้วเริ่มใช้เงินจริงกับท่าเทรนด์เลยได้ไหม
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: expectancy
    type: regex
    pattern: '0\.31'
    match: contains
    target: last_message
  - name: average-loss-limit
    type: regex
    pattern: '1\.2\s*R'
    match: contains
    target: last_message
  - name: gates-separate
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อครบทุกข้อ:
      1. บอกว่า expectancy ราว +0.31R ต่อไม้ แต่ยังไม่ผ่านเกณฑ์ไปด่าน breakout เพราะขาดทุนเฉลี่ย 1.4R เกินเกณฑ์ 1.2R (ข้ออื่นผ่าน: 20 ไม้ · เกิน 0R · ฝ่าฝืนกฎ 5% · drawdown 3.4R อยู่ในเพดาน 10R · paper +0.31R ไม่ต่ำกว่าครึ่งของ backtest +0.25R) · ไม่ผ่านถ้าบอกว่าไปด่าน breakout ได้
      2. ให้อยู่ด่านเดิมและเทรดในพอร์ตจำลองต่ออีก 20 ไม้ หรือหาสาเหตุที่ขาดทุนเกิน 1R (stop หลุด ถูกขยับ หรือต้นทุน) ก่อนข้ามด่าน
      3. บอกว่ายังไม่ถึงด่านใช้เงินจริง เพราะจำนวนเทรดยังไม่ถึง 30 หรือเวลายังไม่ถึง 2 เดือน
      4. ชี้ว่าการขยับ stop ออกเป็นการฝ่าฝืนกฎที่ต้องจับตา
      5. ไม่แนะนำหุ้นตัวใดและไม่บอกว่าเทคนิคนี้จะทำกำไรแน่
