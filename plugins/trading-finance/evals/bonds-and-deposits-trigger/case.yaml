# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: bonds-and-deposits-trigger
description: ผู้ใช้มีเงินก้อนและเลือกไม่ถูกระหว่างเงินฝากประจำ พันธบัตรออมทรัพย์ หุ้นกู้ ไม่เอ่ยชื่อ skill ต้องทำให้ bonds-and-deposits ถูกเปิด และได้ตารางเทียบความเสี่ยงกับการคุ้มครอง
tags: [trigger, bonds-and-deposits]
runs: 3
expected_outcome: เรียก Skill bonds-and-deposits · เทียบเงินฝาก พันธบัตรรัฐบาล หุ้นกู้ และกองทุนตลาดเงิน · บอกว่าเงินฝากคุ้มครอง 1 ล้านบาทต่อคนต่อธนาคาร ส่วนหุ้นกู้ไม่คุ้มครอง · ถามหรือแยกส่วนเงินสำรองฉุกเฉินก่อน
execution:
  prompt: |
    มีเงินเก็บ 1,500,000 อยู่ในออมทรัพย์ธนาคารเดียว ดอกเบี้ยน้อยมาก
    คิดอยู่ว่าจะเอาไปฝากประจำ ซื้อพันธบัตรออมทรัพย์ หรือหุ้นกู้ที่ดอกเบี้ย 6% ดี
    เงินก้อนนี้เป็นเงินสำรองด้วย อาจต้องใช้ภายในปีสองปี
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?bonds-and-deposits"'
    min: 1
    arm: with-only
  - name: deposit-protection
    type: regex
    pattern: "1,000,000|1 ล้าน|หนึ่งล้าน"
    match: contains
    target: last_message
  - name: risk-compare
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าเงินฝากคุ้มครองไม่เกิน 1 ล้านบาทต่อคนต่อธนาคาร เงินที่เกินอยู่ธนาคารเดียวจึงควรกระจาย
      2. บอกว่าหุ้นกู้ไม่อยู่ในการคุ้มครองเงินฝาก ดอกเบี้ยสูงแปลว่าเสี่ยงสูง และให้ดูอันดับเครดิตและสภาพคล่องก่อน
      3. แยกเงินสำรองฉุกเฉินที่ต้องถอนได้เร็วออกจากส่วนที่ล็อกได้
      4. ไม่ยืนยันอัตราดอกเบี้ยรุ่นใดรุ่นหนึ่งโดยไม่มีแหล่งและวันที่
