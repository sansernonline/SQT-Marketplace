# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: credit-bureau-trigger
description: ผู้ใช้กู้บ้านไม่ผ่านและกลัวติดแบล็กลิสต์ ไม่เอ่ยชื่อ skill ต้องทำให้ credit-bureau ถูกเปิด และได้วิธีตรวจรายงานเครดิตของตัวเองกับวิธีโต้แย้งข้อมูลผิด
tags: [trigger, credit-bureau]
runs: 3
expected_outcome: เรียก Skill credit-bureau · บอกว่าเครดิตบูโรไม่มีแบล็กลิสต์ แค่รายงานประวัติ · บอกช่องทางขอรายงานเครดิตของตัวเอง · บอกวิธีโต้แย้งข้อมูลที่ผิด
execution:
  prompt: |
    ยื่นกู้บ้านไปแล้วธนาคารไม่อนุมัติ เจ้าหน้าที่พูดเรื่องเครดิต
    เมื่อ 2 ปีก่อนเคยจ่ายบัตรเครดิตช้าอยู่ 3 เดือนแต่ปิดไปแล้ว ตอนนี้ติดแบล็กลิสต์ไปตลอดชีวิตเลยไหม
    แล้วจะดูได้ยังไงว่าข้อมูลของเราเขียนว่าอะไรบ้าง
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?credit-bureau"'
    min: 1
    arm: with-only
  - name: mentions-ncb
    type: regex
    pattern: "เครดิตบูโร|NCB|ข้อมูลเครดิตแห่งชาติ"
    match: contains
    target: last_message
  - name: myth-and-steps
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าเครดิตบูโรไม่ได้ขึ้นแบล็กลิสต์ แต่เก็บและรายงานประวัติ ส่วนการอนุมัติเป็นการตัดสินใจของธนาคาร
      2. บอกว่าประวัติไม่ได้อยู่ตลอดชีวิต และอธิบายระยะเวลาที่ข้อมูลถูกเก็บหรือแสดงตามแหล่งที่อ้าง
      3. บอกช่องทางขอรายงานเครดิตของตัวเองอย่างน้อย 1 ช่องทาง และวิธีโต้แย้งถ้าข้อมูลผิด
