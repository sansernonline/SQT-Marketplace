# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เพิ่ม 2026-10-28 จากรายงานตรวจ plugin (P16 P18) · โจทย์คิดขึ้นเอง ไม่ได้มาจากงานที่พลาดจริง · ยังไม่ได้รัน
schema_version: "1.1"
name: debt-payoff-behaviour
description: หนี้ 3 ก้อนรวมบัตรที่ขั้นต่ำเป็น % ของยอด ต้องรัน payoff.mjs เทียบ avalanche กับ snowball เป็นบาท และไม่แนะนำกู้ใหม่มาโปะ
tags: [capability, behaviour, debt-payoff]
runs: 3
expected_outcome: รัน payoff.mjs · เดือนที่หมดและส่วนต่างดอกเบี้ยเป็นบาท · ขั้นต่ำบัตรเป็น % ของยอด · ไม่เสนอกู้ก้อนใหม่
execution:
  prompt: |
    หนี้มี 3 ก้อน บัตรเครดิต 40,000 ดอก 16% จ่ายขั้นต่ำตามที่ธนาคารเรียก
    บัตรกดเงินสด 70,000 ดอก 25% ขั้นต่ำ 3,000 · จำนำทะเบียนรถ 50,000 ดอก 24% ขั้นต่ำ 2,000
    จ่ายหนี้ได้เดือนละ 10,000 อยากรู้ว่ากี่เดือนหมด ควรปิดก้อนไหนก่อน หรือไปกู้ก้อนใหม่มาปิดให้หมดเลยดี
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: ran-payoff-script
    type: tool_used
    tool: Bash
    input_match: 'payoff\.mjs'
    min: 1
    arm: with-only
  - name: numbers-no-new-loan
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. เทียบอย่างน้อย 2 ลำดับ (ดอกสูงก่อน กับยอดเล็กก่อน) เป็นจำนวนเดือนและดอกเบี้ยรวมเป็นบาท
      2. ขั้นต่ำบัตรเครดิตคิดเป็น % ของยอดคงเหลือ (8%) ไม่ใช่บาทคงที่
      3. ไม่แนะนำให้กู้ก้อนใหม่มาจ่าย หรือบอกเงื่อนไขชัดว่าต้องดอกต่ำกว่าและไม่ก่อหนี้เพิ่ม พร้อมชี้ช่องทางปรับโครงสร้างหนี้
      4. บอกว่าผู้ใช้ตัดสิน
