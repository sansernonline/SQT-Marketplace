# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่กัน: เอาตัวเลขของปีภาษี 2568 มาใช้กับปี 2569 (ประกันสังคม 9,000 · ThaiESGX แยกอีก 300,000 · Easy e-Receipt 50,000)
# ที่มาของกฎ: tax-deduction-planner หัวข้อ Rules ข้อสุดท้าย และ references/deductions-2569.md หัวข้อ 7 · ยังไม่ได้รันรอบแดง
schema_version: "1.1"
name: tax-deduction-planner-behaviour
description: ผู้ใช้ถามด้วยข้อมูลของปี 2568 (ประกันสังคม 9,000 · ThaiESGX · ช้อปดีมีคืน) ต้องแก้เป็นกฎของปีภาษี 2569 และไม่วางแผนบนสิทธิ์ที่ไม่มีแล้ว
tags: [capability, behaviour, tax-deduction-planner]
runs: 3
expected_outcome: บอกว่าปีภาษี 2569 ประกันสังคมลดหย่อนได้ 10,500 · ThaiESGX แยก 300,000 เป็นของปี 2568 เท่านั้น · Easy e-Receipt ยังไม่มีรอบ 2569 ให้วางแผนโดยไม่นับ และติดป้ายรอยืนยัน
execution:
  prompt: |
    ขอแผนลดหย่อนภาษีปีนี้ (ยื่นต้นปีหน้า) เงินเดือน 80,000 ไม่มีโบนัส
    เพื่อนบอกว่าประกันสังคมหักได้ 9,000 ช้อปดีมีคืนใช้ได้อีก 50,000
    แล้วก็ซื้อ ThaiESGX ได้แยกอีก 300,000 นอกจาก ThaiESG ปกติ
    ช่วยคิดให้หน่อยว่าซื้อเต็มสิทธิ์ทั้งหมดแล้วภาษีเหลือเท่าไร
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: uses-2569-social-security
    type: regex
    pattern: "10,500|10500"
    match: contains
    target: last_message
  - name: no-2568-plan
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ใช้ค่าลดหย่อนประกันสังคม 10,500 ในการคำนวณ และบอกว่า 9,000 เป็นของปี 2568
      2. ไม่นับ ThaiESGX แยกอีก 300,000 สำหรับปี 2569 และบอกว่าสิทธิ์นั้นเป็นของปี 2568
      3. ไม่นับ Easy e-Receipt หรือช้อปดีมีคืน 50,000 ในตัวเลขภาษีที่คำนวณ หรือบอกชัดว่ายังไม่มีประกาศสำหรับปี 2569 และต้องรอยืนยัน
      4. ตัวเลขภาษีสุดท้ายคำนวณจากกฎปี 2569 เท่านั้น
  - name: ran-tax-script
    type: tool_used
    tool: Bash
    input_match: 'tax\.mjs'
    min: 1
    arm: with-only
