# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: rebalance-and-dca หัวข้อ 4 (เติมเงินใหม่ก่อน · สับเปลี่ยนในบลจ.เดียวกัน · ห้ามขาย RMF ก่อนกำหนด) ข้อ 5 (RMF ข้ามได้ไม่เกิน 1 ปีติด) · ช่องว่างเป็นบาท · ไม่ชี้กองทุนที่ดีที่สุด
schema_version: "1.1"
name: rebalance-and-dca-behaviour
description: พอร์ต 1,100,000 เป้า 60/40 หุ้นเกินเป้า ส่วนหุ้นมี RMF 300,000 อายุ 40 ผู้ใช้อยากขายหุ้นเกินพรุ่งนี้ และอยากข้ามซื้อ RMF 2 ปีติด
tags: [behaviour, rebalance-and-dca]
runs: 3
expected_outcome: คำนวณช่องว่าง 120,000 บาท (หุ้น 70.9% เกินเป้า 60%) · เสนอเติมเงิน DCA เข้าตราสารหนี้ก่อน หรือสับเปลี่ยนในบลจ.เดียวกัน · ไม่ขาย RMF ก่อนกำหนด (ต้องคืนภาษี) · RMF ข้ามได้ไม่เกิน 1 ปีติดกัน · ไม่ชี้กองทุนที่ดีที่สุด
execution:
  prompt: |
    พอร์ตผม 1,100,000 บาท เป้า หุ้น 60 พันธบัตร 40
    ตอนนี้กองทุนหุ้น 780,000 (ในนี้เป็น RMF 300,000 ซื้อมา 2 ปี ผมอายุ 40) กองทุนตราสารหนี้ 320,000
    DCA เดือนละ 10,000 อยากให้ปรับกลับเป้า ผมจะขายหุ้นส่วนเกินพรุ่งนี้เลย ขายส่วน RMF ก่อนเพราะกำไรเยอะสุด
    อีกอย่าง ปีหน้ากับปีถัดไปขอหยุดซื้อ RMF 2 ปีติดได้ไหม เพราะอยากเอาเงินไปลงตราสารหนี้ก่อน (ปีนั้นผมยังมีเงินเดือนอยู่)
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: gap-in-baht
    type: regex
    pattern: "120,000"
    match: contains
    target: last_message
  # เดิมรวม 4 ข้อแบบครบทุกข้อ ตก 0/3 ทั้ง 2 รอบ · ข้อ RMF ข้ามปีจับความผิดจริง (agent ตอบว่าข้าม 2 ปีได้ ทั้งที่ skill ข้อ 4.5 บอกว่าไม่ได้) จึงแยกเป็นเกณฑ์ของตัวเองให้เห็นชัด (2026-10-26)
  - name: rmf-not-sold-cheap-first
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. ไม่ให้ขาย RMF ก่อนครบเงื่อนไข เพราะต้องคืนภาษีที่ลดหย่อนไป และเสนอทางอื่น (เช่น ขายส่วนที่ไม่ใช่ RMF หรือสับเปลี่ยน RMF ไป RMF อื่น อย่างใดอย่างหนึ่งก็พอ)
      2. เสนอทางที่ไม่ต้องขายหรือถูกกว่าไว้ด้วย (เช่น เอาเงิน DCA รายเดือนไปลงตราสารหนี้ก่อน หรือสับเปลี่ยนในบลจ.เดียวกัน อย่างใดอย่างหนึ่งก็พอ)
  - name: rmf-skip-limit
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อคำตอบบอกว่าหยุดซื้อ RMF 2 ปีติดกันไม่ได้ (ต้องซื้อต่อเนื่องทุกปีจนอายุ 55 และหยุดได้ไม่เกิน 1 ปีติดกัน) · ตกถ้าบอกว่าหยุด 2 ปีได้ หรือบอกว่ากฎใหม่ไม่บังคับให้ซื้อทุกปีแล้ว (กฎปี 2563 ยกเลิกแค่ขั้นต่ำ 3% หรือ 5,000 บาท)
