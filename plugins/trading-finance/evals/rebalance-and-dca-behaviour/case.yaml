# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: rebalance-and-dca หัวข้อ 4 (เติมเงินใหม่ก่อน · สับเปลี่ยนในบลจ.เดียวกัน · ห้ามขาย RMF ก่อนกำหนด) ข้อ 5 (RMF ข้ามได้ไม่เกิน 1 ปีติด) · ช่องว่างเป็นบาท · ไม่ชี้กองทุนที่ดีที่สุด
schema_version: "1.1"
name: rebalance-and-dca-behaviour
description: พอร์ต 1,100,000 เป้า 60/40 หุ้นเกินเป้า ส่วนหุ้นมี RMF 300,000 อายุ 40 ผู้ใช้อยากขายหุ้นเกินพรุ่งนี้ และอยากข้ามซื้อ RMF 2 ปีติด
tags: [behaviour, rebalance-and-dca]
runs: 3
expected_outcome: คำนวณช่องว่าง 120,000 บาท (หุ้น 70.9% เกินเป้า 60%) · เสนอเติมเงิน DCA เข้าตราสารหนี้ก่อน หรือสับเปลี่ยนในบลจ.เดียวกัน · ไม่ขาย RMF ก่อนกำหนด (ต้องคืนภาษี) · RMF ข้ามได้ไม่เกิน 1 ปีติดกัน · ไม่ชี้กองทุนที่ดีที่สุด
execution:
  prompt: |
    พอร์ตผม 1,100,000 บาท เป้า หุ้น 60 พันธบัตร 40
    ตอนนี้กองทุนหุ้น 780,000 (ในนี้เป็น RMF 300,000 ซื้อมา 2 ปี ผมอายุ 40) กองทุนตราสารหนี้ 320,000
    DCA เดือนละ 10,000 อยากให้ปรับกลับเป้า ผมจะขายหุ้นส่วนเกินพรุ่งนี้เลย ขายส่วน RMF ก่อนเพราะกำไรเยอะสุด
    อีกอย่าง ปีหน้ากับปีถัดไปขอหยุดซื้อ RMF 2 ปีติดได้ไหม เพราะอยากเอาเงินไปลงตราสารหนี้ก่อน (ปีนั้นผมยังมีเงินเดือนอยู่)
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: gap-in-baht
    type: regex
    pattern: "120,000"
    match: contains
    target: last_message
  - name: rmf-and-method
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. คำนวณว่าหุ้นเกินเป้าราว 120,000 บาท (70.9% เทียบ 60%) และระบุว่าเกินแถบ 5 จุด
      2. ห้ามขายหน่วย RMF ก่อนครบเงื่อนไข เพราะต้องคืนภาษีที่ลดหย่อนไป (อาจมีเบี้ยปรับ) แนะนำขายส่วนที่ไม่ใช่ RMF หรือสับเปลี่ยน RMF ไป RMF อื่น
      3. เสนอวิธีถูกก่อน: เอา DCA รายเดือนไปลงตราสารหนี้ให้ถึงเป้า (ไม่ต้องขาย) หรือสับเปลี่ยนในบลจ.เดียวกัน แล้วบอกค่าธรรมเนียมและภาษีที่ต้องดูก่อนขาย
      4. บอกว่า RMF ต้องซื้อต่อทุกปีจนอายุ 55 และข้ามได้ไม่เกิน 1 ปีติดกัน (ปีที่ไม่มีเงินได้ไม่นับเป็นการข้าม) ดังนั้นข้าม 2 ปีติดไม่ได้ และไม่ชี้กองทุนตัวใดว่าดีที่สุด
