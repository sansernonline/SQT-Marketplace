# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: position-sizing "no sizing without a stop" · ปัดราคาเข้า tick ที่ถูก · ปัดจำนวนลงเป็น 100 หุ้น · ตรวจ 10% ของพอร์ต
# ราคา 12.33 และ 11.87 ไม่ลงช่วงราคาทั้งตารางเดิม (0.10) และตารางใหม่ตั้งแต่ 16 พ.ย. 2569 (0.05) จึงใช้ได้ทั้งก่อนและหลังวันเปลี่ยน
schema_version: "1.1"
name: position-sizing-behaviour
description: ขอขนาดไม้ 2 ตัว ตัวแรกราคาไม่ลงช่วงราคา ตัวที่สองไม่มี stop ต้องปัดราคาเข้า tick ปัดจำนวนลงเป็น 100 หุ้น และไม่คำนวณตัวที่ไม่มี stop
tags: [capability, behaviour, position-sizing]
runs: 3
expected_outcome: หุ้น A ปัดราคาเข้าช่วงราคาที่ถูกของวันนั้น · จำนวนหุ้นลงท้าย 00 · ตรวจเพดาน 10% ของพอร์ต · หุ้น B ไม่ให้จำนวนหุ้นจนกว่าจะมี stop และบอกวิธีหาจุด stop
execution:
  prompt: |
    พอร์ต 200,000 บาท เสี่ยงไม้ละ 1%
    หุ้น A (SET) จะซื้อที่ 12.33 ตั้ง stop ที่ 11.87 ได้กี่หุ้น
    หุ้น B (SET) ราคา 36.50 ผมมั่นใจมาก ไม่อยากตั้ง stop บอกมาเลยว่าควรซื้อกี่หุ้น
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: board-lot
    type: regex
    pattern: "\\d00\\s*(หุ้น|shares)"
    match: contains
    target: last_message
  - name: tick-lot-and-stop
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. หุ้น A: บอกว่า 12.33 และ 11.87 ไม่ใช่ราคาที่ซื้อขายได้ แล้วปัดเข้าช่วงราคาที่ถูก (0.10 ก่อน 16 พ.ย. 2569 หรือ 0.05 ตั้งแต่วันนั้น) โดย stop ปัดออกห่างจากจุดเข้า ไม่ปัดเข้าใกล้
      2. หุ้น A: จำนวนหุ้นปัดลงเป็นทวีคูณของ 100 และตรวจว่ามูลค่าไม่เกินราว 10% ของพอร์ต (ถ้าเกินให้ลดจำนวน)
      3. หุ้น B: ไม่ให้จำนวนหุ้น บอกว่าคำนวณขนาดไม้ไม่ได้ถ้าไม่มี stop และขอจุด stop หรืออธิบายวิธีหาจุดที่แนวคิดการเทรดผิด
      4. ไม่เพิ่ม % ความเสี่ยงเกิน 1% ตามความมั่นใจของผู้ใช้
  - name: ran-size-script
    type: tool_used
    tool: Bash
    input_match: 'size\.mjs'
    min: 1
    arm: with-only
