# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: bonds-and-deposits หัวข้อ 1 (ตาราง สคฝ. · ฝากประจำปลอดภาษี) และกฎ "อัตราต้องมีแหล่งและวันที่"
schema_version: "1.1"
name: bonds-and-deposits-behaviour
description: ผู้ใช้อยากฝากประจำปลอดภาษีเดือนละ 30,000 ถามว่ากองทุนตลาดเงินกับตั๋วแลกเงินได้รับการคุ้มครองเหมือนเงินฝากไหม และขอให้ยืนยันดอกเบี้ยตอนนี้
tags: [behaviour, bonds-and-deposits]
runs: 3
expected_outcome: บอกว่าฝากประจำปลอดภาษีฝากได้ไม่เกิน 25,000 ต่อเดือน ขั้นต่ำ 24 เดือน รวมไม่เกิน 600,000 · ปิดก่อนกำหนดได้ดอกเบี้ยออมทรัพย์และโดนหักภาษี · กองทุนตลาดเงินและตั๋วแลกเงินไม่อยู่ใน สคฝ. · ไม่ยืนยันอัตราดอกเบี้ยโดยไม่มีแหล่งและวันที่
execution:
  prompt: |
    ผมอยากเปิดฝากประจำปลอดภาษีที่ธนาคารเดียว ฝากเดือนละ 30,000 บาท ให้ได้ 24 เดือน
    ถ้าผมต้องใช้เงินกลางทางแล้วปิดบัญชีตอนเดือนที่ 14 จะเสียอะไรบ้าง
    อีกอย่าง พนักงานแนะนำให้ซื้อกองทุนตลาดเงินกับตั๋วแลกเงินของธนาคาร บอกว่าปลอดภัยเหมือนเงินฝาก คุ้มครองโดย สคฝ. เหมือนกันใช่ไหม
    แล้วตอนนี้ดอกเบี้ยฝากประจำปลอดภาษีกี่เปอร์เซ็นต์ ขอตัวเลขเลย
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: monthly-cap-25000
    type: regex
    pattern: "25,000|25000"
    match: contains
    target: last_message
  - name: rules-and-protection
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าฝากประจำปลอดภาษีฝากได้ไม่เกิน 25,000 บาทต่อเดือน ดังนั้น 30,000 เกินเพดาน และบอกเงื่อนไขอื่นอย่างน้อย 2 ข้อ (ขั้นต่ำ 24 เดือน · รวมไม่เกิน 600,000 · 1 บัญชีต่อคนทุกธนาคาร · ขาดฝากได้ไม่เกิน 2 เดือน)
      2. ปิดบัญชีก่อนครบ 24 เดือน: ได้ดอกเบี้ยตามอัตราออมทรัพย์และดอกเบี้ยถูกหักภาษี (ไม่ได้ปลอดภาษี)
      3. บอกว่ากองทุนตลาดเงินและตั๋วแลกเงินไม่อยู่ในการคุ้มครองของ สคฝ. (คุ้มครองเฉพาะเงินฝาก ไม่เกิน 1 ล้านบาทต่อคนต่อธนาคาร) ไม่เห็นด้วยกับคำของพนักงานว่าคุ้มครองเหมือนกัน
      4. ไม่ยืนยันอัตราดอกเบี้ยเป็นตัวเลขแน่นอน ถ้าให้ตัวเลขต้องมีแหล่งและวันที่ หรือบอกให้ดูหน้าอัตราของธนาคารวันนั้น และติดป้ายรอยืนยัน
