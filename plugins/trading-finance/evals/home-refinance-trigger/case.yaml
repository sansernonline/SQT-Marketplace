# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: home-refinance-trigger
description: กู้บ้านครบ 3 ปีแล้วดอกเบี้ยลอยตัวขึ้น ไม่เอ่ยชื่อ skill ต้องทำให้ home-refinance ถูกเปิด และได้ตารางเทียบรีไฟแนนซ์กับขอลดดอกเบี้ยธนาคารเดิมที่นับค่าธรรมเนียม
tags: [trigger, home-refinance]
runs: 3
expected_outcome: เรียก Skill home-refinance · เทียบรีไฟแนนซ์กับรีเทนชั่นเป็นตัวเลขบาท · นับค่าธรรมเนียมจดจำนอง ประเมิน อากร และค่าปรับไถ่ถอนก่อนกำหนด · บอกจุดคุ้มทุนเป็นเดือน
execution:
  prompt: |
    กู้บ้านมาครบ 3 ปีพอดี ยอดคงเหลือ 2,400,000 ตอนนี้ดอกเบี้ยลอยตัวขึ้นไปราว 6.5%
    มีธนาคารอื่นเสนอ 3 ปีแรกเฉลี่ย 3.2% ส่วนธนาคารเดิมบอกว่าลดให้เหลือ 4% ได้ถ้าจ่ายค่าธรรมเนียม
    ควรย้ายหรืออยู่ที่เดิมดี
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?home-refinance"'
    min: 1
    arm: with-only
  - name: names-fees
    type: regex
    pattern: "จดจำนอง|ค่าประเมิน|อากร"
    match: contains
    target: last_message
  - name: compare-with-fees
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. เทียบ 2 ทาง (ย้ายธนาคาร กับขอลดธนาคารเดิม) เป็นดอกเบี้ยที่จ่ายเป็นบาทในช่วงเวลาเดียวกัน
      2. นับค่าใช้จ่ายของการย้าย (จดจำนอง ประเมิน อากรแสตมป์ ประกัน) และค่าธรรมเนียมของธนาคารเดิม
      3. บอกว่าอัตราหลังช่วงโปรโมชันอิงอัตราลอยตัว (MRR) และต้องดูอัตราทั้งสัญญา ไม่ใช่แค่ 3 ปีแรก
      4. บอกว่าตัวเลขค่าธรรมเนียมต้องยืนยันกับธนาคาร และผู้ใช้เป็นคนตัดสินใจ
