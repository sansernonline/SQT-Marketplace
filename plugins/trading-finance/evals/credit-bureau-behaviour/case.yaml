# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: credit-bureau "One rule" (อ่านรายงานจริงก่อนเดา) · หัวข้อ 1 (ไม่มี blacklist · เก็บ 3 ปี) · หัวข้อ 2 (ฟรีภายใน 30 วันหลังถูกปฏิเสธ) · หัวข้อ 5 (ลบประวัติเสียเงิน = หลอกลวง)
schema_version: "1.1"
name: credit-bureau-behaviour
description: ผู้ใช้ถูกปฏิเสธสินเชื่อบ้าน ถามว่าติดแบล็กลิสต์ไหม ตรวจเครดิตบูโรเสียเท่าไร และมีคนใน LINE เสนอลบประวัติ 5,000 บาท
tags: [capability, behaviour, credit-bureau]
runs: 3
expected_outcome: บอกว่าเครดิตบูโรไม่มีแบล็กลิสต์ ผู้ให้กู้เป็นคนตัดสิน · ขอรายงานฟรีได้ภายใน 30 วันหลังได้จดหมายปฏิเสธ · ประวัติเก็บ 3 ปี (36 เดือน) · คนเสนอลบประวัติเป็นมิจฉาชีพ แก้ได้เฉพาะรายการผิดผ่านผู้ให้กู้
execution:
  prompt: |
    ธนาคารเพิ่งส่งจดหมายปฏิเสธสินเชื่อบ้านผมเมื่อ 5 วันก่อน ไม่บอกเหตุผล ผมติดแบล็กลิสต์เครดิตบูโรแล้วใช่ไหม
    เมื่อ 2 ปีก่อนผมจ่ายบัตรเครดิตช้าไป 3 เดือน ตอนนี้ปิดบัตรแล้ว ประวัตินี้จะติดตัวไปตลอดชีวิตหรือเปล่า
    ผมอยากเช็กรายงานของตัวเอง ต้องจ่ายเท่าไร
    แล้วมีคนทัก LINE มาว่ารับลบประวัติเครดิตบูโรให้ 5,000 บาท ผมควรจ้างไหม
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: free-within-30-days
    type: regex
    pattern: "30 วัน|30 days"
    match: contains
    target: last_message
  - name: facts-and-scam
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าเครดิตบูโร (NCB) ไม่มีแบล็กลิสต์ ไม่ได้อนุมัติหรือปฏิเสธสินเชื่อ ผู้ให้กู้เป็นคนตัดสินใจ และไม่ยืนยันว่าผู้ใช้ "ติดแบล็กลิสต์"
      2. แนะนำให้อ่านรายงานของตัวเองก่อนเดาสาเหตุ และบอกว่าขอรายงานฉบับเต็มฟรีได้ภายใน 30 วันหลังได้จดหมายปฏิเสธ (หรือบอกช่องทางและค่าธรรมเนียมที่ตรวจได้ เช่น เคาน์เตอร์ NCB 100 บาท)
      3. บอกว่าประวัติไม่ติดตัวตลอดชีวิต ข้อมูลเก็บ 3 ปี รายงานแสดงประวัติ 36 เดือน
      4. เตือนว่าคนที่รับลบประวัติเครดิตเพื่อเก็บเงินเป็นมิจฉาชีพ ประวัติจริงลบไม่ได้ แก้ได้เฉพาะรายการที่ผิดจริงโดยยื่นผ่านผู้ให้กู้หรือ NCB (ตอบภายใน 30 วัน)
