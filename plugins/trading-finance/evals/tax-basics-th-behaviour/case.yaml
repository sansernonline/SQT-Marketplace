# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เพิ่ม 2026-10-28 จากรายงานตรวจ plugin (P16 P18) · โจทย์คิดขึ้นเอง ไม่ได้มาจากงานที่พลาดจริง · ยังไม่ได้รัน
schema_version: "1.1"
name: tax-basics-th-behaviour
description: อัตราส่วนเพิ่ม 30% ถามว่าควรรวมปันผลเพื่อเอาเครดิตไหม ต้องแนะว่าไม่รวมดีกว่า (tax-basics-th: คุ้มเมื่ออัตราส่วนเพิ่มไม่เกิน 25%)
tags: [capability, behaviour, tax-basics-th]
runs: 3
expected_outcome: บอกว่าที่อัตราส่วนเพิ่ม 30% ไม่ควรรวมปันผล ให้หัก 10% เป็นภาษีสุดท้าย · เทียบสองทางเป็นบาท
execution:
  prompt: |
    เงินได้สุทธิจากเงินเดือนหลังหักลดหย่อนแล้วประมาณ 1,200,000 ปีนี้ได้ปันผลหุ้นไทย 100,000 โดนหัก 10% แล้ว
    เพื่อนบอกให้เอาปันผลมารวมยื่นจะได้เครดิตภาษีคืน ควรทำไหม
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: no-include-at-30
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าอัตราส่วนเพิ่มของผู้ใช้คือ 30% และที่อัตรานี้ไม่ควรรวมปันผล ให้ใช้ภาษีหัก ณ ที่จ่าย 10% เป็นภาษีสุดท้าย
      2. เทียบทั้งสองทางเป็นตัวเลขบาท ไม่ใช่แค่บอกกฎ
      3. บอกว่าถ้าเลือกรวมต้องรวมปันผลที่เลือกได้ทั้งหมดของปีนั้น
      4. บอกว่าเป็นข้อมูลทั่วไป ไม่ใช่คำแนะนำภาษี
