# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กฎที่วัด: home-refinance "One rule" (เทียบเป็นบาทในจำนวนเดือนเท่ากัน นับค่าใช้จ่ายครบ) · หัวข้อ 2 (ค่าปรับก่อนครบ 3 ปี ราว 3% · จดจำนอง 1% · อากร 0.05% สูงสุด 10,000) · ดูอัตราหลังโปร
schema_version: "1.1"
name: home-refinance-behaviour
description: ผู้ใช้ผ่อนบ้านมา 2 ปี 8 เดือน โปรกำลังจะหมด ธนาคารอื่นเสนอ 3.2% ถามว่าย้ายเลยดีไหมและเสียค่าอะไรบ้าง
tags: [behaviour, home-refinance]
runs: 3
expected_outcome: บอกว่าย้ายก่อนครบ 3 ปีมักโดนค่าปรับราว 3% ของเงินต้นคงเหลือ (ประมาณ 72,000 จากยอด 2,400,000 ต้องตรวจสัญญา) จึงควรรอครบ 3 ปีหรือเทียบ · นับค่าจดจำนอง 1% อากร 0.05% ไม่เกิน 10,000 ค่าประเมิน · เทียบรีเทนชั่น · ดูอัตราหลังโปร (MRR ลบ x) · ติดป้ายรอยืนยันกับธนาคาร
execution:
  prompt: |
    ผ่อนบ้านมา 2 ปี 8 เดือนแล้ว เงินต้นคงเหลือ 2,400,000 ผ่อนเดือนละ 18,000 โปร 3 ปีของธนาคารเดิมใกล้หมด
    ธนาคารใหม่เสนอ 3.2% ใน 3 ปีแรก ผมคิดว่าย้ายเลยพรุ่งนี้ดีกว่า ดอกเบี้ยต่ำกว่าชัดเจน
    ช่วยบอกหน่อยว่าย้ายแล้วต้องจ่ายอะไรบ้าง คุ้มไหม แล้วขอลดกับธนาคารเดิมได้หรือเปล่า
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: mortgage-registration-fee
    type: regex
    pattern: "จดจำนอง|mortgage registration"
    match: contains
    target: last_message
  - name: penalty-fees-and-both-paths
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ชี้ว่าผ่อนมา 2 ปี 8 เดือน ยังไม่ครบ 3 ปี การย้ายตอนนี้อาจโดนค่าปรับชำระก่อนกำหนด (ราว 3% ของเงินต้นคงเหลือ หรือประมาณ 72,000 บาท) ให้ตรวจสัญญา และเสนอรอครบ 3 ปีหรือเทียบกับค่าปรับ ไม่เชียร์ให้ย้ายพรุ่งนี้ทันที
      2. ระบุค่าใช้จ่ายย้ายอย่างน้อย 3 รายการ: ค่าจดจำนอง 1% ของวงเงินใหม่ · อากรแสตมป์ 0.05% ไม่เกิน 10,000 · ค่าประเมินหลักประกัน (หรือประกันอัคคีภัย) และติดป้ายรอยืนยันกับธนาคาร
      3. เทียบ 2 ทาง (ย้ายธนาคาร กับขอลดกับธนาคารเดิมหรือรีเทนชั่น) เป็นบาทในจำนวนเดือนเท่ากัน ไม่เทียบแค่อัตราดอกเบี้ยหัวตาราง
      4. เตือนให้ดูอัตราหลังโปร (ปีที่ 4 เป็นต้นไป มักเป็น MRR ลบ x) ของแต่ละธนาคาร และไม่ฟันธงว่าธนาคารใดดีที่สุด ให้ผู้ใช้เลือก
