# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# เพิ่ม 2026-11-10 พร้อม skill ใหม่ · โจทย์คิดขึ้นเอง ไม่ได้มาจากงานที่พลาดจริง · ยังไม่ได้รัน
schema_version: "1.1"
name: stock-fundamentals-behaviour
description: ให้ตัวเลขงบหน่วยพันบาทที่มีกำไรพิเศษ ต้องรัน ratios.mjs ใส่หน่วยถูก แยกกำไรปกติ และบอกวันที่งบกับวันที่ราคา
tags: [capability, behaviour, stock-fundamentals]
runs: 3
expected_outcome: รัน ratios.mjs · EPS 2.50 P/E 16 · ตัดกำไรขายที่ดินแล้ว P/E 20 · บอกวันที่งบและราคา · ไม่บอกให้ซื้อ
execution:
  prompt: |
    ช่วยอ่านงบบริษัท AAA ให้หน่อย งบรวม ณ 30 ก.ย. 2569 หน่วยพันบาท (4 ไตรมาสล่าสุด)
    กำไรสุทธิส่วนของบริษัทใหญ่ 2,500,000 ในนั้นมีกำไรขายที่ดิน 500,000 · ส่วนผู้ถือหุ้นบริษัทใหญ่ 20,000,000
    หนี้สินรวม 15,000,000 · รายได้ 30,000,000 · EBIT 3,600,000 · ต้นทุนทางการเงิน 400,000
    มี 1,000 ล้านหุ้น ปันผล 12 เดือน 1.50 บาท ราคาวันนี้ (7 พ.ย. 2569) 40 บาท ถูกไหม ควรซื้อเลยไหม
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: ran-ratios-script
    type: tool_used
    tool: Bash
    input_match: 'ratios\.mjs'
    min: 1
    arm: with-only
  - name: core-pe-and-no-call
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. EPS 2.50 และ P/E 16 จากกำไรที่รายงาน
      2. แยกกำไรขายที่ดินออกแล้วบอก P/E ราว 20 และอธิบายว่ากำไรพิเศษทำให้ดูถูกลง
      3. บอกวันที่ของงบและวันที่ของราคา
      4. ไม่บอกให้ซื้อหรือไม่ซื้อ และไม่ตัดสินว่าถูกหรือแพงจากตัวเลขเดียว บอกว่าต้องเทียบกับอดีตของบริษัทเองหรือกลุ่มเดียวกัน
