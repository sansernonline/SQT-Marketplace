# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# resources/landing.html คือสำเนาของ _to_delete/design-trial/work/index.src.html (หน้า landing ที่ลองจริง 2026-11-06) · เคสนี้ไม่ให้ Bash (Windows ไม่มี sandbox) จึงวัดด่านตาจากโค้ดต้นทาง ไม่ได้วัดภาพเรนเดอร์
schema_version: "1.1"
name: no-ai-look-behaviour
description: ให้ตรวจหน้า landing ที่เสร็จแล้ว ต้องตอบด่านตาข้อหน้าเว็บ (ของจริงในส่วนเปิด · ปิดโลโก้ · ลำดับสูตร · ช่องเท่ากัน · mono) และปิดท้ายด้วยบรรทัดบันทึกผลรูปแบบตายตัว
tags: [behaviour, no-ai-look]
runs: 10
expected_outcome: ชี้ว่าส่วนเปิดไม่มีภาพหรือผลงานจริงของสินค้า · หน้าใช้กับ marketplace อื่นได้ถ้าปิดชื่อ · ลำดับส่วนตรงสูตร · แถว 6 ขั้นเท่ากันไม่มีเหตุ · mono อยู่บนชื่อ plugin และเลขขั้น · ท้ายคำตอบมีบรรทัด no-ai-look
execution:
  prompt: |
    ไฟล์ resources/landing.html คือหน้าแรกของเว็บแจก plugin ชุดหนึ่งสำหรับ Claude Code ที่ทีมทำเสร็จแล้ว พรุ่งนี้จะส่งให้เจ้าของดู
    ช่วยตรวจให้หน่อยว่าหน้านี้ดูเหมือนคนออกแบบจริงหรือยัง มีอะไรที่ต้องแก้ก่อนส่งไหม
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  add_dirs: [resources]
  scaffold_script: fixture.sh   # ต้องรันด้วย --scaffold (plugin-eval.mjs ใส่ให้)
graders:
  - name: log-line-format
    type: regex
    pattern: 'no-ai-look:\s*สคริปต์.*ด่านตา\s*\d{1,2}/9\s*\(หน้าเว็บ\s*\d{1,2}/14\)'
    match: contains
    target: last_message
  - name: hero-and-logo-test
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. บอกว่าส่วนเปิด (จอแรกก่อนเลื่อน) ยังไม่มีของจริงของสินค้า เช่น ภาพหน้าจอตอนใช้งาน ผลงานจริง เสียงลูกค้าจริง มีแค่ข้อความกับกล่องคำสั่ง
      2. ทดสอบปิดชื่อหรือโลโก้แล้วบอกว่าหน้านี้ยังใช้กับเว็บอื่นหรือ marketplace อื่นได้ (หรือบอกเหตุผลอื่นที่หน้านี้ยังไม่เป็นของโปรเจกต์นี้เอง)
  - name: formula-and-equal-cells
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. บอกว่าลำดับส่วนของหน้าเป็นสูตรสำเร็จ (ส่วนเปิด → รายการ plugin → ขั้นตอนทำงาน → ติดตั้ง) และเสนอให้เล่าตามเรื่องของสินค้านี้
      2. บอกว่าแถวขั้นตอน 6 ช่องมีหน้าตาและขนาดเท่ากัน และถามหรือชี้ว่าไม่มีเหตุจากเนื้อหา (หรือเสนอเปลี่ยนเป็นรูปแบบอื่น)
  - name: mono-as-costume
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อบอกว่าฟอนต์ mono ถูกใช้นอกโค้ดและคำสั่ง เช่น บนชื่อแบรนด์ ชื่อ plugin หรือเลขขั้นตอน เพื่อให้ดูเป็นของนักพัฒนา (เครื่องแต่งตัว) · ถ้าบอกว่า mono ใช้ถูกที่ทั้งหมดให้ตก
