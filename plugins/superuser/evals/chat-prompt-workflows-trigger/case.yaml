# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: chat-prompt-workflows-trigger
description: ผู้ใช้ที่ไม่เขียนโค้ดขอ prompt ไปวางในแชตให้แตกงานแล้วรวม ไม่เอ่ยชื่อ skill ต้องทำให้ chat-prompt-workflows ถูกเปิด และ prompt มีชิ้นตกลงรูปข้อมูลร่วมก่อนแยก
tags: [trigger, chat-prompt-workflows]
runs: 3
expected_outcome: เรียก Skill chat-prompt-workflows แล้วเลือกแบบ Graph ส่ง prompt ที่มีชิ้นแรกตกลงชื่อเรียกและรูปแบบร่วม มีขั้นรวมที่ตรวจตามเกณฑ์ และบอกว่าแชตเดียวไม่ได้ทำพร้อมกันจริง
execution:
  prompt: |
    ฉันไม่เขียนโค้ดนะ อยากได้ prompt ไปวางใน Claude ให้ช่วยเขียนคู่มือพนักงานใหม่ของร้านกาแฟ 3 บท
    (เวลาเข้างาน · การชงเมนูหลัก · การปิดร้าน) ให้แยกเขียนทีละบทแล้วรวมเป็นเล่มเดียว
    ศัพท์ที่ใช้ต้องตรงกันทุกบท
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?chat-prompt-workflows"'
    min: 1
    arm: with-only
  - name: shared-contract-first
    type: regex
    pattern: "ข้อตกลงร่วม|รูปข้อมูลร่วม|ตกลง(?:ชื่อเรียก|ศัพท์|รูปแบบ)|data contract"
    match: contains
    target: last_message
  - name: no-emoji
    type: regex
    pattern: "✅|❌|📌|🚀|💡|✨|⭐|🔥|👉|📊|📝|🎯|⚠️"
    match: not_contains
    target: last_message
