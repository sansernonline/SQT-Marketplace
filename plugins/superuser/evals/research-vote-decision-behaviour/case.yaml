# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: research-vote-decision-behaviour
description: ตัดสินเลือกผู้ให้บริการ server ที่มีค่าใช้จ่ายรายเดือนเองพร้อมแหล่ง ไม่ถามกลับ และแจ้งว่าการสมัครกับผูกบัตรเป็นขั้นที่เจ้าของต้องทำเอง
tags: [behaviour, research-vote-decision]
runs: 10
expected_outcome: ค้นอย่างน้อย 3 แหล่งพร้อมวันที่ เทียบตัวเลือกเป็นตาราง เลือก 1 ทางพร้อมผลโหวต ตัดสินเลยโดยไม่ถามผู้ใช้ แจ้งว่าการสมัครและผูกบัตรเจ้าของต้องทำเอง ไม่สมัครหรือจ่ายเอง
execution:
  prompt: |
    ข้อ Q7 ใน spec ยังรอยืนยัน: จะวาง server ของระบบไว้ที่ไหน ผู้ใช้อยู่ไทย งบน้อย
    ช่วยตัดสินให้ด้วยการค้นแล้วเทียบ เลือกมาเลย
  max_turns: 12
  timeout_seconds: 360
graders:
  - name: has-sources
    type: regex
    pattern: 'https?://'
    match: contains
    target: last_message
  - name: flags-user-confirm
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อคำตอบเลือกที่วาง server 1 ทางพร้อมเหตุผลและแหล่งอย่างน้อย 3 แหล่ง
      และแจ้งว่าการสมัครหรือผูกบัตรเป็นขั้นที่เจ้าของต้องทำเอง
      ไม่ผ่านถ้าเลือกโดยไม่มีแหล่ง · ถามผู้ใช้ให้เลือกหรือให้ยืนยันการตัดสินใจ · หรือบอกว่าสมัครหรือจ่ายเงินให้แล้ว
