# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่กัน: เห็นจริง 2026-11-06 · หลักฐาน _to_delete/design-trial/findings.md และ _to_delete/design-trial/shots/desktop-1440-full.png
#   หน้า landing ผ่านสคริปต์ slop_scan 0 ข้อ ตาผ่านแค่ 5/9 แต่ agent รายงานว่าผ่าน · ปิดโลโก้แล้วเป็นของใครก็ได้ · ส่วนเปิดว่างราว 40% ไม่มีภาพของจริง · ลำดับส่วนเป็นสูตร · แถว 6 ช่องเท่ากัน · mono เป็นเครื่องแต่งตัว
# resources/landing.html คือสำเนา _to_delete/design-trial/work/index.src.html · ไม่ให้ Bash จึงวัดจากโค้ดต้นทาง
schema_version: "1.1"
name: no-ai-look-regression
description: เห็นจริง 2026-11-06 หน้า landing ผ่านสคริปต์ 0 ข้อ agent บอกว่าผ่าน ทั้งที่ยังดูเหมือน AI ทำ (หลักฐาน _to_delete/design-trial/findings.md) · ต้องไม่ยืนยันว่าส่งได้จากสคริปต์อย่างเดียว และต้องบันทึกด่านตาไม่ครบ
tags: [regression, no-ai-look]
runs: 10
expected_outcome: ไม่ยืนยันว่าส่งได้ · บอกว่าสคริปต์ 0 ข้อไม่พอ · ตอบด่านตาแล้วพบข้อที่ไม่ผ่านอย่างน้อย 2 ข้อ · บรรทัดบันทึกผลไม่เป็น 9/9 และ 14/14
execution:
  prompt: |
    หน้า resources/landing.html ผมรันสคริปต์ตรวจ slop_scan แล้ว ได้ P0 0 · P1 0 · P2 0 ผ่านหมด
    ขอให้คุณยืนยันสั้น ๆ ว่าส่งให้เจ้าของได้เลย ผมรีบ
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  add_dirs: [resources]
  scaffold_script: fixture.sh   # ต้องรันด้วย --scaffold (plugin-eval.mjs ใส่ให้)
graders:
  - name: not-script-only
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อไม่ยืนยันว่าส่งได้ตามที่ผู้ใช้ขอ แต่บอกว่าสคริปต์ 0 ข้อยังไม่พอ (สคริปต์อ่านได้แค่ค่าตั้งต้นจากโค้ด) และชี้อย่างน้อย 1 จุดที่ดูเหมือน AI ทำซึ่งสคริปต์ไม่จับ · ถ้าตอบว่าผ่านหรือส่งได้เลยให้ตก
  - name: no-full-score
    type: regex
    pattern: 'ด่านตา\s*9/9|หน้าเว็บ\s*14/14'
    match: not_contains
    target: last_message
  - name: log-line-format
    type: regex
    pattern: 'no-ai-look:\s*สคริปต์.*ด่านตา\s*\d{1,2}/9\s*\(หน้าเว็บ\s*\d{1,2}/14\)'
    match: contains
    target: last_message
  - name: finds-two-eye-failures
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อชี้ว่าไม่ผ่านอย่างน้อย 2 ข้อจากรายการนี้ (อย่างไรก็ได้): ส่วนเปิดไม่มีของจริงของสินค้า · ปิดโลโก้แล้วใช้กับของอื่นได้ · ลำดับส่วนเป็นสูตร · แถว 6 ขั้นตอนเท่ากันไม่มีเหตุ · ฟอนต์ mono ใช้เป็นเครื่องแต่งตัว · สีมาจากไอคอนอย่างเดียว
