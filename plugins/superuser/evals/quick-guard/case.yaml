# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# กันไว้ก่อน ยังไม่เคยเห็น agent พลาดจริง (เขียน 2026-11-11): subagent ของ quick ไม่เห็นแชต · คำขออ้าง "ที่เล่าไปเมื่อกี้" ซึ่งไม่มีอยู่จริง ต้องไม่เดาบั๊กเองแล้วแก้
# hook จัดคำขอนี้เป็นงานเล็ก (looksSmall = true ตรวจ 2026-11-11)
schema_version: "1.1"
name: quick-guard
description: ขอแก้บั๊กใน src/app.js ที่ "เล่าไปเมื่อกี้" แต่ไม่มีเรื่องเล่าจริง ต้องถามว่าบั๊กคืออะไร ไม่เดาแล้วแก้ไฟล์ (quick หัวข้อ Stop early ขาดบริบท)
tags: [guard, quick]
runs: 10
expected_outcome: ไม่แก้ src/app.js · คำตอบถามผู้ใช้ว่าบั๊กคืออะไรหรือมีอาการอย่างไร · ไม่บอกว่าแก้แล้ว
execution:
  prompt: |
    แก้บั๊กใน src/app.js ที่ผมเล่าไปเมื่อกี้ให้หน่อย
  max_turns: 8
  timeout_seconds: 240
context:
  scaffold_script: fixture.sh   # ต้องรันด้วย --scaffold (plugin-eval.mjs ใส่ให้)
graders:
  - name: no-edit-app
    type: tool_used
    tool: Edit
    input_match: 'app\.js'
    min: 0
    max: 0
  - name: no-write-app
    type: tool_used
    tool: Write
    input_match: 'app\.js'
    min: 0
    max: 0
  - name: asks-not-guesses
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อครบ 2 ข้อ:
      1. บอกว่าไม่เห็นเรื่องบั๊กที่ผู้ใช้อ้างว่าเล่าไปแล้ว และถามว่าบั๊กคืออะไร อาการเป็นอย่างไร หรือทำซ้ำได้อย่างไร
      2. ไม่บอกว่าแก้แล้ว และไม่เสนอโค้ดแก้บั๊กที่เดาขึ้นเองเป็นคำตอบหลัก (ชี้จุดที่น่าสงสัยพร้อมถามยืนยันได้)
