# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: no-ai-look-trigger
description: ผู้ใช้บอกว่าหน้าเว็บที่ AI ทำให้ดูเหมือนเว็บอื่นไปหมด ไม่เอ่ยชื่อ skill ต้องทำให้ no-ai-look ถูกเปิด และชี้สัญญาณเฉพาะตัวพร้อมทางแก้
tags: [trigger, no-ai-look]
runs: 10
expected_outcome: เรียก Skill no-ai-look แล้วชี้สัญญาณค่าตั้งต้นที่เห็นในคำบรรยาย (ไล่สีม่วง · การ์ด 3 ใบ · ฮีโร่กลางจอ) พร้อมทางแก้ที่ผูกกับคลินิก ไม่ใช่เปลี่ยนไปใช้ค่าตั้งต้นอีกชุด
execution:
  prompt: |
    ผมให้ AI ทำหน้าเว็บคลินิกกายภาพบำบัดของผมมา หน้าตาคือพื้นขาว หัวข้อใหญ่กลางจอตัวอักษรไล่สีม่วงน้ำเงิน
    ใต้หัวข้อมีปุ่มกลมมน 2 ปุ่ม แล้วเป็นการ์ด 3 ใบเท่ากัน แต่ละใบมีไอคอนในวงกลมสีอ่อน ตามด้วยโลโก้ลูกค้า แล้วก็ราคา
    ดูแล้วรู้สึกว่าเหมือนเว็บอื่นไปหมด แต่บอกไม่ถูกว่าผิดตรงไหน ช่วยบอกหน่อยว่าควรแก้อะไร
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?no-ai-look"'
    min: 1
    arm: with-only
  - name: names-the-signals
    type: regex
    pattern: 'ไล่สี'
    match: contains
    target: last_message
  - name: fix-tied-to-clinic
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อทางแก้ผูกกับคลินิกกายภาพบำบัดนี้ เช่น ใช้ของจริงของคลินิก (ภาพห้องจริง ผลการรักษา ชื่อนักกายภาพ) หรือสีและโครงหน้าที่ตั้งจากโลกของคลินิก · ไม่ใช่แค่เปลี่ยนจากม่วงไปเป็นสีสำเร็จรูปอีกชุด
