# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการเดิม (2026-10-22): เมื่อสั่งย่อข้อความ agent ตัดคำทำหน้าที่ (จะ ให้ ก็ ด้วย แล้ว) และคำสุภาพ (ขอ รบกวน นะ ครับ/ค่ะ) ออกก่อน
# ทำให้ภาษาไทยห้วนเหมือนแปล — human-writing หัวข้อ 3 "ตัดรายการ ไม่ตัดคำทำหน้าที่" เพิ่มเพื่อปิดจุดนี้
schema_version: "1.1"
name: human-writing-regression
description: ย่อข้อความแชตถึงลูกค้าให้สั้นลง ต้องลดจำนวนข้อหรือย่อเนื้อหา ไม่ตัดคำสุภาพและคำทำหน้าที่
tags: [regression, human-writing]
runs: 3
expected_outcome: ข้อความสั้นลงจริง ยังมี ค่ะ และ ขอ หรือ รบกวน อยู่ ไม่มีประโยคที่เหลือแต่คำนามเรียงกัน
execution:
  prompt: |
    ข้อความนี้ยาวเกินกล่องแชตของร้าน (จำกัด 160 ตัวอักษร) ช่วยย่อให้พอดีโดยยังสุภาพเหมือนเดิม ส่งกลับมาเฉพาะข้อความที่ย่อแล้ว:

    "สวัสดีค่ะคุณลูกค้า ทางร้านขอแจ้งว่าสินค้าที่สั่งไว้เมื่อวานนี้ ตอนนี้แพ็กเรียบร้อยแล้วนะคะ ขนส่งจะมารับของช่วงบ่ายวันนี้ค่ะ และน่าจะถึงมือคุณลูกค้าภายใน 2 วันทำการ ถ้ามีอะไรให้ช่วยเพิ่มเติม รบกวนทักมาได้เลยนะคะ ขอบคุณที่อุดหนุนค่ะ"
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: polite-particle-kept
    type: regex
    pattern: "ค่ะ|คะ"
    match: contains
    target: last_message
  - name: polite-verb-kept
    type: regex
    pattern: "ขอ|รบกวน"
    match: contains
    target: last_message
  - name: facts-kept
    type: regex
    pattern: "2 วัน"
    match: contains
    target: last_message
  - name: cut-items-not-function-words
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ข้อความที่ย่อแล้วยาวไม่เกินราว 160 ตัวอักษร
      2. ความสั้นมาจากการตัดข้อ (เช่น ตัดประโยคขอบคุณ หรือรวม 2 ประโยคเป็น 1) ไม่ใช่จากการถอดคำทำหน้าที่ จะ ให้ ก็ ด้วย แล้ว นะ ออกจากประโยคจนเหลือคำนามเรียงกัน
      3. อ่านออกเสียงแล้วเป็นภาษาแชตร้านที่คนไทยพิมพ์จริง ไม่ห้วนเหมือนโทรเลข
