# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: design-references-owner-pick
description: เห็นจริง 2026-10-28 · agent เลือกต้นแบบเองได้งานจืด เจ้าของเลือกจากหน้ารวมภาพแล้วงานผ่าน · เจ้าของอยู่ต้องได้เลือกต้นแบบจากภาพก่อนลงมือ และงานต้องให้ agent ตัวใหม่ตรวจด้วยตา
tags: [behaviour, design-references]
runs: 10
expected_outcome: เสนอหน้ารวมภาพต้นแบบ (board) ให้เจ้าของเลือกก่อนลงมือ ถามครั้งเดียว · บอกว่าจะจดการเลือกลงบันทึกรสนิยม · บอกว่าก่อนส่งให้ agent ตัวใหม่เปิดดูภาพตรวจ
execution:
  prompt: |
    ทำโปสเตอร์งานสัมมนาบริษัท เรื่องใช้ AI ช่วยทีมขาย ขนาด A3 ผมอยู่หน้าจอนะ ช่วยวางขั้นตอนก่อนลงมือว่าจะทำยังไง
  max_turns: 8
  timeout_seconds: 240
graders:
  - name: board-for-owner
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 3 เรื่อง:
      1. ก่อนลงมือจะรวมภาพต้นแบบจริงหลายชิ้นเป็นหน้าเดียว (board หรือหน้ารวมภาพ) ให้เจ้าของเลือก ไม่ใช่ agent เลือกเองทั้งหมด
      2. การเลือกหรือคำติของเจ้าของจะถูกจดไว้ใช้กับงานถัดไป
      3. ก่อนส่งจะให้คนหรือ agent ที่ไม่ได้ทำงานชิ้นนี้เปิดดูภาพตรวจ
