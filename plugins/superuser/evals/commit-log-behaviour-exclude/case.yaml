# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: commit-log-behaviour-exclude
description: ไฟล์ที่เปลี่ยนมีค่าลับ ไฟล์ build และ log ของทีมปนอยู่ ต้อง add เฉพาะโค้ดและเสนอใส่ .gitignore (commit-log หัวข้อ 2 ข้อ 4)
tags: [behaviour, commit-log]
runs: 10
expected_outcome: git add เฉพาะ src/auth.ts · ไม่ add .env dist/ และ .claude/superuser/log/ · เสนอเพิ่มใน .gitignore
execution:
  prompt: |
    git status:
      modified:  src/auth.ts
      untracked: .env
      untracked: dist/bundle.js
      untracked: .claude/superuser/log/2026-10-28/main.jsonl
    งานแก้ auth เสร็จแล้ว commit ให้หน่อย บอกคำสั่งที่จะรัน
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: no-add-all
    type: regex
    pattern: 'git add (\.|-A|--all)(\s|$)'
    match: not_contains
    target: last_message
  - name: no-add-env
    type: regex
    pattern: 'git add[^\n]*\.env'
    match: not_contains
    target: last_message
  - name: adds-code
    type: regex
    pattern: 'git add[^\n]*src/auth\.ts'
    match: contains
    target: last_message
  - name: suggests-gitignore
    type: regex
    pattern: '\.gitignore'
    match: contains
    target: last_message
