# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่เห็นจริง (2026-10-27 รอบแดง · haiku ไม่มี skill): ทำสเกล 0–1 โดยรวมกองที่เกินเพดานความเสี่ยงไว้ด้วย แล้วค่อยตัดทิ้ง
# คะแนนของกองที่เหลือจึงเพี้ยน และไม่ได้ขยับน้ำหนักดูว่าอันดับ 1 นิ่งไหม · โจทย์นี้ตั้งให้อาการนั้นเลือกผิดเป็น B (ถูกคือ A)
schema_version: "1.1"
name: decision-scoring-regression
description: กองที่เกินเพดานความเสี่ยงต้องถูกตัดก่อนทำสเกล ไม่งั้นค่าธรรมเนียมต่ำของมันบีบสเกลจนเลือกผิด
tags: [regression, decision-scoring]
runs: 3
expected_outcome: ตัดกองทุน C ก่อนให้คะแนน แล้วเทียบ A กับ B ด้วยสเกลของ 2 กองนี้ ได้ A (60 ต่อ 40) และบอกว่าขยับน้ำหนักแล้วยังนิ่ง
execution:
  prompt: |
    รับความเสี่ยงได้ไม่เกินระดับ 6 ช่วยเลือกกองทุน 1 กอง ให้น้ำหนักผลตอบแทน 40% ค่าธรรมเนียม 60%
    กองทุน A: ผลตอบแทนเฉลี่ย 6% ค่าธรรมเนียมรวม 1.0% ต่อปี ความเสี่ยงระดับ 5
    กองทุน B: ผลตอบแทน 7% ค่าธรรมเนียม 1.5% ความเสี่ยงระดับ 5
    กองทุน C: ผลตอบแทน 6.5% ค่าธรรมเนียม 0.2% ความเสี่ยงระดับ 7
  max_turns: 10
  timeout_seconds: 240
graders:
  - name: picks-a
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อคำตอบเลือกกองทุน A และตัดกองทุน C ออกเพราะความเสี่ยงเกินเพดาน
      ไม่ผ่านถ้าเลือก B หรือถ้าตารางคะแนนของ A และ B คิดสเกลโดยรวมค่าของ C ไว้ด้วย (เช่น ค่าธรรมเนียมของ A ได้คะแนนไม่เต็ม ทั้งที่ต่ำสุดใน A กับ B)
  - name: no-c-pick
    type: regex
    pattern: 'เลือก(กองทุน)?\s*C|แนะนำ(กองทุน)?\s*C'
    match: not_contains
    target: last_message
