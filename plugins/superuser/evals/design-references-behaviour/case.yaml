# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: design-references-behaviour
description: ขอสไลด์นำเสนอให้ดูดี ต้องตั้งคำค้นจากโปรเจกต์ ชี้เว็บที่เก่งงานสไลด์ ถอดสี 8 หน้าที่จากต้นแบบ และบอกว่างานจากเว็บแรงบันดาลใจห้ามยกมาใส่ตรง ๆ
tags: [behaviour, design-references]
runs: 10
expected_outcome: ตั้งคำค้นไทยและอังกฤษจากโปรเจกต์ · ลิงก์เว็บประเภทสไลด์ · ถอดสีจากงานที่เลือกเป็น 8 หน้าที่ · เตือนว่า Dribbble หรือ Behance ใช้ดูเป็นต้นแบบเท่านั้น
execution:
  prompt: |
    ต้องทำสไลด์ pitch ขอทุนสตาร์ทอัปแอปจองคิวคลินิกทันตกรรม 12 หน้า อยากให้ดูโปรเหมือนงานนักออกแบบ
    ช่วยวางแนวทางหน้าตาและสีก่อนลงมือ
  max_turns: 10
  timeout_seconds: 300
graders:
  - name: slide-sites
    type: regex
    pattern: 'Behance|Pitch|Canva|SlidesCarnival|Dribbble'
    flags: i
    match: contains
    target: last_message
  - name: eight-roles
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 3 เรื่อง:
      1. คำค้นมาจากโปรเจกต์นี้ (คลินิกทันตกรรม · จองคิว · pitch deck หรือคำใกล้เคียง)
      2. สีถอดจากงานต้นแบบ หรือบอกขั้นตอนถอดสี โดยมีหน้าที่ของสีอย่างน้อย พื้น ตัวหนังสือ และสีหลัก
      3. บอกว่างานจากเว็บแรงบันดาลใจใช้ดูเป็นต้นแบบ ไม่ยกภาพหรือเลย์เอาต์ทั้งหน้ามาใช้
