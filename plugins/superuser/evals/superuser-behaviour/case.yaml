# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: superuser-behaviour
description: งานหลายขั้นที่ยังไม่ให้ลงมือ ต้องได้แผนที่มีเป้า เสร็จเมื่อ เสี่ยง ก่อนแตะงาน และทุกขั้นมีเกณฑ์เสร็จที่ตรวจได้ (superuser หัวข้อ 2)
tags: [behaviour, superuser]
runs: 10
expected_outcome: ขึ้นด้วย 3 บรรทัด เป้า · เสร็จเมื่อ · เสี่ยง · แตกเป็นขั้นที่แต่ละขั้นมีวิธีตรวจ (test · ทำกรณีที่ล้มซ้ำ) ไม่ใช่ "ตรวจให้เรียบร้อย"
execution:
  prompt: |
    เว็บร้านเรามี 2 เรื่อง: ผู้ใช้ล็อกอินไม่ได้หลังเปลี่ยนรหัสผ่าน และอยากเพิ่มหน้าลืมรหัสผ่านที่ส่งลิงก์ทางอีเมล
    ยังไม่ต้องลงมือ บอกแผนที่จะทำก่อน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: has-done-when
    type: regex
    pattern: 'เสร็จเมื่อ'
    match: contains
    target: last_message
  - name: has-risk
    type: regex
    pattern: 'เสี่ยง'
    match: contains
    target: last_message
  - name: checkable-steps
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อครบ 2 ข้อ:
      1. แผนแยกงานแก้บั๊กกับงานเพิ่มหน้าใหม่เป็นคนละขั้น และแก้บั๊กมาก่อน
      2. ทุกขั้นบอกว่าตรวจอย่างไรให้รู้ว่าเสร็จ เช่น test ที่ต้องผ่าน หรือทำกรณีที่ล้มซ้ำแล้วผ่าน อย่างใดอย่างหนึ่งก็พอ ไม่ใช่แค่ "ตรวจให้เรียบร้อย"
