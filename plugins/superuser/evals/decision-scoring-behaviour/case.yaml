# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: decision-scoring-behaviour
description: เลือกข้อเสนองาน 2 ที่ที่คะแนนสูสี ต้องบอกว่าผลยังไม่นิ่งและให้ผู้ใช้ตัดสิน ไม่ฟันธงแทน
tags: [behaviour, decision-scoring]
runs: 3
expected_outcome: ให้คะแนนตามน้ำหนักที่ผู้ใช้บอก ขยับน้ำหนักดูความไว แล้วบอกว่าอันดับพลิกได้ จึงชี้เกณฑ์ที่ทำให้พลิกให้ผู้ใช้เลือก
execution:
  prompt: |
    ได้ข้อเสนองาน 2 ที่ ช่วยเลือกให้หน่อย
    ที่ 1: เงินรวมต่อปี 960,000 บาท เดินทางไปกลับวันละ 120 นาที
    ที่ 2: เงินรวมต่อปี 900,000 บาท เดินทางไปกลับวันละ 30 นาที
    ผมให้น้ำหนักเงิน 52% เวลาเดินทาง 48%
  max_turns: 10
  timeout_seconds: 240
graders:
  - name: flags-unstable
    type: regex
    pattern: 'ไม่นิ่ง|สูสี|พลิก|อ่อนไหว|ใกล้กัน|sensitiv|unstable|flip'
    flags: i
    match: contains
    target: last_message
  - name: user-decides
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อคำตอบบอกว่าผลขึ้นกับน้ำหนักที่ใกล้กันมาก (ขยับนิดเดียวอันดับเปลี่ยน)
      และให้ผู้ใช้ตัดสินโดยชี้ว่าเงินกับเวลาเดินทางอะไรสำคัญกว่า แทนที่จะฟันธงเลือกที่ใดที่หนึ่งเป็นคำตอบสุดท้าย
