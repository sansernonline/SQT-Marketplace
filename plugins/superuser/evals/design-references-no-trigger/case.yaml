# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: design-references-no-trigger
description: แก้ CSS ค่าเดียวที่บอกตัวเลขมาแล้ว ไม่ใช่งานออกแบบใหม่ ต้องไม่เปิด design-references (ไม่ต้องหาแรงบันดาลใจ)
tags: [no-trigger, design-references]
runs: 10
expected_outcome: ไม่เรียก Skill design-references · ให้ CSS ที่มี border-radius 8px
execution:
  prompt: |
    แก้ CSS ให้ปุ่ม .btn-primary มุมมน 8px และตัวหนังสือหนา 600 ส่งมาเฉพาะ rule ที่แก้
  max_turns: 4
  timeout_seconds: 120
graders:
  - name: skill-not-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-references"'
    min: 0
    max: 0
    arm: both
  - name: radius-set
    type: regex
    pattern: 'border-radius:\s*8px'
    match: contains
    target: last_message
