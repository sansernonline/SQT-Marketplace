# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: branded-document-design-trigger
description: ต้องส่งใบเสนอราคาและรายงานเป็น Word ให้ลูกค้าให้ดูมืออาชีพ มีสีแบรนด์ ฟอนต์ไทยไม่เพี้ยน ไม่เอ่ยชื่อ skill ต้องทำให้ branded-document-design ถูกเปิด
tags: [trigger, branded-document-design]
runs: 3
expected_outcome: เรียก Skill branded-document-design แล้วกำหนดชุดสี ฟอนต์ไทยกับอังกฤษ ช่องไฟเดียวกันทุกหน้า และสร้างไฟล์ด้วยสคริปต์
execution:
  prompt: |
    ผมต้องส่งใบเสนอราคากับรายงานให้ลูกค้าเป็นไฟล์ Word ให้ดูมืออาชีพ มีสีตามแบรนด์ ฟอนต์ไทยกับอังกฤษไม่เพี้ยน ทำอย่างไรดี
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?branded-document-design"'
    min: 1
    arm: with-only
  - name: theme-fonts
    type: regex
    pattern: "(?i)font|ฟอนต์|python-docx|doc-theme"
    match: contains
    target: last_message
