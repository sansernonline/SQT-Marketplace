# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: ui-craft-behaviour
description: ขอสเปกหน้าจอรายการใบสั่งซื้อ ต้องตามกฎหลักของ ui-craft คือสเกลระยะห่างชุดเดียว ตัวอักษรไม่เกิน 5 ขนาด และออกแบบสถานะที่ไม่ใช่กรณีมีข้อมูลครบ (ว่าง โหลด ผิดพลาด)
tags: [behaviour, ui-craft]
runs: 10
expected_outcome: สเปกมีสเกลระยะ 4 8 12 16 24 32 · ตัวอักษรไม่เกิน 5 ขนาด · สถานะว่างบอกเหตุผลและปุ่มต่อ · โหลดใช้โครงร่างเทา · ผิดพลาดมีปุ่มลองใหม่
execution:
  prompt: |
    ช่วยเขียนสเปกหน้าจอ "รายการใบสั่งซื้อ" ของระบบจัดซื้อโรงงานเล็ก ๆ ให้ dev ทำตาม
    เจ้าหน้าที่จัดซื้อใช้วันละหลายสิบรายการ ต้องค้น กรองตามสถานะ และกดเข้าไปดูรายละเอียดได้
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: spacing-scale
    type: regex
    pattern: '\b4\b[^\n]{0,12}\b8\b[^\n]{0,12}\b12\b[^\n]{0,12}\b16\b'
    match: contains
    target: last_message
  - name: skeleton-loading
    type: regex
    pattern: 'skeleton|โครงร่าง'
    flags: i
    match: contains
    target: last_message
  - name: type-scale-limit
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อสเปกกำหนดขนาดตัวอักษรเป็นชุดจำกัด ไม่เกิน 5 ขนาดต่างกัน (นับเฉพาะที่สเปกระบุเป็นขนาดมาตรฐานของหน้า) และไม่มีขนาดที่เล็กกว่า 11
  - name: non-happy-states
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน · ผ่านเมื่อมีครบ 2 เรื่อง:
      1. สถานะว่างบอกว่าทำไมว่างและมีปุ่มหรือทางไปต่อ ไม่ใช่แค่ข้อความ "ไม่มีข้อมูล"
      2. สถานะผิดพลาดบอกว่าเกิดอะไรขึ้นและมีทางลองใหม่ ไม่ใช่โยนข้อความระบบให้ผู้ใช้อ่าน
