# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# fixture resources/tidy-notes: CLI ภาษา Deno (ไม่อยู่ในตารางสำรอง readme-by-stack) · คำสั่งจริงอยู่ใน deno.json · ไม่มีหน้าจอ ไม่มี deploy ไม่มีค่าตั้งภายนอก
schema_version: "1.1"
name: project-bootstrap-readme-behaviour
description: เขียน README ให้โปรเจกต์ที่ stack ไม่อยู่ในตารางสำรอง ต้องอ่านโปรเจกต์และเอกสารทางการก่อน แล้วเลือกหัวข้อตามประเภทงาน (CLI) ไม่ยกโครง 15 หัวข้อมาทั้งชุด
tags: [behaviour, project-bootstrap]
runs: 5
expected_outcome: อ่าน deno.json · คำสั่งใน README เป็น deno task ตามไฟล์ · มีวิธีใช้คำสั่งและตัวเลือก --dir --dry-run · ไม่มีหัวข้อภาพหน้าจอหรือ deploy · ไม่มีคำสั่ง npm
execution:
  prompt: |
    เขียน README.md ให้โปรเจกต์ในโฟลเดอร์ resources/tidy-notes ห้ามแก้ไฟล์ในโฟลเดอร์นั้น
    ตอบกลับเป็นเนื้อ README ทั้งไฟล์ ทำต่อได้เลยไม่ต้องถามกลับ
  add_dirs: [resources]
  scaffold_script: fixture.sh   # ต้องรันด้วย --scaffold (plugin-eval.mjs ใส่ให้)
  max_turns: 20
  timeout_seconds: 600
graders:
  - name: read-manifest
    type: tool_used
    tool: Read
    input_match: 'deno\.json'
    min: 1
    arm: both
  - name: checked-official-docs
    type: tool_used
    tool: WebSearch
    min: 1
    arm: with-only
  - name: deno-task-commands
    type: regex
    pattern: 'deno task (test|check|compile|dev)'
    match: contains
    target: last_message
  - name: no-npm
    type: regex
    pattern: '\bnpm (install|ci|run|test)\b'
    match: not_contains
    target: last_message
  - name: fits-cli
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อครบทุกข้อ:
      1. มีวิธีใช้คำสั่ง tidy-notes พร้อมตัวเลือก --dir และ --dry-run และตัวอย่างผลลัพธ์อย่างน้อย 1 บรรทัด
      2. ไม่มีหัวข้อภาพหน้าจอ deploy หรือสถาปัตยกรรมหลายส่วน เพราะโปรเจกต์เป็น CLI ตัวเดียวที่ไม่มีของเหล่านั้น
      3. บอกรุ่น Deno ที่ต้องมี (2.x ตาม CI) และบอกว่าไม่มีค่าตั้งภายนอก
