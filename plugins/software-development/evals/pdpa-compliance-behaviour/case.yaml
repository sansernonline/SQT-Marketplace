# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: pdpa-compliance-behaviour
description: วางแนวทาง PDPA ของร้านออนไลน์ ต้องแยกฐานทางกฎหมาย (ที่อยู่จัดส่ง = สัญญา) นับปลั๊กอินต่างประเทศเป็นผู้ให้บริการภายนอก มีอายุการเก็บต่อประเภท และเตือนว่าไม่ใช่คำแนะนำทางกฎหมาย
tags: [behaviour, pdpa-compliance]
runs: 3
expected_outcome: ที่อยู่จัดส่งใช้ฐานสัญญา · ปลั๊กอินวัดสถิติอยู่ในรายการผู้ให้บริการ · อายุการเก็บต่อประเภทข้อมูล · เตือนไม่ใช่คำแนะนำทางกฎหมาย
execution:
  prompt: |
    ร้านขายอุปกรณ์กีฬาออนไลน์ของเราเก็บชื่อ เบอร์โทร ที่อยู่จัดส่ง วันเกิด และใช้ปลั๊กอินวัดสถิติของต่างประเทศ
    วางแนวทางทำตาม PDPA ให้หน่อย ตอบในแชต ไม่ต้องสร้างไฟล์ ไม่ต้องถามกลับ
  max_turns: 8
  timeout_seconds: 300
graders:
  - name: delivery-address-contract-basis
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อคำตอบระบุว่าที่อยู่จัดส่งใช้ฐานสัญญา (หรือฐานอื่นที่ไม่ใช่ความยินยอม) ไม่ขอความยินยอมสำหรับทุกอย่าง
  - name: third-party-listed
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อคำตอบนับปลั๊กอินวัดสถิติต่างประเทศเป็นผู้ให้บริการภายนอกที่ต้องอยู่ในรายการ และพูดถึงการส่งข้อมูลออกนอกประเทศ
  - name: retention-per-type
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย ให้ผ่านเมื่อคำตอบกำหนดอายุการเก็บแยกตามประเภทข้อมูล และมีงานลบที่รันจริงตามรอบ
  - name: not-legal-advice
    type: regex
    pattern: "ไม่ใช่คำแนะนำทางกฎหมาย|ที่ปรึกษากฎหมาย|ปรึกษานักกฎหมาย|not legal advice"
    flags: i
    match: contains
    target: last_message
