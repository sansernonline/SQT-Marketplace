# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: markdown-report-docx-trigger
description: มีรายงานผลทดสอบเป็น Markdown ไฟล์เดียวต้องส่งลูกค้าเป็น Word มีสารบัญ ตาราง รูป ไม่เอ่ยชื่อ skill ต้องทำให้ markdown-report-docx ถูกเปิด
tags: [trigger, markdown-report-docx]
runs: 3
expected_outcome: เรียก Skill markdown-report-docx แล้วแปลงด้วยสคริปต์ md_to_docx ตรวจทุกหน้าจาก PDF และแก้ที่ต้นฉบับ
execution:
  prompt: |
    ผมเขียนรายงานผลทดสอบระบบเป็นไฟล์ Markdown ไฟล์เดียว ต้องส่งลูกค้าเป็น Word ที่ดูเรียบร้อย มีปก สารบัญ ตาราง และรูป ทำอย่างไร
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?markdown-report-docx"'
    min: 1
    arm: with-only
  - name: converter
    type: regex
    pattern: "md_to_docx|docx"
    flags: i
    match: contains
    target: last_message
