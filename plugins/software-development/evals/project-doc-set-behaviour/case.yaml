# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: project-doc-set-behaviour
description: ขอให้วางชุดเอกสารโปรเจกต์เล็ก ต้องผูกแต่ละเอกสารกับคนอ่านและการตัดสินใจ เลือกที่เก็บนอก repo เป็นค่าเริ่มต้น และไม่เสนอเอกสารที่ไม่มีคนอ่าน
tags: [behaviour, project-doc-set]
runs: 3
expected_outcome: แต่ละเอกสารบอกว่าใครอ่านและตัดสินใจอะไร ค่าเริ่มต้นเก็บนอก repo โฟลเดอร์ ref สำหรับของที่ได้รับมา ชุดเล็กตามขนาดโปรเจกต์ ไม่ใส่เอกสารเกินจำเป็น
execution:
  prompt: |
    โปรเจกต์ระบบจองคิวคลินิก ทีม 3 คน 2 เดือน ลูกค้าส่ง TOR กับบันทึกประชุมมา ช่วยกำหนดว่าต้องมีเอกสารอะไรบ้าง เรียงลำดับ และเก็บไว้ที่ไหน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: ref-folder
    type: regex
    pattern: "ref/"
    match: contains
    target: last_message
  - name: rules-followed
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. แต่ละเอกสารที่เสนอระบุคนอ่านและการตัดสินใจที่เกิดจากการอ่าน เอกสารที่ไม่มีคนอ่านไม่ถูกเสนอ
      2. ชุดเอกสารเล็กพอกับทีม 3 คน 2 เดือน ไม่เสนอเอกสารครบทุกชนิดตามแม่แบบองค์กรใหญ่
      3. แยกของที่ได้รับมา (TOR บันทึกประชุม) ไว้ในโฟลเดอร์ ref อ่านอย่างเดียว ไม่ปนกับเอกสารที่เขียนเอง
      4. ตัดสินเรื่องเอกสารอยู่ใน repo หรือนอก repo ก่อน และบอกเหตุผล
