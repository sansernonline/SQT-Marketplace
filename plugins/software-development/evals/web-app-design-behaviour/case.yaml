# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: web-app-design-behaviour
description: งานเว็บแอปที่ยังไม่มีแบรนด์ ต้องค้นต้นแบบก่อน แล้วเขียนค่าของงานลง theme.css พร้อมที่มา ไม่ส่งหน้าตาค่าสำรอง (Apps Track) ออกไปเป็นของงาน
tags: [behaviour, web-app-design]
runs: 5
expected_outcome: ค้นต้นแบบเว็บหรือแดชบอร์ดในวงการคลินิกสัตว์ · มี mockup/theme.css ที่ตั้งสี ฟอนต์ มุม และเลย์เอาต์ของงานพร้อมคอมเมนต์ที่มา · สีหลักไม่ใช่ค่าสำรอง #226CC6 / #2A78D6 เว้นแต่บอกว่าค้นไม่ได้และติด (รอยืนยัน)
execution:
  prompt: |
    ทำ mockup หน้าแดชบอร์ดตารางนัดของคลินิกรักษาสัตว์ 3 สาขา ให้พนักงานหน้าร้านใช้ทั้งวัน
    ยังไม่มีโลโก้หรือสีแบรนด์ เก็บไฟล์ไว้ในโฟลเดอร์ mockup/ ทำต่อได้เลยไม่ต้องถามกลับ
  max_turns: 40
  timeout_seconds: 1200
graders:
  - name: searched-references
    type: tool_used
    tool: WebSearch
    min: 1
    arm: with-only
  - name: theme-file
    type: file_exists
    path: mockup/theme.css
    exists: true
  - name: not-fallback-look
    type: llm
    focus: last_message
    criteria: |
      ตัดสินจากความหมาย · ผ่านเมื่อครบทุกข้อ:
      1. บอกว่าสีหลักและฟอนต์ของงานมาจากไหน (ต้นแบบที่ค้น ชื่อเว็บหรือลิงก์ หรือเหตุผลจากเนื้องานคลินิกสัตว์) ไม่ใช่แค่ "ใช้ค่าเริ่มต้น"
      2. สีหลักไม่ใช่ #226CC6 หรือ #2A78D6 · ถ้าใช้สองค่านี้ ต้องบอกว่าค้นต้นแบบไม่ได้และติด (รอยืนยัน)
      3. บอกอย่างน้อย 1 ค่านอกเหนือจากสีที่ปรับตามงาน (ฟอนต์ ขนาดตัวอักษรฐาน มุม หรือโครงเมนู) พร้อมเหตุผล
