# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23) · ยังไม่ได้รันจริง (เสียเงิน)
schema_version: "1.1"
name: design-system-trigger
description: ทีมขอวางระบบ token สามชั้น ไม่เอ่ยชื่อ skill ต้องเปิด design-system
tags: [trigger, design-system]
runs: 3
expected_outcome: เรียก Skill design-system แล้วอธิบาย primitive → semantic → component
execution:
  prompt: |
    ทีมเรามีแอปเว็บที่สีและระยะกระจายอยู่ในโค้ดทุกไฟล์ อยากให้เปลี่ยนธีมแก้ที่เดียว ต้องจัดระบบอย่างไร
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?design-system"'
    min: 1
    arm: with-only
  - name: layers
    type: regex
    pattern: "primitive|semantic"
    flags: i
    match: contains
    target: last_message
