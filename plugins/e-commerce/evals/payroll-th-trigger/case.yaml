# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: payroll-th-trigger
description: ทำเงินเดือนพนักงานครั้งแรก ต้องเปิด payroll-th และพูดถึงประกันสังคมหรือ ภ.ง.ด.1 · ไม่เอ่ยชื่อ skill
tags: [trigger, regression-suite, payroll-th]
runs: 3
expected_outcome: เปิด Skill payroll-th แล้วตอบตรงคำถาม
execution:
  prompt: |
    สิ้นเดือนนี้ต้องจ่ายเงินเดือนลูกน้อง 4 คน เงินเดือนตั้งแต่ 15,000 ถึง 28,000 ต้องหักอะไรบ้าง ประกันสังคมกับภาษีคิดยังไงคะ
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?payroll-th"'
    min: 1
    arm: with-only
  - name: answer-on-topic
    type: regex
    pattern: 'ประกันสังคม|ภ\.?ง\.?ด\.?\s*1'
    flags: i
    match: contains
    target: last_message
