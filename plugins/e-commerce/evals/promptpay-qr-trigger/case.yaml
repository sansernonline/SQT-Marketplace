# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: promptpay-qr-trigger
description: QR หน้าร้านแบบลูกค้าใส่ยอดเอง ต้องเปิด promptpay-qr และบอกว่าเป็น QR แบบไม่ระบุยอด · ไม่เอ่ยชื่อ skill
tags: [trigger, regression-suite, promptpay-qr]
runs: 3
expected_outcome: เปิด Skill promptpay-qr แล้วตอบตรงคำถาม
execution:
  prompt: |
    ร้านมีพร้อมเพย์เบอร์ 0891234567 อยากทำคิวอาร์ไปแปะหน้าร้าน ให้ลูกค้าสแกนแล้วใส่ยอดเองค่ะ ทำยังไงคะ
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?promptpay-qr"'
    min: 1
    arm: with-only
  - name: answer-on-topic
    type: regex
    pattern: 'static|ไม่ระบุยอด|ใส่ยอดเอง|ยอดเอง|010211'
    flags: i
    match: contains
    target: last_message
