# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: shop-daily-briefing-behaviour
description: ข้อมูลเช้าวันนี้ 9 เรื่อง ต้องได้ไม่เกิน 6 ข้อ เรียงตามเงินที่เสี่ยงก่อน มีตัวเลขและขั้นถัดไป และพับที่เหลือเป็นบรรทัดเดียว
tags: [behaviour, shop-daily-briefing]
runs: 3
expected_outcome: ข้อแรกคือออเดอร์ที่เลยเวลาเตรียมส่ง (เงินเสี่ยงสูงสุด) หรือคำขอคืนเงินที่หมดเขตวันนี้ · ไม่เกิน 6 ข้อ · ทุกข้อมีบาทหรือจำนวน และขั้นถัดไป · เรื่องเล็กพับรวม
execution:
  prompt: |
    ข้อมูลที่ export มาเมื่อ 8 โมงเช้านี้ค่ะ ช่วยสรุปให้หน่อยว่าวันนี้ต้องทำอะไรบ้าง
    - Shopee ออเดอร์เลยเวลาเตรียมส่ง 6 ใบ รวม 4,820 บาท
    - Lazada คำขอคืนเงิน 1 ราย 1,590 บาท ต้องตอบภายในวันนี้
    - TikTok Shop พัสดุ 1 ชิ้นสถานะไม่ขยับ 6 วัน 420 บาท
    - แชตลูกค้าถามสี ถามไซซ์ 11 ข้อความ
    - แชต 1 ข้อความบอกว่าจะไปแจ้ง สคบ. ออเดอร์ 990 บาท
    - เสื้อ TSH-BLK-M เหลือ 3 ตัว ต่ำกว่าจุดสั่ง ขายวันละ 5 ตัว
    - หมวก HAT-WHT เหลือ 40 ใบ ไม่ได้ขายมา 35 วัน
    - ลูกค้า LINE โอนเงินมาแล้ว 2 ราย ยังไม่ได้ยืนยันออเดอร์
    - รีวิว 2 ดาว 1 รีวิว เรื่องส่งช้า
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: late-orders-amount
    type: regex
    pattern: '4,?820'
    match: contains
    target: last_message
  - name: briefing-shape
    type: llm
    focus: last_message
    # แก้ข้อ 3 วันที่ 2026-11-10: เดิม "บาทหรือจำนวนชิ้น" + "ทำได้วันนี้" ผู้ตัดสินตก "โอนแล้ว 2 ราย" ที่ข้อมูลไม่มียอดบาท และ "เปิดเคลม" ที่ไม่เขียนคำว่าวันนี้ ซึ่งตรงกับตัวอย่างใน skill
    # 2026-11-11: คืนคำ "ที่ทำได้วันนี้" แต่ให้ตัดสินจากความหมาย ไม่ต้องมีคำว่าวันนี้ในคำตอบ (ผู้ตรวจรอบ 1)
    criteria: |
      ตัดสินจากความหมาย ไม่ต้องใช้คำเดียวกัน ให้ผ่านเมื่อครบทุกข้อ:
      1. รายการหลักไม่เกิน 6 ข้อ เรื่องที่เหลือพับรวมเป็นบรรทัดเดียวหรือสองบรรทัดพร้อมจำนวน
      2. ข้อต้น ๆ (3 ข้อแรก) มีออเดอร์ที่เลยเวลาเตรียมส่ง 4,820 บาท และคำขอคืนเงิน 1,590 บาทที่หมดเขตวันนี้ ส่วนแชตถามสีถามไซซ์ไม่อยู่ใน 3 ข้อแรก
      3. ทุกข้อในรายการหลักมีตัวเลขจากข้อมูล (บาท จำนวนชิ้น จำนวนออเดอร์หรือจำนวนราย อย่างใดอย่างหนึ่งก็พอ · ข้อที่ข้อมูลไม่มียอดบาทใช้จำนวนแทนได้) และขั้นถัดไปที่ทำได้วันนี้ (ตัดสินจากความหมาย ไม่ต้องเขียนคำว่าวันนี้)
      4. ไม่ได้ส่งข้อความหรือยกเลิกออเดอร์แทนเจ้าของ แค่เสนอสิ่งที่ต้องตัดสินใจ
