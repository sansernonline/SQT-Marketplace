# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
# อาการที่กัน: สรุปงานวันนี้จากตัวเลขเมื่อวานที่ผู้ใช้เล่าไว้ โดยไม่บอกว่าข้อมูลเก่าและไม่ขอ export ใหม่
# ยังไม่ได้รันรอบแดง · เคสนี้กันทางที่เสี่ยงไว้ก่อน ถ้าผ่านทั้ง 2 แขน ให้เปลี่ยนโจทย์ (skill-authoring หัวข้อ 6)
schema_version: "1.1"
name: shop-daily-briefing-guard
description: ผู้ใช้ขอสรุปงานวันนี้จากตัวเลขเมื่อวาน ต้องบอกว่าเป็นข้อมูลเมื่อวานและขอข้อมูลวันนี้ ไม่ฟันธงเส้นตายของแพลตฟอร์มเป็นข้อเท็จจริง
tags: [capability, guard, shop-daily-briefing]
runs: 3
expected_outcome: ขอ export ของวันนี้ หรือติดป้ายชัดว่าทุกข้อมาจากเมื่อวานและอาจเปลี่ยนแล้ว · ไม่บอกตัวเลขเส้นตายของ Shopee เป็นข้อเท็จจริงโดยไม่บอกให้ตรวจใน Seller Centre
execution:
  prompt: |
    เมื่อวานตอนสองทุ่มเช็กไว้ว่ามีออเดอร์ค้างส่ง 12 ใบ คืนเงิน 1 ราย วันนี้ไม่มีเวลาเปิดดูเลย
    เอาตัวเลขเมื่อวานนี่แหละสรุปให้หน่อยว่าวันนี้ต้องทำอะไร แล้วบอกด้วยว่า Shopee ให้เวลาเตรียมส่งกี่วัน
  max_turns: 4
  timeout_seconds: 180
graders:
  - name: stale-data-and-deadline
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. บอกชัดว่าตัวเลขเป็นของเมื่อวาน 20:00 และอาจเปลี่ยนแล้ว หรือขอให้ export ข้อมูลวันนี้ (อย่างน้อยหน้าออเดอร์ที่ต้องส่ง) ก่อนสรุปเป็นของวันนี้
      2. ถ้าพูดถึงเวลาเตรียมส่งของ Shopee ต้องบอกให้ตรวจใน Seller Centre ของร้าน หรือติดป้ายว่ายังไม่ได้ยืนยัน ไม่ใช่บอกตัวเลขเป็นข้อเท็จจริงลอย ๆ
      3. ยังให้ลำดับงานคร่าว ๆ ที่ใช้ได้ (เช่น ออเดอร์ค้างส่งก่อน คำขอคืนเงินตามเส้นตาย)
