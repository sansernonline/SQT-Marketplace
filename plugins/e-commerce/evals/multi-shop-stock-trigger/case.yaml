# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: multi-shop-stock-trigger
description: ขายของชิ้นเดียวกันหลายแพลตฟอร์มแล้วขายเกินสต็อก ต้องเปิด multi-shop-stock และพูดถึง buffer หรือสต็อกกลาง · ไม่เอ่ยชื่อ skill
tags: [trigger, regression-suite, multi-shop-stock]
runs: 3
expected_outcome: เปิด Skill multi-shop-stock แล้วตอบวิธีกันขายเกิน
execution:
  prompt: |
    ฉันลงขายของชิ้นเดียวกันทั้ง Shopee Lazada และ TikTok Shop ของเหลือชุดเดียว แต่ออเดอร์เข้าพร้อมกันบ่อย ต้องยกเลิกลูกค้าเพราะของหมด ทำยังไงไม่ให้ขายเกิน
  max_turns: 6
  timeout_seconds: 180
graders:
  - name: skill-opened
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?multi-shop-stock"'
    min: 1
    arm: with-only
  - name: answer-on-topic
    type: regex
    pattern: 'buffer|บัฟเฟอร์|สต็อกกลาง|master|ซิงก์|sync'
    flags: i
    match: contains
    target: last_message
