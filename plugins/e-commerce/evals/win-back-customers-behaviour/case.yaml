# รูปแบบตามเอกสาร code.claude.com/docs/en/plugin-evals (schema 1.1 · ตรวจ 2026-10-23)
schema_version: "1.1"
name: win-back-customers-behaviour
description: ลูกค้า 3 คนรอบซื้อต่างกัน ต้องตัดสินว่าหายไปจากรอบของแต่ละคน ไม่ใช่เส้นเดียวทั้งร้าน และคนที่บ่นแล้วหายขึ้นก่อน
tags: [behaviour, win-back-customers]
runs: 3
expected_outcome: คุณมด (รอบ 14 วัน หาย 40 วัน เคยบ่น) = หายไป อันดับแรก · คุณนก (รอบ 30 วัน หาย 70 วัน) = หายไป · คุณต้น (รอบ 90 วัน หาย 60 วัน) = ยังไม่หาย · ข้อความรายคนมีช่องยกเลิกรับข้อความ · ไม่ตั้งส่วนลดเอง
execution:
  prompt: |
    ร้านขายขนมทาง LINE OA ลูกค้าทุกคนกดยินยอมรับข่าวสารไว้แล้ว นี่คือสรุปประวัติ 12 เดือนครับ
    - คุณมด สั่ง 20 ครั้ง ห่างกันเฉลี่ย 14 วัน ครั้งล่าสุด 40 วันก่อน ยอดรวม 9,800 บาท เคยบ่นว่าขนมแตกเมื่อ 45 วันก่อน
    - คุณนก สั่ง 8 ครั้ง ห่างกันเฉลี่ย 30 วัน ครั้งล่าสุด 70 วันก่อน ยอดรวม 12,400 บาท
    - คุณต้น สั่ง 4 ครั้ง ห่างกันเฉลี่ย 90 วัน ครั้งล่าสุด 60 วันก่อน ยอดรวม 3,100 บาท
    ใครหายไปบ้าง ควรทักใครก่อน แล้วร่างข้อความให้ด้วยครับ
  max_turns: 6
  timeout_seconds: 240
graders:
  - name: rhythm-based-lapse
    type: llm
    focus: last_message
    criteria: |
      ให้ผ่านเมื่อครบทุกข้อ:
      1. ถือว่าคุณมดและคุณนกหายไป ส่วนคุณต้นยังไม่หาย เพราะ 60 วันยังไม่เกินรอบซื้อ 90 วันของเขา
      2. คุณมดอยู่ลำดับแรกหรือถูกเน้นเป็นพิเศษ เพราะบ่นแล้วหยุดซื้อ ข้อความถึงคุณมดพูดถึงเรื่องขนมแตกและสิ่งที่ร้านแก้แล้ว (หรือเว้นช่องให้เจ้าของใส่สิ่งที่แก้)
      3. ข้อความแต่ละฉบับมีวิธียกเลิกรับข้อความ
      4. ไม่ตั้งตัวเลขส่วนลดหรือของแถมเอง ถ้าพูดถึงข้อเสนอ ให้เจ้าของเลือกหรืออนุมัติ
      5. บอกให้เจ้าของอนุมัติก่อนส่ง
