<!-- ตัวอย่างหน้าโต้ตอบ ที่แทรกเข้าเด็คด้วย  pptx_to_html.py deck.pptx --insert 3:interactive-page.html
     กติกา: พิกัดเป็น px บนเวที 1920×1080 · .s = วางตำแหน่ง · data-a = ท่าเข้า (up · pop · box · draw · title)
     --k = ลำดับเข้า · data-step = เปิดเมื่อกด → ครั้งที่ n · id ทุกตัวขึ้นต้นด้วยชื่อหน้า (ip-) กันชนกับหน้าอื่น
     ข้อความในหน้าเปลี่ยนตามงานจริงทั้งหมด — ตัวอย่างนี้คือเครื่องคิด VAT 7% -->
<style>
.ip-card{background:#fff;border:3px solid #1F5FA8;border-radius:16px;padding:22px 26px;font:28px/1.4 Tahoma,'Leelawadee UI',sans-serif;color:#0E2A4D}
.ip-card b{display:block;font-size:22px;color:#1F5FA8;margin-bottom:6px}
.ip-card input{font:32px Consolas,monospace;width:100%;padding:6px 10px;border:2px solid #C9D9EA;border-radius:8px}
.ip-out{font:700 44px Consolas,monospace;color:#C0563F}
</style>
<section class="slide" data-menu="▶ ลองเอง · คำนวณ VAT" style="background:#F2F7FC">
  <div data-a="title" class="s t" style="left:80px;top:46px;width:1600px;height:90px"><div class="tx" style="justify-content:center">
    <p style="font-size:44px"><span style="font-size:44px;font-weight:700;color:#0E2A4D">ลองเอง · ราคารวม VAT คิดอย่างไร</span></p></div></div>
  <div data-a="box" class="s ip-card" style="--k:1;left:80px;top:220px;width:520px;height:170px">
    <b>ขั้น 1 · ใส่ราคาก่อน VAT</b><input id="ip-base" value="1000" inputmode="decimal"></div>
  <svg data-a="draw" data-step="1" class="s ln" data-dir="r" style="left:610px;top:295px;width:90px;height:20px" viewBox="0 0 90 20">
    <line x1="0" y1="10" x2="80" y2="10" stroke="#1F5FA8" stroke-width="4"/><path d="M80,2 L90,10 L80,18 z" fill="#1F5FA8"/></svg>
  <div data-a="box" data-step="1" class="s ip-card" style="left:710px;top:220px;width:520px;height:170px">
    <b>ขั้น 2 · VAT 7%</b><div class="ip-out" id="ip-vat">70.00</div></div>
  <svg data-a="draw" data-step="2" class="s ln" data-dir="r" style="left:1240px;top:295px;width:90px;height:20px" viewBox="0 0 90 20">
    <line x1="0" y1="10" x2="80" y2="10" stroke="#1F5FA8" stroke-width="4"/><path d="M80,2 L90,10 L80,18 z" fill="#1F5FA8"/></svg>
  <div data-a="pop" data-step="2" class="s ip-card" style="left:1340px;top:220px;width:500px;height:170px;border-color:#C0563F">
    <b>ขั้น 3 · ราคารวม</b><div class="ip-out" id="ip-total">1,070.00</div></div>
  <div data-a="up" data-step="2" class="s t" style="left:80px;top:430px;width:1760px;height:60px"><div class="tx">
    <p style="font-size:26px"><span style="font-size:26px;color:#5C6B7A">พิมพ์ตัวเลขในช่องแรกได้เลย ผลคำนวณใหม่ทันที · กด → เปิดทีละขั้น</span></p></div></div>
  <aside>หน้าโต้ตอบ 2 ขั้น · ให้ผู้ฟังเสนอตัวเลข แล้วพิมพ์ในช่องแรก</aside>
</section>
<script>
(() => {
  const base = document.getElementById('ip-base');
  const fmt = v => v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const calc = () => { const b = parseFloat(base.value.replace(/,/g, '')) || 0;
    document.getElementById('ip-vat').textContent = fmt(b * 0.07);
    document.getElementById('ip-total').textContent = fmt(b * 1.07); };
  base.addEventListener('input', calc);
  calc();
})();
</script>
