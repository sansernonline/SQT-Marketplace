<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  body { margin: 0; width: 2160px; height: 1160px; background: #E9E9E6; font: 500 22px/1.4 'JetBrains Mono', monospace; color: #1A1A1A; }
  .head { position: absolute; left: 60px; top: 40px; }
  .card { position: absolute; top: 120px; width: 640px; }
  .card img { width: 640px; height: 905px; display: block; box-shadow: 0 0 0 1px #C8C8C4; }
  .card div { margin-top: 18px; }
</style></head>
<body>
<div class="head" id="head"></div>
<script>
  const q = new URLSearchParams(location.search), p = q.get("p");
  document.getElementById("head").textContent = `${p.toUpperCase()} · cover set · BRD / SRS / ARCH · round 2 final (${q.get("m")})`;
  ["BRD", "SRS", "ARCH"].forEach((d, i) => {
    const c = document.createElement("div"); c.className = "card"; c.style.left = 60 + i * 700 + "px";
    c.innerHTML = `<img src="../../covers/${p}-${d.toLowerCase()}.png"><div>${d}</div>`;
    document.body.appendChild(c);
  });
  Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = i.onerror = r)))
    .then(() => document.fonts.ready).then(() => window.__ready = true);
</script>
</body></html>
