description = "Read a Thai electricity or water bill, log it in the monthly tracker, and investigate any spike against the last three months."
prompt = "Run `household-bills` with the `home-manager` agent for: **{{args}}**\n\nUse the units and amounts printed on the bill, not estimates. Check the current Ft and tariff with กฟน./กฟภ./กกพ. before splitting the bill into its parts; anything not checked is marked (รอยืนยัน). If this month is more than 20% above the 3-month average, run the spike checklist.\n"
