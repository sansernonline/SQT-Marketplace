description = "Plan the family week — meals, groceries, school items, elder appointments, pets — in one table."
prompt = "Run the `family-planner` agent with `meal-plan-grocery`, plus `kids-school`, `elder-care` and `pet-care` for whatever applies to: **{{args}}**\r\n\r\nOutput one week table (day · who · what · bring) followed by the grocery list by store section. Never add or change a medicine dose — copy only what the doctor's sheet says.\n"
