description = "Prepare for a specific interview — story bank, likely questions, mock round, and the thank-you note."
prompt = "Run the `interview-coach` agent with the `interview-prep` skill: **{{args}}**\n\n1. Confirm company, role, round type, language and date.\n2. Build 6–8 STAR stories mapped to the job requirements.\n3. List the 10 most likely questions for this round, including expected salary and why you are leaving.\n4. Offer a mock round — one question at a time, scored.\n5. Prepare 3 questions for the user to ask, and the thank-you note template.\n"
