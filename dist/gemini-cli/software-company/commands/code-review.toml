description = "Run a code review with a fresh reviewer agent and the code-review-checklist skill."
prompt = "> **ทางลัดเข้า SuperUser:** เปิด skill `superuser` ด้วย playbook `review` แล้วคัดลอกขั้นตอนของ playbook ลง todo ก่อน ส่วนขั้นตอนด้านล่างบอกรูปแบบงานและ output ของคำสั่งนี้ ให้ใช้คู่กับ playbook ไม่ได้ใช้แทน\r\n\r\nUse a new `reviewer` agent (read-only) to perform a thorough code review of: **{{args}}** · high-stakes or contested change → `adversarial-review-panel`\r\n\r\nThe reviewer should:\r\n\r\n1. Read the file(s) or diff to understand the change\r\n2. Apply the `code-review-checklist` skill systematically\r\n3. Categorize findings by severity:\r\n   - `blocking:` — must fix before merge\r\n   - `important:` — should fix\r\n   - `nit:` — optional improvement\r\n   - `q:` — questions\r\n   - `praise:` — acknowledge good work\r\n4. Provide concrete suggestions, not just criticism\r\n5. Produce a summary at the end with overall recommendation:\r\n   - ✅ Approve\r\n   - 🔄 Request changes\r\n   - 💬 Comment only\n"
