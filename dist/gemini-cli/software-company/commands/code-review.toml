description = "Run a code review with a fresh reviewer agent and the code-review-checklist skill."
prompt = "> **ทางลัดเข้า SuperUser:** เปิด skill `superuser` ด้วย playbook `review` แล้วคัดลอกขั้นตอนของ playbook ลง todo ก่อน ส่วนขั้นตอนด้านล่างบอกรูปแบบงานและ output ของคำสั่งนี้ ให้ใช้คู่กับ playbook ไม่ได้ใช้แทน\n\nUse a new `reviewer` agent (read-only) to perform a thorough code review of: **{{args}}** · high-stakes or contested change → `adversarial-review-panel`\n\nThe reviewer should:\n\n1. Read the file(s) or diff to understand the change\n2. Apply the `code-review-checklist` skill systematically\n3. Categorize findings by severity:\n   - `blocking:` — must fix before merge\n   - `important:` — should fix\n   - `nit:` — optional improvement\n   - `q:` — questions\n   - `praise:` — acknowledge good work\n4. Provide concrete suggestions, not just criticism\n5. Produce a summary at the end with overall recommendation:\n   - ✅ Approve\n   - 🔄 Request changes\n   - 💬 Comment only\n"
