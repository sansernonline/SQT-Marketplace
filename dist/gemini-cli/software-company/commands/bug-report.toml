description = "File a structured bug report using QA tester + bug-report-template skill."
prompt = "> **ทางลัดเข้า SuperUser:** เปิด skill `superuser` ด้วย playbook `bug-fix` แล้วคัดลอกขั้นตอนของ playbook ลง todo ก่อน ส่วนขั้นตอนด้านล่างบอกรูปแบบงานและ output ของคำสั่งนี้ ให้ใช้คู่กับ playbook ไม่ได้ใช้แทน\r\n\r\nUse the `qa-tester` agent to create a complete bug report for: **{{args}}**\r\n\r\nThe tester should:\r\n\r\n1. Apply the `bug-report-template` skill\r\n2. Gather missing info in one question at the start (unknown → `(รอยืนยัน)`, keep going):\r\n   - Steps to reproduce (exact)\r\n   - Environment details\r\n   - Expected vs actual behavior\r\n   - Frequency\r\n   - Evidence (screenshots, logs)\r\n3. Assess severity (S1-S4) and propose priority (P1-P4)\r\n4. Identify possible root cause hypothesis if visible\r\n5. Produce final bug report in standard format\r\n6. Suggest related test cases that should be added\n"
