# ตรวจทุก push และ PR · รันทั้ง Linux และ Windows เพราะปัญหา CRLF เกิดเฉพาะเครื่องที่ checkout เป็น CRLF (เกิดจริง 2026-10-25)
# ใช้แค่ Node ไม่ติดตั้งอะไรเพิ่ม · claude plugin validate รันใน build-dist.cmd บนเครื่องที่มี Claude Code แทน
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ตัวตรวจยังจับ bug ได้
        run: node scripts/check/validate-marketplace.mjs --self-test
      - name: ตรวจทั้ง repo
        run: node scripts/check/validate-marketplace.mjs
      - name: ตัวตรวจ manifest · เนื้อหา · include · สำเนา skill self-test
        shell: bash
        run: |
          node scripts/check/validate-manifests.mjs --self-test
          node scripts/check/content-checks.mjs --self-test
          node scripts/sync/sync-includes.mjs --self-test
          node scripts/sync/update-skills.mjs --self-test
      - name: manifest ของทุกเครื่องมือถูกต้อง (ต้นฉบับ + dist)
        shell: bash
        run: |

          node scripts/check/validate-manifests.mjs || { echo "::error title=manifest ผิด::แก้ manifest ตามรายการข้างบน ถ้าเป็น dist เก่า รัน node scripts/build/build-targets.mjs แล้ว commit dist/"; exit 1; }
      # ไฟล์ที่สร้างจากต้นฉบับต้องตรงกัน · ไม่ตรง = ล้มพร้อมคำสั่งแก้ที่ต้องรัน (ไม่ให้ bot commit แทน: GITHUB_TOKEN ที่ push ไม่ทำให้ check รอบใหม่รัน และ AGENTS.md ห้าม commit โดยไม่ได้สั่ง)
      - name: ของกลาง superuser ตรงทุก plugin
        shell: bash
        run: |

          node scripts/sync/sync-superuser.mjs --check || { echo "::error title=ของกลาง superuser ไม่ตรง::แก้: รัน node scripts/sync/sync-superuser.mjs แล้ว commit"; exit 1; }
      - name: เอกสารนับ แผนผังไฟล์ กฎร่วมของ prompt และ include ตรงกับของจริง
        shell: bash
        run: |
          node scripts/sync/sync-docs.mjs --check || { echo "::error title=ตัวเลขในเอกสารไม่ตรง::แก้: รัน node scripts/sync/sync-docs.mjs แล้ว commit"; exit 1; }
          node scripts/sync/sync-file-map.mjs --check || { echo "::error title=FILE-MAP ไม่ตรง::แก้: รัน node scripts/sync/sync-file-map.mjs แล้ว commit"; exit 1; }
          node scripts/sync/sync-prompt-rules.mjs --check || { echo "::error title=กฎร่วมของ prompt ไม่ตรง::แก้: รัน node scripts/sync/sync-prompt-rules.mjs แล้ว commit"; exit 1; }
          node scripts/sync/sync-includes.mjs --check || { echo "::error title=marker include ไม่ตรง::แก้: รัน node scripts/sync/sync-includes.mjs แล้ว commit"; exit 1; }
      - name: hook self-test
        run: node plugins/superuser/hooks/superuser-hook.mjs --self-test
      - name: scorecard planner decide และสคริปต์การเงิน self-test
        shell: bash
        run: |
          node plugins/superuser/skills/model-scorecard/scripts/scorecard.mjs --self-test
          node plugins/superuser/skills/parallel-split-and-merge/scripts/plan.mjs --self-test
          node plugins/superuser/skills/decision-scoring/scripts/decide.mjs --self-test
          node plugins/superuser/skills/commit-log/scripts/commit-msg-check.test.mjs
          node plugins/superuser/skills/document-naming/scripts/doc-name-check.test.mjs
          node plugins/superuser/skills/handoff/scripts/log-to-md.test.mjs
          node plugins/superuser/skills/temp-file-discipline/scripts/delete-plan-check.test.mjs
          node plugins/superuser/skills/temp-file-discipline/scripts/root-check.test.mjs
          node plugins/superuser/skills/translate-th-en/scripts/i18n-pair-check.test.mjs
          node scripts/evals/speed/stats.mjs --self-test
          node scripts/evals/skill-grades.mjs --self-test
          node plugins/trading-finance/skills/debt-payoff/scripts/payoff.mjs --self-test
          node plugins/trading-finance/skills/home-refinance/scripts/refinance.mjs --self-test
          node plugins/trading-finance/skills/copy-trade-check/scripts/signal-check.mjs --self-test
          node plugins/trading-finance/skills/position-sizing/scripts/size.mjs --self-test
          node plugins/trading-finance/skills/trade-journal/scripts/trade-stats.mjs --self-test
          node plugins/e-commerce/skills/promptpay-qr/scripts/promptpay.mjs --self-test
          node plugins/e-commerce/skills/e-tax-invoice/scripts/thai-id.mjs --self-test
          node plugins/e-commerce/skills/doc-quotation/scripts/thai-doc-total.mjs --self-test
          node plugins/e-commerce/skills/marketplace-fees-pricing/scripts/price-calc.mjs --self-test
          node plugins/e-commerce/skills/payroll-th/scripts/payroll.mjs --self-test
          node plugins/personal-life/skills/household-bills/scripts/power-bill.mjs --self-test
          node plugins/e-commerce/skills/seller-tax-basics/scripts/tax-compare.mjs --self-test
          node plugins/e-commerce/skills/multi-shop-stock/scripts/stock-calc.mjs --self-test
          node plugins/e-commerce/skills/import-landed-cost/scripts/landed-cost.mjs --self-test
          node plugins/trading-finance/skills/tax-deduction-planner/scripts/tax.mjs --self-test
          node plugins/trading-finance/skills/retirement-plan/scripts/retire.mjs --self-test
          node plugins/trading-finance/skills/portfolio-snapshot/scripts/money-calc.mjs --self-test
          node plugins/trading-finance/skills/technical-signals/scripts/indicators.mjs --self-test
          node plugins/personal-life/skills/important-docs/scripts/due-dates.mjs --self-test
      - name: เทสต์ node:test (ระบุไฟล์ผ่าน glob เพราะ node --test รับโฟลเดอร์ไม่ได้บนเครื่องบางแบบ)
        shell: bash
        run: node --test scripts/evals/ab/*.test.mjs scripts/evals/judge/*.test.mjs plugins/superuser/skills/*/scripts/*.test.mjs
      - name: dist ที่ commit ไว้ตรงกับที่สร้างใหม่
        shell: bash
        run: |
          node scripts/build/build-targets.mjs --self-test
          node scripts/build/build-targets.mjs --check
